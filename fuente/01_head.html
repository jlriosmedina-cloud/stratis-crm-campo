/* ---------- LAPTOP: se aprovecha el ancho de la ventana ----------
   La pantalla de una laptop es cuatro veces más ancha que la de un celular.
   A partir de acá el contenido deja de ser una columna larga y se reparte,
   sin llegar nunca a estirar el texto de borde a borde: eso cansa de leer. */
@media(min-width:1180px){
  main{max-width:1400px;padding:24px 28px 48px}
  .card{padding:18px 20px}
  .cl-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cl{padding:14px 15px}
  .stat-row{gap:12px}

  /* Formularios y ajustes fluyen en dos columnas. Las tarjetas nunca se
     parten a la mitad. */
  .view-form, .view-cols{column-count:2;column-gap:18px}
  .view-form > *, .view-cols > *{break-inside:avoid}
  .view-form > .back,
  .view-form > .sticky-actions{column-span:all}
  .view-form > .card:first-of-type{column-span:all}
  /* Las tarjetas con tabla, y las marcadas como anchas, ocupan todo el ancho:
     así las columnas se reparten parejo en vez de dejar un hueco largo. */
  .view-cols > .card:has(.tbl-wrap),
  .view-cols > .card.ancho{column-span:all}
  .kv-cols{column-count:2;column-gap:26px}
  .kv-cols .kv{break-inside:avoid}

  /* Ajustes en dos columnas. La pantalla no se estira de borde a borde: un
     panel de configuración a 1600px no se lee mejor, se lee peor —los botones
     quedan del largo de la mesa y el ojo pierde la columna—.

     Las columnas son DOS PILAS, no las casillas de una rejilla. Cuando cada
     apartado era una celda suelta, la altura de cada fila la fijaba su
     elemento más alto: «Parámetros del incentivo» mide una pantalla entera, y
     lo que caía debajo en la otra columna —las Descargas, que se usan todos
     los días— arrancaba recién donde ese bloque terminaba. Había que bajar
     media pantalla para llegar a un botón de uso diario, y el hueco al costado
     no lo explicaba nada.

     Con `.aj-col` cada columna fluye sola y ningún apartado espera al vecino.
     Lo que lleva tabla ancha —la bitácora y las reglas— sigue cruzando las dos
     columnas, abajo. */
  .view-ajustes{max-width:1320px;margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:0 26px;align-items:start}
  .view-ajustes > *{min-width:0}
  .aj-col{display:flex;flex-direction:column;min-width:0}
  .view-ajustes > .aj-ancho{grid-column:1 / -1}
  .aj-grid{grid-template-columns:repeat(2,1fr);gap:13px;align-items:stretch}
  .aj-grid.una{grid-template-columns:1fr}
  .aj-sec{margin-bottom:26px}
  .aj-sec > .aj-h h2{font-size:16.5px}
  .aj-reglas{grid-template-columns:repeat(2,1fr);column-gap:32px}
  .aj-yo .quien b{font-size:16.5px}
  .aj-acc{justify-content:flex-start}
  .aj-acc .btn{flex:0 0 auto;min-width:150px}
  .view-form .sticky-actions{position:static;justify-content:flex-end;
    background:none;border-top:1px solid var(--grid);padding-top:14px}
  .view-form .sticky-actions .btn{flex:none;min-width:210px}

  /* El historial deja de ser una tira angosta con la mitad de la pantalla
     vacía: las tarjetas se reparten en columnas. */
  .tl-lectura{max-width:none;column-count:2;column-gap:14px}
  .tl-lectura .tl-item{break-inside:avoid;-webkit-column-break-inside:avoid}
  .tl-lectura .tl-item:before{display:none}
  .tl-lectura.tl{padding-left:0}
  .tl-lectura.tl:before{display:none}

  /* El texto largo no se estira de lado a lado */
  .note, .quote{max-width:820px}
  .view-form .note, .view-form .quote{max-width:none}
  .ev-thumb{max-width:420px}
  .campo-corto input, .campo-corto select{max-width:420px}
}

/* ---------- MONITOR: una columna más ---------- */
@media(min-width:1560px){
  main{max-width:1680px;padding:26px 32px 52px}
  .cl-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat .val{font-size:28px}
  .view-form, .view-cols{column-count:3;column-gap:18px}
  .tl-lectura{column-count:3}
  .kv-cols{column-count:3}
  .view-ajustes{max-width:1140px}
  .grid2{gap:14px}
}

/* ---------- PANTALLA GRANDE: se usa casi todo el ancho ---------- */
@media(min-width:1900px){
  main{max-width:min(1880px, 94vw)}
  .cl-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sel-row{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}

/* =====================================================================
   BARRA LATERAL DE SUPERVISIÓN
   =====================================================================
   Solo para el Analista y el Manager, y solo cuando hay ancho de sobra.
   En un celular una barra lateral es un cajón que se abre y se cierra: peor
   que la fila de abajo, que está a un pulgar. Por eso aparece a partir de
   1100 px y no antes.

   El ejecutivo nunca la ve. Su navegación no cambia. */
.rail{display:none}

@media(min-width:1100px){
  #app.con-rail{
    display:grid;
    grid-template-columns:226px minmax(0,1fr);
    grid-template-areas:"rail cab" "rail vista";
    grid-template-rows:auto 1fr;
  }
  #app.con-rail > header.top{grid-area:cab; position:sticky; top:0}
  #app.con-rail > main{grid-area:vista; padding:22px 26px 44px;
    max-width:1560px; width:100%; margin:0 auto}
  #app.con-rail > nav.bottom{display:none}
  #app.con-rail > .rail{
    grid-area:rail; display:flex; flex-direction:column; gap:20px;
    background:var(--brand); color:#c9d6e8; padding:15px 11px;
    min-height:100dvh; position:sticky; top:0; align-self:start;
    max-height:100dvh; overflow-y:auto;
  }
  .rail .rl-logo{display:flex; gap:9px; align-items:center; padding:2px 6px}
  .rail .rl-logo i{width:30px;height:30px;border-radius:8px;flex:none;font-style:normal;
    background:linear-gradient(140deg,#2a78d6,#7aa8ee);display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:13px}
  .rail .rl-logo b{display:block;color:#fff;font-size:14px;font-weight:700;letter-spacing:-.2px}
  .rail .rl-logo span{display:block;font-size:11px;opacity:.72}
  .rail .rl-grupo{display:flex;flex-direction:column;gap:2px}
  .rail .rl-grupo > p{margin:0 0 6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;opacity:.55}
  .rail button.rl-x{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;width:100%;
    background:none;border:0;color:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;
  }
  .rail button.rl-x:hover{background:rgba(255,255,255,.07)}
  .rail button.rl-x .ic{font-size:15px;line-height:1;width:18px;flex:none;opacity:.85;text-align:center}
  .rail button.rl-x.on{background:rgba(255,255,255,.13);color:#fff}
  .rail button.rl-x.on .ic{opacity:1}
  .rail button.rl-x .cuenta{margin-left:auto;font-size:11px;font-weight:700;background:var(--crit);
    color:#fff;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
  /* El selector de «ver como», al pie de la barra: es un cambio de contexto,
     no una pestaña más, así que no vive entre los enlaces. */
  .rail .rl-como{margin-top:auto;padding:0 6px}
  .rail .rl-como .fsel span{color:#c9d6e8;opacity:.62;font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;font-weight:700}
  .rail .rl-como select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);
    color:#fff;font-size:13px;padding:8px 9px}
  .rail .rl-como select option{color:var(--ink);background:var(--card)}
  .rail .rl-yo{display:flex;gap:9px;align-items:center;padding:11px 8px 2px;margin-top:14px;
    border-top:1px solid rgba(255,255,255,.11)}
  .rail .rl-yo i{width:29px;height:29px;border-radius:50%;background:#2a78d6;display:grid;
    place-items:center;color:#fff;font-size:11px;font-weight:700;font-style:normal;flex:none}
  .rail .rl-yo b{display:block;color:#fff;font-size:12.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail .rl-yo span{display:block;font-size:11px;opacity:.7}
  /* Con la barra lateral el nombre ya está a la vista: la cabecera se queda
     con lo que de verdad es de la ventana —el pulso, el tema y la cuenta—. */
  #app.con-rail > header.top .mark{display:none}
  #app.con-rail > header.top h1{font-size:13.5px;font-weight:600;opacity:.9}
  #app.con-rail > header.top h1 small{display:inline;margin-left:8px}
}

/* Mirar el CRM como un ejecutivo: la franja que lo dice. Ocupa el ancho
   entero a propósito — una pantalla con los datos de otra persona que no lo
   anuncia se lee como si fueran los propios. */
.como-ejec{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 13px}
.como-ejec > div{flex:1 1 300px;min-width:0}
.como-ejec .btn{flex:none}
.como-sel select{min-width:180px}

/* =====================================================================
   TABLERO DE SUPERVISIÓN
   ===================================================================== */
.tab-cab{margin-bottom:12px;display:flex;gap:14px;align-items:flex-end;
  justify-content:space-between;flex-wrap:wrap}
.tab-cab > div:first-child{min-width:0}
.tab-cab h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.tab-periodo{margin-top:3px;font-size:12.5px;color:var(--muted)}

/* Las cuatro cifras contra las que se juzga el periodo. Cada una con su
   mínimo escrito: un porcentaje sin umbral no dice si está bien o mal. */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.kpi{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);
  padding:13px 14px;text-align:left;display:block;width:100%}
button.kpi{border:1px solid var(--grid);cursor:pointer;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--brand-2)}
.kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .val .pc{font-size:15px;font-weight:600}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:6px;min-height:19px}
.medidor{height:5px;border-radius:999px;background:var(--plane);overflow:hidden;margin-top:9px}
.medidor i{display:block;height:100%;border-radius:999px;background:var(--good)}
.medidor.ojo i{background:var(--warn)}
.medidor.alerta i{background:var(--crit)}
/* Verde, ámbar y rojo son un VEREDICTO: dicen «llegó», «va justo», «no llega».
   Solo pueden ir donde hay un mínimo contra el cual llegar. Efectividad y
   Objetivo no tienen mínimo —son conversiones, no requisitos—, y pintarlas de
   verde afirmaba un aprobado que nadie definió: un 23,3% de efectividad salía
   con la misma barra verde que una puntualidad de 100% sobre su mínimo de 95%.
   Estas dos van en el color de marca, que informa proporción y no juzga. */
.medidor.neutro i{background:var(--brand-2)}

/* ---- Las cinco tarjetas del embudo (José, 01/09) -------------------------
   Cuatro escalones más la calidad del registro. Cada escalón lleva su color
   del embudo en una cinta a la izquierda —los mismos cuatro de la lámina del
   directorio y de Registros— para que la tarjeta de arriba y la barra de abajo
   se lean como la misma cosa. El color NO va solo: al lado siempre está el
   rótulo escrito y la cifra, porque los cuatro tonos no pasan el contraste que
   se le puede exigir a un dato leído a solas.

   En móvil y tablet caen a dos columnas y la quinta ocupa el ancho completo:
   la calidad del registro no es un escalón y no debe leerse como el quinto. */
.kpis-embudo{grid-template-columns:1fr 1fr}
.kpi-paso{position:relative;overflow:hidden}
.kpi-paso::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--paso,var(--brand-2))}
.kpi-paso{padding-left:16px}
.kpi-conv{display:inline-block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.kpi-calidad{grid-column:1 / -1}
/* La nota explica de dónde salen las cinco tarjetas; no compite con ellas.
   Sin tamaño propio heredaba el del cuerpo y se leía como el contenido
   principal de la pantalla, que es justo lo que no es. */
.kpi-nota{margin:-4px 2px 14px;font-size:12.5px;line-height:1.5;color:var(--muted)}

/* El detalle del periodo, encima del tablero. Ancho de verdad —las tablas de
   adentro no entran en 520 px— y con su propio desplazamiento, para que el
   tablero de atrás siga quieto. */
.modal.modal-xl{max-width:min(980px, 96vw);max-height:90dvh;padding:0;
  border-radius:16px;display:flex;flex-direction:column}
.pe-det-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;border-bottom:1px solid var(--grid);flex:none}
.pe-det-h b{font-size:15px;letter-spacing:-.2px}
.pe-det-h .x{border:0;background:none;font:inherit;font-size:17px;line-height:1;
  color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:8px}
.pe-det-h .x:hover{background:var(--plane);color:var(--ink)}
.pe-det-c{overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 22px;flex:1;
  min-height:0;-webkit-overflow-scrolling:touch}
.pe-acc{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---- Rutas recomendadas (José, 03/09) -----------------------------------
   Una tarjeta por distrito, con sus tramos dentro. Se lee de pie y con una
   mano: el nombre grande, la dirección debajo en gris, y el enlace a Maps
   arriba del tramo para no tener que recorrer la lista hasta el final. */
/* `minmax(0,1fr)` y `min-width:0` en cascada: sin eso, un hijo ancho —una
   dirección larga, el rótulo del botón— ensancha la pista de la rejilla y la
   tarjeta se sale del teléfono. Y no se ve venir, porque `main` lleva
   `overflow-x:clip`: el desborde queda RECORTADO en vez de aparecer como
   barra, así que `scrollWidth` no lo delata y la única forma de encontrarlo
   es mirar la pantalla o medir el borde derecho contra el ancho de la
   ventana. Pasó acá el 03/09 y se veía el texto cortado a media palabra. */
.rt-lista{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rt-g{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);
  padding:14px 15px 15px;min-width:0}
.rt-g-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rt-g-h b{font-size:15px;letter-spacing:-.3px}
.rt-g-h span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rt-n{flex:none;font-size:20px;font-weight:780;color:var(--brand-2);
  font-variant-numeric:tabular-nums;line-height:1}
.rt-hora{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--plane);
  font-size:12px;color:var(--ink-2);line-height:1.5;min-width:0;overflow-wrap:anywhere}
.rt-hora em{font-style:normal;color:var(--muted)}
.rt-t{margin-top:12px;border:1px solid var(--grid);border-radius:11px;overflow:hidden;min-width:0}
.rt-t-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 12px;
  background:var(--surface-2);border-bottom:1px solid var(--grid)}
.rt-t-h b{font-size:12.5px}
.rt-t-h span{font-size:11.5px;color:var(--muted)}
/* En el teléfono el botón baja a su propia línea y ocupa el ancho: es el
   gesto principal de la tarjeta y a media línea queda con el rótulo cortado. */
.rt-t-h .btn{text-decoration:none;flex:1 1 100%;text-align:center}
@media(min-width:560px){ .rt-t-h .btn{flex:none;margin-left:auto} }
.rt-p{list-style:none;margin:0;padding:0;counter-reset:parada}
.rt-p{min-width:0}
.rt-p li{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;
  border-bottom:1px solid var(--grid);min-width:0;flex-wrap:wrap}
.rt-p li:last-child{border-bottom:0}
.rt-p li::before{counter-increment:parada;content:counter(parada);flex:none;
  width:21px;height:21px;border-radius:50%;background:var(--brand-2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750}
.rt-x{flex:1;min-width:0;text-align:left;border:0;background:none;font:inherit;
  color:inherit;cursor:pointer;padding:0}
.rt-x-n{display:block;font-size:12.5px;font-weight:650;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rt-x-d{display:block;font-size:11px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-p .chip{flex:none}

/* ---- Los filtros del periodo, en la cartera (José, 03/09) ----------------
   Van arriba de los de siempre y con su propio encabezado, porque responden
   otra pregunta: los de abajo miran toda la campaña, estos el periodo en
   curso. Cada uno lleva su cuenta, y el que está en cero se apaga en vez de
   desaparecer —una opción que se esconde cuando no tiene datos hace dudar de
   si existe—. */
.cf-per{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);
  padding:11px 12px 12px;margin-bottom:10px}
.cf-per-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.cf-per-h b{font-size:12.5px;letter-spacing:-.2px}
.cf-per-h span{font-size:11.5px;color:var(--muted)}
.cf-per-x{display:flex;flex-wrap:wrap;gap:6px}
.cf-p{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;
  border:1px solid var(--grid);border-radius:999px;background:var(--card);
  font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer;
  transition:border-color .12s,background .12s}
.cf-p:hover{border-color:var(--brand-2)}
.cf-p .n{font-size:11.5px;font-weight:750;color:var(--ink);
  font-variant-numeric:tabular-nums}
.cf-p.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.cf-p.on .n{color:#fff}
.cf-p.cero{opacity:.5}
.cf-p.cero.on{opacity:1}

/* =========================================================================
   EL PANEL DEL EJECUTIVO (José, 03/09)
   =========================================================================
   Un tablero se mira; si hay que bajar la página para verlo entero ya es un
   informe. En ESCRITORIO la altura la fija la ventana —`100dvh` menos el alto
   de la cabecera— y lo que se desborda vive dentro de su caja, con su propia
   barra. En CELULAR se comporta como una página normal: forzar seis cifras,
   una curva y dos listas dentro de 430 px deja la letra demasiado pequeña
   para leerla en la calle, que es donde se usa. Decisión de José.

   `dvh` y no `vh`: en el navegador del celular la barra de direcciones entra
   y sale, y con `vh` el pie de la pantalla queda debajo de ella. */
.pe{display:flex;flex-direction:column;gap:11px}
.pe-top{display:flex;flex-direction:column;gap:9px}
.pe-tit h2{margin:0;font-size:20px;letter-spacing:-.4px}
.pe-tit span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* Dos columnas en el teléfono, no una: seis tarjetas apiladas son seis
   pantallas de pulgar antes de llegar al gráfico. */
.pe-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pe-k{padding:10px 11px 11px}
.pe-k .lbl{font-size:9.5px;letter-spacing:.05em}
.pe-k .val{font-size:22px;margin-top:3px}
.pe-k .sub{font-size:11px;margin-top:4px;min-height:0;line-height:1.35}

.pe-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:11px;min-height:0}
.pe-cols > *{min-width:0}
.pe-graf{min-width:0}
.pe-lado{display:flex;flex-direction:column;gap:11px;min-height:0}

/* La caja NO crece con los datos. Ese es el punto: el ejecutivo con 40
   retenciones tiene que ver la misma pantalla que el que tiene 2. */
.pe-caja{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pe-caja-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:11px 13px 9px;border-bottom:1px solid var(--grid);flex:none}
.pe-caja-h b{font-size:13px;letter-spacing:-.2px}
.pe-caja-h .num{font-size:15px;font-weight:750;color:var(--ink);
  font-variant-numeric:tabular-nums}
.pe-caja-c{overflow-y:auto;overscroll-behavior:contain;max-height:212px;
  -webkit-overflow-scrolling:touch}
.pe-f{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;
  align-items:baseline;width:100%;text-align:left;padding:8px 13px;
  border:0;border-bottom:1px solid var(--grid);background:none;font:inherit;
  color:inherit;cursor:pointer}
.pe-f:last-child{border-bottom:0}
.pe-f:hover{background:var(--plane)}
.pe-f-n{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pe-f-d{font-size:11px;color:var(--muted);white-space:nowrap}
.pe-f-x{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.pe-vacio{padding:18px 13px;font-size:12.5px;color:var(--muted);text-align:center}

@media(min-width:760px){
  .pe-top{flex-direction:row;align-items:flex-end;justify-content:space-between}
  .pe-kpis{grid-template-columns:repeat(6,1fr)}
  .pe-k .val{font-size:24px}
  .pe-cols{grid-template-columns:minmax(0,1fr) 300px}
}

/* A partir de acá la pantalla NO se desplaza. En vez de restarle a `100dvh`
   un número mágico —que se rompe en cuanto aparece el banner de «ver como»—,
   se fija el alto del armazón y el `main` reparte lo que sobra. Así el
   tablero mide lo que mide la ventana, tenga banner o no. */
@media(min-width:1100px) and (min-height:640px){
  body.pe-fijo{overflow:hidden}
  body.pe-fijo #app{height:100dvh;min-height:0}
  body.pe-fijo #app > main{min-height:0;overflow:hidden;display:flex;flex-direction:column}
  body.pe-fijo #app.con-rail{height:100dvh}
  body.pe-fijo .pe{flex:1;min-height:0}
  body.pe-fijo .pe-cols{flex:1;min-height:0}
  body.pe-fijo .pe-graf{min-height:0;display:flex;flex-direction:column}
  body.pe-fijo .pe-graf .panel{flex:1;min-height:0;display:flex;flex-direction:column}
  body.pe-fijo .pe-graf .grafico{flex:1;min-height:0;display:flex;align-items:center}
  body.pe-fijo .pe-graf .grafico svg{width:100%;height:100%;max-height:100%}
  /* Las dos cajas se reparten el alto y cada una scrollea por dentro. */
  body.pe-fijo .pe-caja{flex:1 1 0;min-height:0}
  body.pe-fijo .pe-caja-c{max-height:none;flex:1;min-height:0}
}
.kpi-nota b{color:var(--ink-2)}

/* `minmax(0,1fr)` en la pista ancha: sin eso, una tabla con encabezados que no
   parten empuja el ancho de la página entera. Es el desborde horizontal más
   común de grid y no se ve hasta que el contenido crece. */
.cols-tab{display:grid;grid-template-columns:minmax(0,1fr);gap:11px;align-items:start}
.cols-tab > *{min-width:0}
.panel{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);padding:15px 16px}
.panel + .panel{margin-top:11px}
.panel h3{margin:0;font-size:14.5px;font-weight:650;display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h3 span{font-size:12px;font-weight:400;color:var(--muted)}
.panel .nota{font-size:12.5px;color:var(--muted);margin:9px 0 0;line-height:1.45}
.panel .nota b{color:var(--ink-2);font-weight:600}

.tabla-cont{overflow-x:auto;margin-top:11px}
/* ---- Actividad del equipo ------------------------------------------------
   Una tabla densa que se lee de arriba abajo como una jornada. La fila entera
   es el objetivo del clic —no un enlace escondido en una celda—, así que lleva
   cursor, foco visible y su propio realce al pasar por encima. */
/* ---- El resumen comparativo por ejecutivo --------------------------------
   Barras apiladas horizontales. Cada tramo lleva 2 px de aire del color del
   fondo entre medio y extremos redondeados de 4 px: sin el aire, dos tramos
   del mismo hue se leen como uno. */
.rz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin:0 0 16px}
.rz-cab{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;
  margin-bottom:18px}
.rz-cab h3{margin:0;font-size:15px}
.rz-kpi{display:flex;gap:22px;flex-wrap:wrap}
.rz-kpi div{text-align:right}
.rz-kpi b{display:block;font-size:21px;line-height:1.1;color:var(--ink);
  font-variant-numeric:tabular-nums}
.rz-kpi div.mal b{color:var(--serious-ink)}
.rz-kpi span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.rz-gs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.rz-t{margin-bottom:12px}
.rz-t b{display:block;font-size:13.5px;color:var(--ink)}
.rz-t span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rz-fila{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rz-n{flex:0 0 108px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rz-pista{flex:1;min-width:0}
.rz-b{display:flex;height:16px;min-width:3px}
.rz-b i{display:block;height:100%}
.rz-b i.rz-ok{background:#2f6fd0;border-radius:4px 0 0 4px}
.rz-b i.rz-no{border-radius:0 4px 4px 0;
  /* Los 2 px de aire van del color del fondo, no de un gris: así el corte se
     lee igual en claro y en oscuro sin repintar nada. */
  box-shadow:inset 2px 0 0 var(--card)}
.rz-b i.rz-no.azulclaro{background:#8fb4e4}
.rz-b i.rz-no.naranja{background:#e0662f}
.rz-b i.rz-ok:only-child,.rz-b i[style*="width:100.0%"]{border-radius:4px}
.rz-v{flex:0 0 96px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rz-v b{font-size:14px;color:var(--ink)}
.rz-v span{font-size:11.5px;color:var(--muted);margin-left:3px}
.rz-v em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2)}
.rz-ley{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.rz-ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;
  vertical-align:-1px}
.rz-ley i.rz-ok{background:#2f6fd0}
.rz-ley i.rz-no.azulclaro{background:#8fb4e4}
.rz-ley i.rz-no.naranja{background:#e0662f}
table.tbl-rz{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:20px}
table.tbl-rz caption{text-align:left;font-size:11.5px;color:var(--muted);padding-bottom:7px}
table.tbl-rz th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:0 0 7px 14px;white-space:nowrap}
table.tbl-rz th:first-child{text-align:left;padding-left:0}
table.tbl-rz td{padding:7px 0 7px 14px;border-top:1px solid var(--grid);text-align:right}
table.tbl-rz td:first-child{text-align:left;padding-left:0;color:var(--ink-2)}
table.tbl-rz td.n{font-variant-numeric:tabular-nums}
table.tbl-rz td.mal{color:var(--serious-ink);font-weight:650}
table.tbl-rz tr.total td{border-top:2px solid var(--line);font-weight:700;color:var(--ink)}
/* En modo oscuro los dos tonos suben un paso: los del claro se apagan sobre el
   fondo hundido. No es un volteo automático, son otros pasos de la misma rampa. */
:root[data-theme="dark"] .rz-b i.rz-ok,:root[data-theme="dark"] .rz-ley i.rz-ok{background:#5a8fe8}
:root[data-theme="dark"] .rz-b i.rz-no.azulclaro,
:root[data-theme="dark"] .rz-ley i.rz-no.azulclaro{background:#3d5f8f}
:root[data-theme="dark"] .rz-b i.rz-no.naranja,
:root[data-theme="dark"] .rz-ley i.rz-no.naranja{background:#e0803f}
@media (max-width:900px){
  .rz-gs{grid-template-columns:1fr;gap:22px}
  .rz-n{flex-basis:88px}
}

/* ---- La alerta de lo que falta por gestionar -----------------------------
   Es un botón, no un aviso: el número no sirve sin la lista detrás. Ocupa el
   ancho entero a propósito — es lo primero que tiene que ver un ejecutivo al
   abrir su panel, por encima de cualquier porcentaje. */
.alerta-gest{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--serious-bg);border:1px solid var(--serious);border-radius:var(--r);
  padding:14px 18px;margin:0 0 14px;cursor:pointer;font:inherit;color:var(--ink);
  transition:box-shadow .12s}
.alerta-gest:hover{box-shadow:var(--sh)}
.alerta-gest .ag-n{font-size:34px;font-weight:800;line-height:1;color:var(--serious-ink);
  font-variant-numeric:tabular-nums;flex:none}
.alerta-gest .ag-t{flex:1;min-width:0}
/* HIJO DIRECTO, no descendiente. El titular de la alerta es un <b> a nivel del
   bloque y va en su propia línea; los <b> que resaltan una palabra DENTRO del
   párrafo explicativo son otra cosa y tienen que quedarse en línea. Con el
   selector de descendencia, «la ÚLTIMA gestión» partía la frase en tres
   renglones y el aviso se leía como una lista de fragmentos. */
.alerta-gest .ag-t > b{display:block;font-size:14.5px;color:var(--serious-ink)}
.alerta-gest .ag-t span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.alerta-gest .ag-t span b{color:var(--ink);font-weight:700}
.alerta-gest .ag-ir{flex:none;font-size:13px;font-weight:650;color:var(--serious-ink);white-space:nowrap}
@media (max-width:640px){
  .alerta-gest{flex-wrap:wrap;gap:10px}
  .alerta-gest .ag-t{flex:1 1 100%;order:3}
  .alerta-gest .ag-ir{margin-left:auto}
}
/* La cobertura como barra, debajo de las cifras: un porcentaje suelto no dice
   si va bien; la barra sí, de un vistazo. */
.cob-linea{margin:6px 2px 0}
.cob-linea .cob-t{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.cob-linea .cob-t b{color:var(--ink);font-size:15px;margin-left:4px}
.cob-linea .cob-t span{color:var(--muted);margin-left:8px;font-size:12.5px}
.cob-linea .pista{height:8px;background:var(--grid);border-radius:5px;overflow:hidden}
.cob-linea .pista i{display:block;height:100%;background:var(--brand-2);border-radius:5px}

table.tbl-act{border-collapse:collapse;width:100%;font-size:13px}
table.tbl-act th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:0 14px 8px 0;white-space:nowrap}
table.tbl-act td{padding:10px 14px 10px 0;border-top:1px solid var(--grid);vertical-align:top}
table.tbl-act tr.act-f{cursor:pointer}
table.tbl-act tr.act-f:hover td{background:var(--surface-2)}
table.tbl-act tr.act-f:focus{outline:none}
table.tbl-act tr.act-f:focus td{background:var(--brand-bg);box-shadow:inset 0 0 0 1px var(--brand-2)}
table.tbl-act tr.act-dia td{padding:16px 0 6px;border-top:none}
table.tbl-act tr.act-dia b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
table.tbl-act tr.act-dia span{color:var(--muted);font-size:12px;margin-left:9px}
.act-h{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;width:60px}
.act-q{color:var(--ink-2);white-space:nowrap;width:130px}
.act-t{min-width:230px}
.act-p{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px;
  vertical-align:middle;flex:none}
.act-t b{font-weight:600}
.act-t span{display:block;margin-left:14px}
.act-d{color:var(--ink-2);font-size:12.5px;margin-top:1px}
.act-n{color:var(--muted);font-size:12px;margin-top:3px;font-style:italic}
.act-av{color:var(--serious-ink);font-size:12px;font-weight:600;margin-top:3px}
.act-c{color:var(--ink);min-width:150px}
.act-id{display:block;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.act-fe{white-space:nowrap;font-variant-numeric:tabular-nums;width:150px}
.act-vacio{color:var(--muted)}
.act-desf{display:block;font-size:11.5px;font-weight:650;margin-top:2px;font-variant-numeric:normal}
.act-desf.atras{color:var(--serious-ink)}
.act-desf.futuro{color:var(--crit-ink)}
/* Lo neutro no es una alarma: una cita para dentro de dos días es su propósito,
   no un error, y en naranja mandaba a revisar lo que estaba bien. */
.act-desf.neutro{color:var(--muted);font-weight:500}
/* Una casilla de verificación con su texto al lado, alineada con los selects
   de al lado en la misma fila de filtros. */
.fchk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
  cursor:pointer;padding:9px 0;user-select:none}
.fchk input{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer;margin:0}
@media (max-width:900px){
  .act-q{width:auto}
  .act-c{min-width:110px}
}

table.tbl-tab{border-collapse:collapse;width:100%;font-size:13px}
/* Ocho columnas desde el 01/09 —los cuatro escalones del embudo más la
   cobertura—, y la tabla vive en la columna izquierda del Tablero, que es la
   mitad del ancho. Con 16 px de separación el encabezado «COBERTURA» quedaba
   fuera del recuadro: la tabla desplazaba, pero un dato que hay que ir a
   buscar es un dato que nadie mira. Se aprieta la separación y la pista de la
   barra hasta que las ocho entran en 1400 px. */
table.tbl-tab th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:0 0 8px 10px;white-space:nowrap}
table.tbl-tab th:first-child{text-align:left;padding-left:0}
table.tbl-tab td{padding:9px 0 9px 10px;border-top:1px solid var(--grid);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl-tab td:first-child{text-align:left;font-weight:600;padding-left:0}
table.tbl-tab tr.total td{border-top:2px solid var(--line);font-weight:700}
.barra-fila{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.barra-fila .pista{width:46px;height:7px;border-radius:999px;background:var(--plane);
  overflow:hidden;flex:none}
.barra-fila .pista i{display:block;height:100%;border-radius:999px;background:var(--brand-2)}
.barra-fila .cifra{width:36px;text-align:right}

/* Lo accionable. Cada línea es un botón que abre su lista: un número sin
   salida obliga a buscar a mano lo que ya se contó. */
.aten{display:flex;flex-direction:column;gap:1px;margin-top:9px}
.aten-x{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:var(--r-sm);
  background:none;border:1px solid transparent;cursor:pointer;font:inherit;color:inherit;
  text-align:left;width:100%}
.aten-x:hover{background:var(--plane);border-color:var(--grid)}
.aten-x .pip{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.aten-x .pip.crit{background:var(--crit)}
.aten-x .pip.warn{background:var(--warn)}
.aten-x .pip.ok{background:var(--good)}
.aten-x .txt{min-width:0;flex:1}
.aten-x b{display:block;font-size:13px;font-weight:650}
.aten-x .txt span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.aten-x .n{margin-left:auto;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}

.minimos{display:flex;flex-direction:column;gap:12px}
.min-h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.min-h b{font-variant-numeric:tabular-nums}
.min-h .de{color:var(--muted);font-weight:400}

.grafico{margin-top:12px}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico .eje{font-size:10px;fill:var(--muted)}
.grafico .rejilla{stroke:var(--grid);stroke-width:1}
.grafico .serie{fill:none;stroke:var(--brand-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grafico .area{fill:var(--brand-2);opacity:.10}
.grafico .punto{fill:var(--brand-2);stroke:var(--card);stroke-width:2}
.grafico .meta{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 4}
.grafico .meta-txt{font-size:10px;fill:var(--crit-ink);font-weight:600;
  paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
/* La cifra de cada día. El borde del color del papel por detrás la hace legible
   cuando cae sobre la línea, sobre el área o sobre la meta. */
.grafico .cifra-punto{font-size:9.5px;font-weight:700;fill:var(--ink-2);
  font-variant-numeric:tabular-nums;
  paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}

/* Todo lo que antes era la pantalla entera sigue acá, un nivel más abajo.
   Nada se perdió: cambió de qué se habla primero. */
.tab-mas{margin-top:14px;border:1px solid var(--grid);border-radius:var(--r);background:var(--card)}
.tab-mas > summary{cursor:pointer;padding:13px 16px;font-size:13.5px;font-weight:650;
  list-style:none;display:flex;align-items:center;gap:9px}
.tab-mas > summary::-webkit-details-marker{display:none}
.tab-mas > summary:before{content:"▸";color:var(--muted);font-size:12px}
.tab-mas[open] > summary:before{content:"▾"}
.tab-mas[open] > summary{border-bottom:1px solid var(--grid)}
.tab-mas-cuerpo{padding:14px 16px 4px}

@media(min-width:900px){
  .kpis{grid-template-columns:repeat(4,1fr);gap:12px}
  /* Con sitio, los cuatro escalones van en fila —que es como se lee un
     embudo— y la calidad debajo, ocupando el ancho, que es su lugar: no es
     un escalón, es la condición de que los cuatro sean ciertos. */
  .kpis-embudo{grid-template-columns:repeat(4,1fr)}
  .kpi .val{font-size:28px}
}
/* En la tablet ya caben dos: el mes y el día del que se habla. Apilarlas
   obligaba a bajar toda la rejilla para ver las visitas del día que se acababa
   de tocar, que es justo el gesto que el calendario existe para servir. La
   columna del día va más angosta que en escritorio —268 px— porque el mes
   necesita sus siete casillas con el número adentro; por debajo de eso la
   rejilla deja de leerse y se adivina. */
@media(min-width:760px) and (max-width:1179px){
  .cal3{grid-template-columns:minmax(0,1fr) 262px;gap:11px}
  .cal3-cola{grid-column:1 / -1}
  .cal3-dia{max-height:none}
  .cal-x{min-height:66px;padding:5px 4px}
  /* En la casilla queda la hora, que es lo accionable. El nombre del comercio
     no entra en 60 px y recortado a dos sílabas no identifica a nadie: vive
     entero en el panel del día, que ahora está al lado y no debajo. */
  .cal3 .cal-ev{font-size:10px;gap:3px}
  .cal3 .cal-ev-n{display:none}
  /* Cinco tarjetas de resumen y cuatro columnas dejaban la quinta sola, con
     tres huecos al lado que no explicaba nada. A 136 px entran las cinco en
     una fila; el texto de abajo se achica para no estirar la tarjeta. */
  .stat-row{grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:9px}
  .stat-row .stat{padding:11px 11px}
  .stat-row .stat .lbl{font-size:10px;letter-spacing:.4px}
  .stat-row .stat .val{font-size:22px}
  .stat-row .stat .sub{font-size:11px;line-height:1.38}
}
@media(min-width:1180px){
  .cols-tab{grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  .tab-cab h2{font-size:21px}
  /* Dos columnas primero: el mes y el día. La cola pasa debajo, a lo ancho. */
  .cal3{grid-template-columns:minmax(0,1fr) 330px}
  .cal3-cola{grid-column:1 / -1}
  .cal3-dia, .cal3-cola{max-height:none}
}
@media(min-width:1500px){
  /* Las tres, una al lado de la otra. Las dos de la derecha se deslizan solas
     para que el calendario siempre quede a la vista. */
  .cal3{grid-template-columns:minmax(0,1fr) 348px 296px}
  .cal3-cola{grid-column:auto}
  .cal3-dia, .cal3-cola{max-height:78vh;overflow-y:auto;padding-right:3px}
  .cal3-dia .card, .cal3-cola .card{margin-bottom:9px}
}

/* La columna del día es angosta a propósito: la tarjeta se aprieta para que
   quepa sin que los botones salten de línea uno debajo del otro. */
.cal3-dia .card{padding:11px 12px}
.cal3-dia .ag-acc{gap:6px}
.cal3-dia .ag-acc .btn{padding:6px 9px;font-size:12.5px}
.cal3-dia .who{font-size:13.5px}
.cal3-dia .dt{font-size:11.5px;line-height:1.35}
.cal3-dia .chip{font-size:10.5px;padding:2px 7px}
/* El filtro por ejecutivo no necesita el ancho de la pantalla. */
.cal-filtro{max-width:340px}

/* ---- Fichas del equipo: una fila por persona, con su botón --------------
   Van de a uno a propósito: se mandan por separado y un PDF de cuatro
   páginas obligaría a partirlo a mano. */
.fq-lista{display:flex;flex-direction:column;gap:8px}
.fq-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--linea);border-radius:9px;padding:10px 12px}
.fq-fila b{font-size:14px}
.fq-det{font-size:12px;color:var(--muted);margin-top:3px}
.fq-pie{font-size:11.5px;color:var(--muted);margin-top:12px}
</style>
</head>

<script>
