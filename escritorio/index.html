<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1137">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("stratis-esc-tema")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Stratis · CRM de campo · escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
:root{ color-scheme:light;
  --navy:#0C1137; --navy-2:#232C86; --azul:#3B43FB; --naranja:#F86F35; --verde:#0BBC96; --rojo:#D6455D; --ambar:#B7791F;
  --ink:#1b2340; --texto:#3F5073; --muted:#7d89a3; --linea:#D3DBEB; --suelo:#EEF1F8; --tarjeta:#FFFFFF; --hover:#F5F7FC;
  --azul-t:#DDE4F4; --naranja-t:#FDE6DA; --verde-t:#DDF5EE; --rojo-t:#FADDE2; --ambar-t:#FBEFD5;
  --rail:#0C1137; --rail-txt:#C9CFEE; --rail-on:#FFFFFF; --rail-line:rgba(255,255,255,.1);
  --sombra:0 6px 18px rgba(12,17,55,.08); --foco:#3B43FB;
  --verde-txt:#07785F; --ambar-txt:#8A5A12; --rojo-txt:#A82E43; --azul-txt:#2A31C9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --ink:#EEF1FA; --texto:#D8DEF0; --muted:#8F99BE; --linea:#2A3360; --suelo:#0B0F26; --tarjeta:#141A3A; --hover:#1B224A;
    --azul-t:#1E2760; --naranja-t:#4A2616; --verde-t:#0F3A31; --rojo-t:#4A1E29; --ambar-t:#3E2E10;
    --rail:#070A1C; --rail-txt:#AEB6DC; --sombra:0 6px 18px rgba(0,0,0,.35);
    --verde-txt:#5FE3C1; --ambar-txt:#F0C674; --rojo-txt:#FF8FA3; --azul-txt:#9FA6FF; --navy-2:#9FA6FF;
  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --ink:#EEF1FA; --texto:#D8DEF0; --muted:#8F99BE; --linea:#2A3360; --suelo:#0B0F26; --tarjeta:#141A3A; --hover:#1B224A;
  --azul-t:#1E2760; --naranja-t:#4A2616; --verde-t:#0F3A31; --rojo-t:#4A1E29; --ambar-t:#3E2E10;
  --rail:#070A1C; --rail-txt:#AEB6DC; --sombra:0 6px 18px rgba(0,0,0,.35);
  --verde-txt:#5FE3C1; --ambar-txt:#F0C674; --rojo-txt:#FF8FA3; --azul-txt:#9FA6FF; --navy-2:#9FA6FF;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{height:100%}
body{margin:0;background:var(--suelo);color:var(--texto);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--azul-txt)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- shell ---------- */
#app{height:100%}
.app{display:grid;grid-template-columns:232px 1fr;height:100%;min-height:100%}
.rail{background:var(--rail);color:var(--rail-txt);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.rail .marca{font-weight:800;letter-spacing:.14em;color:var(--naranja);font-size:12px;padding:6px 10px}
.rail .prod{color:var(--rail-on);font-weight:800;font-size:16px;padding:0 10px 14px;line-height:1.2}
.rail .prod small{display:block;color:var(--rail-txt);font-weight:600;font-size:11.5px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--rail-txt);padding:10px 10px;border-radius:10px;text-align:left;font-weight:600;width:100%}
.nav button:hover{background:var(--rail-line);color:var(--rail-on)}
.nav button.on{background:var(--naranja);color:#fff}
.nav button svg{width:18px;height:18px;flex:none}
.nav button .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 7px;border-radius:99px}
.nav button.on .cnt{background:rgba(255,255,255,.25)}
.nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--rail-txt);opacity:.7;padding:14px 10px 4px}
.rail .pie{margin-top:auto;padding:10px;font-size:11.5px;line-height:1.4;border-top:1px solid var(--rail-line)}
.rail .pie b{color:var(--rail-on);display:block}
.rail .muestra{font-size:10.5px;background:rgba(248,111,53,.18);color:#FFC5A8;padding:6px 8px;border-radius:8px;margin:8px 0 0}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--linea);background:var(--tarjeta);flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .der{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(11,188,150,.5);animation:pulso 2s infinite}
.vivo.pausa i{background:var(--muted);animation:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(11,188,150,.45)}70%{box-shadow:0 0 0 7px rgba(11,188,150,0)}100%{box-shadow:0 0 0 0 rgba(11,188,150,0)}}
.per{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linea);border-radius:10px;padding:6px 10px;font-size:12.5px;background:var(--tarjeta)}
.per b{color:var(--ink)}
.usuario{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--navy-2);flex:none}
.contenido{flex:1;overflow:auto;padding:18px 22px;min-height:0}

.btn{border:1px solid var(--linea);background:var(--tarjeta);border-radius:9px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.p:hover{filter:brightness(1.05)}
.btn.v{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.a{background:var(--ambar);border-color:var(--ambar);color:#fff}
.btn.r{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.q{border-color:transparent;background:transparent;color:var(--azul-txt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn kbd{font-family:inherit;font-size:10.5px;background:rgba(0,0,0,.12);padding:1px 5px;border-radius:5px;margin-left:2px}

/* ---------- resumen ---------- */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tile .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:4px}
.tile .v small{font-size:12px;font-weight:600;color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}
.tile.warn .v{color:var(--ambar-txt)} .tile.bad .v{color:var(--rojo-txt)} .tile.ok .v{color:var(--verde-txt)} .tile.acc .v{color:var(--naranja)}

/* ---------- validación: cola + ficha ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.panel{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.barra{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--tarjeta);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--texto);display:inline-flex;align-items:center;gap:6px}
.chip .c{font-size:11px;background:var(--suelo);color:var(--muted);padding:0 6px;border-radius:99px;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .c{background:rgba(255,255,255,.2);color:#fff}
select.sel{border:1px solid var(--linea);background:var(--tarjeta);border-radius:9px;padding:5px 8px;font-size:12.5px}
.barra .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

table.cola{width:100%;min-width:720px;border-collapse:collapse;font-size:12.5px}
table.cola th{position:sticky;top:0;background:var(--tarjeta);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--linea);z-index:1}
table.cola td{padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:middle}
table.cola tr.f{cursor:pointer}
table.cola tr.f:hover td{background:var(--hover)}
table.cola tr.f.sel td{background:var(--azul-t)}
table.cola tr.nueva td{animation:llega 1.6s ease-out}
@keyframes llega{0%{background:var(--naranja-t)}100%{background:transparent}}
.tabla-wrap{max-height:calc(100vh - 330px);overflow:auto}
.ej{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ej .avatar{width:22px;height:22px;font-size:9.5px}
.com b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.com small{color:var(--muted);font-size:11.5px;white-space:nowrap;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.res{line-height:1.3;white-space:nowrap}
.res small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.res small{display:block;color:var(--muted);font-size:11.5px}
.dist{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.dist i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dist.ok i{background:var(--verde)} .dist.med i{background:var(--ambar)} .dist.mal i{background:var(--rojo)} .dist.no i{background:var(--muted)}
.dist small{color:var(--muted);font-weight:400}
.senal{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--ambar-t);color:var(--ambar-txt);margin:1px 3px 1px 0;white-space:nowrap}
.senal.r{background:var(--rojo-t);color:var(--rojo-txt)} .senal.i{background:var(--azul-t);color:var(--azul-txt)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pend{background:var(--suelo);color:var(--texto);border:1px dashed var(--muted)}
.pill.val{background:var(--verde-t);color:var(--verde-txt)}
.pill.obs{background:var(--ambar-t);color:var(--ambar-txt)}
.pill.anu{background:var(--rojo-t);color:var(--rojo-txt)}
td.chk{width:30px}
input[type=checkbox]{accent-color:var(--naranja);width:15px;height:15px}
.vacio{padding:36px 20px;text-align:center;color:var(--muted)}

/* ficha */
.ficha{position:sticky;top:0}
.ficha .cab{padding:14px 16px;border-bottom:1px solid var(--linea)}
.ficha .cab h2{font-size:15.5px;font-weight:800}
.ficha .cab .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.ficha .cab .meta b{color:var(--texto);font-weight:600}
.ficha .cuerpo{padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 260px);overflow:auto}
.ficha h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.hechos{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px}
.hechos div{border-top:1px solid var(--linea);padding-top:6px}
.hechos small{display:block;color:var(--muted);font-size:11px}
.hechos b{color:var(--ink);font-weight:600}
.coment{background:var(--suelo);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.coment .ed{font-size:11px;color:var(--muted);margin-top:4px}
.mapa{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--suelo)}
.mapa > svg{display:block;width:100%;height:auto}
.mapa-real{height:270px;width:100%;background:var(--suelo)}
.mapa .leyenda{display:flex;flex-direction:column;gap:5px;padding:9px 11px;font-size:12px;color:var(--texto);border-top:1px solid var(--linea);background:var(--tarjeta)}
.mapa .leyenda em{font-style:normal;color:var(--muted)}
.mapa .leyenda .nota-mapa{color:var(--muted);font-size:11.5px}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--tarjeta);box-shadow:0 0 0 1px var(--linea)}
.pt.ref{background:var(--navy-2)} .pt.act{background:var(--muted)}
.pt.vis.ok{background:var(--verde)} .pt.vis.med{background:var(--ambar)} .pt.vis.mal{background:var(--rojo)} .pt.vis.no{background:var(--muted)}
.mapa .links{display:flex;gap:12px;flex-wrap:wrap}
.leaflet-tooltip.etq{font-family:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tarjeta);color:var(--ink);border:1px solid var(--linea);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.leaflet-tooltip.etq::before{display:none}
.leaflet-container{font-family:inherit}
:root[data-theme="dark"] .mapa-real .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-control-attribution{font-size:9px}
.mapa .pie{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--linea);background:var(--tarjeta);flex-wrap:wrap;gap:6px}
.linea-t{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:14px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:12.5px}
.ev::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--linea)}
.ev:last-child::before{display:none}
.ev i{width:13px;height:13px;border-radius:50%;background:var(--linea);border:3px solid var(--tarjeta);box-shadow:0 0 0 1px var(--linea);margin-top:2px}
.ev.reg i{background:var(--azul)} .ev.ed i{background:var(--ambar)} .ev.val i{background:var(--verde)} .ev.obs i{background:var(--ambar)} .ev.anu i{background:var(--rojo)} .ev.tr i{background:var(--navy-2)}
.ev b{color:var(--ink);font-weight:600}
.ev small{display:block;color:var(--muted);font-size:11.5px}
.ev .ad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px;font-size:11.5px}
.ev .ad span{background:var(--suelo);border-radius:7px;padding:5px 8px}
.ev .ad span em{font-style:normal;display:block;color:var(--muted);font-size:10.5px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--linea);background:var(--tarjeta);position:sticky;bottom:0}
.motivo{display:none;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--linea);background:var(--suelo)}
.motivo.on{display:flex}
.motivo label{font-size:12px;color:var(--muted)}
.motivo select,.motivo textarea{border:1px solid var(--linea);border-radius:9px;padding:8px 10px;background:var(--tarjeta);width:100%;font-size:12.5px;resize:vertical}
.motivo .fila{display:flex;gap:8px;justify-content:flex-end}
.aviso{font-size:12px;padding:9px 12px;border-radius:9px;background:var(--azul-t);color:var(--azul-txt)}
.aviso.ok{background:var(--verde-t);color:var(--verde-txt)} .aviso.mal{background:var(--rojo-t);color:var(--rojo-txt)} .aviso.warn{background:var(--ambar-t);color:var(--ambar-txt)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12px}
.hist div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--linea);padding-top:6px}
.hist span{color:var(--muted)}

/* ---------- auditoría ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--naranja);border-bottom-color:var(--naranja)}
.grid2{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.buscar{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);border-radius:10px;padding:7px 10px;background:var(--tarjeta)}
.buscar input{border:0;background:none;flex:1;outline:none;font-size:13px;min-width:0}
.buscar svg{width:16px;height:16px;color:var(--muted);flex:none}
.lista{display:flex;flex-direction:column}
.lista button{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--linea);padding:10px 12px;text-align:left;width:100%}
.lista button:hover{background:var(--hover)}
.lista button.on{background:var(--azul-t)}
.lista .t{flex:1;min-width:0}
.lista .t b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .t small{color:var(--muted);font-size:11.5px}
.lista .n{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){ .cards{grid-template-columns:1fr} }
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px 16px}
.card h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mini div{border-top:2px solid var(--linea);padding-top:6px}
.mini b{display:block;font-size:18px;font-weight:800;color:var(--ink);line-height:1.1}
.mini small{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
.mini div.mal{border-top-color:var(--rojo)} .mini div.med{border-top-color:var(--ambar)} .mini div.ok{border-top-color:var(--verde)}
.hist-h{margin-top:8px}
/* ---------- por ejecutivo ---------- */
.leyenda-ej{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.leyenda-ej i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leyenda-ej i.meta{width:16px;height:0;border-top:2px dashed var(--naranja);border-radius:0;vertical-align:3px}
.leyenda-ej span:first-child{color:var(--naranja);font-weight:700}
table.matriz th.dia,table.matriz td.dia{text-align:center;padding:6px 3px;min-width:46px}
table.matriz th.dia{font-size:10px;line-height:1.3}
table.matriz th.dia.hoy{color:var(--naranja)}
table.matriz th.finde{opacity:.7}
table.matriz td.dia button{width:40px;height:32px;border-radius:8px;border:1px solid transparent;font-weight:800;font-size:13px;position:relative;font-variant-numeric:tabular-nums;background:var(--suelo);color:var(--muted)}
table.matriz td.dia button:not([disabled]):hover{border-color:var(--ink)}
table.matriz td.dia button[disabled]{cursor:default}
table.matriz td.c1 button{background:var(--rojo-t);color:var(--rojo-txt)}
table.matriz td.c2 button{background:var(--ambar-t);color:var(--ambar-txt)}
table.matriz td.c3 button{background:var(--verde-t);color:var(--verde-txt)}
table.matriz td.hoy button{box-shadow:0 0 0 2px var(--naranja-t)}
table.matriz td.dia button .pd{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--naranja)}

<script>
/* =========================================================================
   Stratis · CRM de campo v2 — Escritorio del analista
   Valida gestiones en tiempo real, audita y carga transacciones.
   Lee v2_actividad / v2_mi_base / v2_avance; escribe solo por RPC.
   ========================================================================= */
"use strict";
const SUPABASE_URL = "https://xwvpnagvdrjffayzsnke.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-WtGPS_yJYllxVMR0RCDQg_kQHLHSPq";   // publicable por diseño
const BUILD = "1ac7a8";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"stratis-v2-sesion" } });

/* ---------- reglas de las señales (umbrales) ---------- */
const REGLA = { cerca:150, lejos:500, precision:60, jornadaIni:8, jornadaFin:20, retrasoMin:30, comentarioMin:12, ritmoMin:8 };
const OBS_MOTIVOS = ["Visita lejos del comercio","GPS impreciso","Comentario insuficiente","Comercio repetido en el día","Hora fuera de jornada","El resultado no coincide con el comentario","Otro"];
const ANU_MOTIVOS = ["Comercio equivocado","Visita duplicada","Registro de prueba","No hubo visita presencial","Otro"];
const COLORES = ["#8B5CF6","#3B43FB","#F86F35","#0BBC96","#B7791F","#D6455D"];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TZ = "America/Lima";
const D = x => x instanceof Date ? x : new Date(x);
const hh = d => d ? D(d).toLocaleTimeString("en-GB",{ timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false }) : "—";
const dd = d => d ? D(d).toLocaleDateString("en-GB",{ timeZone:TZ, day:"2-digit", month:"2-digit" }) : "—";
const ddhh = d => d ? `${dd(d)} ${hh(d)}` : "—";
const iso = d => D(d).toLocaleDateString("en-CA",{ timeZone:TZ });
const horaLima = d => Number(D(d).toLocaleTimeString("en-GB",{ timeZone:TZ, hour:"2-digit", hour12:false }).slice(0,2));
const fISO = s => s ? String(s).split("-").reverse().slice(0,2).join("/") : "—";
const hoyISO = () => new Date().toLocaleDateString("en-CA",{ timeZone:TZ });
const ayerISO = () => { const d = new Date(hoyISO() + "T12:00:00Z"); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); };
const mDist = m => m == null ? "sin ubicación" : m < 1000 ? `${m} m` : `${(m/1000).toFixed(1).replace(".",",")} km`;
const claseDist = v => v.distancia_m == null ? "no" : v.distancia_m <= REGLA.cerca ? "ok" : v.distancia_m <= REGLA.lejos ? "med" : "mal";
const tasa = v => v == null ? "—" : (Number(v)*100).toFixed(2).replace(".",",") + " %";
const nombreCorto = n => String(n || "").split(" ")[0];
const num = n => Number(n || 0).toLocaleString("es-PE");

/* ---------- estado ---------- */
const S = { sesion:null, yo:null, admin:false, periodo:null, cargando:true, error:"",
  vista:"validacion", filtro:"pend", ej:"todos", dia:"hoy", soloSenal:false, sel:null, marcadas:new Set(), accion:null, ocupado:false,
  act:[], actEn:null, base:[], baseMap:{}, ejecutivos:[], bit:{}, trx:{}, nuevas:new Set(), pausa:false, ultimaRecep:null,
  tab:"traza", traza:null, busca:"", carga:{ tipo:"diario", archivo:null, filas:null, hecho:false, resultado:null }, cargas:[], avance:null, avanceErr:"" };

const ICON = {
  cola:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  aud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v3l2 2"/></svg>',
  carga:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>',
  ind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  lupa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  equipo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  luna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  salir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
};

/* ---------- tema ---------- */
const temaActual = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";
function cambiarTema(){
  const t = temaActual() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("stratis-esc-tema", t); } catch(e){}
  pintar();
}

/* ---------- ejecutivos y avatares ---------- */
function ejDe(correo){
  let e = S.ejecutivos.find(x => x.correo === correo);
  if (!e){
    const v = S.act.find(x => x.correo === correo);
    e = { correo, nombre: v ? v.ejecutivo : correo, ini: iniciales(v ? v.ejecutivo : correo), color: COLORES[S.ejecutivos.length % COLORES.length] };
    S.ejecutivos.push(e);
  }
  return e;
}
const iniciales = n => String(n || "?").split(/[\s.@]+/).filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join("");
const AVATAR = e => `<span class="avatar" style="background:${e.color}">${esc(e.ini)}</span>`;
const nomDe = correo => { if (!correo) return "—"; if (S.yo && correo === S.yo.correo) return `${nombreCorto(S.yo.nombre_corto || S.yo.nombre)} (tú)`; const e = S.ejecutivos.find(x => x.correo === correo); return e ? e.nombre : correo.split("@")[0]; };

/* ---------- lectura de una visita ---------- */
const estadoDe = v => v.estado_anul === "anulada" ? "anu" : v.validacion === "validada" ? "val" : v.validacion === "observada" ? "obs" : "pend";
const ESTADO = { pend:["pend","Por validar"], val:["val","Validada"], obs:["obs","Observada"], anu:["anu","Anulada"] };
const pill = v => { const k = estadoDe(v); return `<span class="pill ${ESTADO[k][0]}">${ESTADO[k][1]}</span>`; };
const esHoy = v => iso(v.visitado_en) === hoyISO();
const esAyer = v => iso(v.visitado_en) === ayerISO();
const resumenRes = v => { const l2 = `${v.que}${v.decision ? " · " + v.decision : ""}${v.fecha_reagenda ? " · " + fISO(v.fecha_reagenda) : ""}`; return `${esc(v.con)}${v.motivo ? " · " + esc(v.motivo) : ""}<small title="${esc(l2)}">${esc(l2)}</small>`; };
function repetidaHoy(v){ const d = iso(v.visitado_en); return S.act.some(x => x.id !== v.id && x.customer_id === v.customer_id && x.correo === v.correo && iso(x.visitado_en) === d && x.estado_anul !== "anulada"); }
function senales(v){
  const s = [];
  if (v.distancia_m == null) s.push(["r", v.lat == null ? "Sin GPS" : "Comercio sin punto"]);
  else if (v.distancia_m > REGLA.lejos) s.push(["r", `A ${mDist(v.distancia_m)} del comercio`]);
  else if (v.distancia_m > REGLA.cerca) s.push(["", `A ${v.distancia_m} m`]);
  if (v.precision_m != null && Number(v.precision_m) > REGLA.precision) s.push(["", `GPS ±${Math.round(v.precision_m)} m`]);
  const h = horaLima(v.visitado_en); if (h < REGLA.jornadaIni || h >= REGLA.jornadaFin) s.push(["r","Fuera de jornada"]);
  if (repetidaHoy(v)) s.push(["","Repetida hoy"]);
  if (v.motivo === "Dirección errada" || v.direccion_ok === false) s.push(["i","Dirección no es correcta"]);
  if (v.resultado_editado_en) s.push(["i","Resultado corregido"]);
  if (v.comentario_editado_en) s.push(["i","Comentario corregido"]);
  if (v.estado_anul === "pendiente") s.push(["r","Pide anulación"]);
  if ((v.comentario || "").trim().length < REGLA.comentarioMin) s.push(["","Comentario corto"]);
  const lag = (D(v.recibido_en) - D(v.visitado_en))/60000; if (lag > REGLA.retrasoMin) s.push(["", `Llegó ${Math.round(lag)} min después`]);
  return s;
}

/* =========================================================================
   Datos
   ========================================================================= */
async function cargar(){
  S.cargando = true; S.error = ""; pintar();
  try {
    const hoy = hoyISO();
    const [u, p] = await Promise.all([
      sb.from("usuarios").select("correo,nombre,nombre_corto,rol,activo").eq("correo", S.sesion.user.email.toLowerCase()).maybeSingle(),
      sb.from("v2_periodos").select("*").lte("ini", hoy).gte("fin", hoy).maybeSingle(),
    ]);
    if (u.error) throw u.error;
    if (!u.data || !u.data.activo) throw new Error("Tu usuario no está activo en el CRM.");
    S.yo = u.data; S.admin = ["Analista","Manager"].includes(u.data.rol);
    if (!S.admin) throw new Error("Esta vista es solo para el analista y el manager. En el celular tienes tu CRM de campo.");
    S.periodo = p.data || null;
    const us = await sb.from("usuarios").select("correo,nombre,nombre_corto,rol,activo").eq("activo", true).order("nombre");
    S.ejecutivos = (us.data || []).filter(x => x.rol === "Ejecutivo").map((x, i) => ({ correo:x.correo, nombre:x.nombre_corto || x.nombre, ini:iniciales(x.nombre_corto || x.nombre), color:COLORES[i % COLORES.length] }));
    await Promise.all([cargarActividad(true), cargarBase(), cargarAvance()]);
  } catch(e){ S.error = e.message || String(e); }
  S.cargando = false; pintar();
  escuchar();
}
async function cargarActividad(silencio){
  if (S._actCargando) return; S._actCargando = true;
  const desde = (S.periodo && S.periodo.ini) || ayerISO();
  const { data, error } = await sb.rpc("v2_actividad", { p_desde: desde, p_hasta: hoyISO() });
  S._actCargando = false;
  if (error){ if (!silencio) toast("No se pudo actualizar: " + error.message); return; }
  const firma = JSON.stringify(data || []);
  if (silencio && firma === S._firma){ S.actEn = new Date(); const el = $("#ahora"); if (el) el.textContent = hh(S.actEn); return; }
  S._firma = firma;
  const antes = new Set(S.act.map(v => v.id));
  const nuevas = (data || []).filter(v => !antes.has(v.id));
  S.act = data || [];
  S.actEn = new Date();
  const ult = S.act.reduce((m, v) => v.recibido_en > m ? v.recibido_en : m, "");
  S.ultimaRecep = ult ? new Date(ult) : null;
  if (antes.size && nuevas.length){
    nuevas.forEach(v => S.nuevas.add(v.id));
    const v = nuevas[0]; toast(`${nuevas.length === 1 ? "Nueva visita" : nuevas.length + " visitas nuevas"} · ${ejDe(v.correo).nombre}: ${v.comercio}${senales(v).length ? " · con señales" : ""}`);
    setTimeout(() => { nuevas.forEach(v => S.nuevas.delete(v.id)); }, 2500);
  }
  // se invalidan las bitácoras cargadas, por si hubo cambios
  if (!silencio) S.bit = {};
  pintar();
}
async function cargarBase(){
  const { data } = await sb.rpc("v2_mi_base");
  S.base = data || []; S.baseMap = {}; S.base.forEach(c => { S.baseMap[c.customer_id] = c; });
}
async function bitacora(id){
  if (S.bit[id]) return S.bit[id];
  const { data } = await sb.from("v2_bitacora_visita").select("*").eq("visita_id", id).order("en");
  S.bit[id] = data || []; pintar(); return S.bit[id];
}
async function transacciones(cid){

function escuchar(){

  try {
    sb.channel("escritorio-visitas").on("postgres_changes", { event:"*", schema:"public", table:"v2_visitas" }, () => { clearTimeout(S._rt); S._rt = setTimeout(() => cargarActividad(true), 800); }).subscribe();

  setInterval(() => { if (!S.pausa && document.visibilityState === "visible") cargarActividad(true); }, 30000);

function textoVivo(){
  if (!S.ultimaRecep) return "En vivo · sin visitas todavía";
  const seg = Math.max(0, Math.round((Date.now() - S.ultimaRecep)/1000));
  return `En vivo · última recepción hace ${seg < 60 ? seg + " s" : seg < 3600 ? Math.round(seg/60) + " min" : Math.round(seg/3600) + " h"}`;
}

async function accion(id, tipo, motivo, nota){
  if (S.ocupado) return; S.ocupado = true; pintar();
  const v = S.act.find(x => x.id === id);
  try {
    let r;
    if (tipo === "val") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"validada", p_nota:nota || null });
    else if (tipo === "obs") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"observada", p_motivo:motivo, p_nota:nota || null });
    else if (tipo === "cola") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"pendiente", p_nota:nota || null });
    else if (tipo === "anu") r = v && v.estado_anul === "pendiente" ? await sb.rpc("v2_resolver_anulacion", { p_visita_id:id, p_aprobar:true, p_nota:[motivo, nota].filter(Boolean).join(" · ") }) : await sb.rpc("v2_anular_visita", { p_visita_id:id, p_motivo:motivo, p_nota:nota || null });
    else if (tipo === "rest") r = await sb.rpc("v2_restituir_visita", { p_visita_id:id, p_nota:nota || null });
    else if (tipo === "rech") r = await sb.rpc("v2_resolver_anulacion", { p_visita_id:id, p_aprobar:false, p_nota:nota || null });
    if (r && r.error) throw r.error;
    delete S.bit[id];
    S.accion = null;
    await cargarActividad(true);
    return true;
  } catch(e){ toast("No se pudo: " + (e.message || e)); return false; }
  finally { S.ocupado = false; pintar(); }
}

function puntoRef(v){
  if (v.ref_lat != null) return { lat:v.ref_lat, lng:v.ref_lng, cal:v.ref_calidad, nota:v.ref_nota };
  if (v.geo_lat != null) return { lat:v.geo_lat, lng:v.geo_lng, cal:v.geo_calidad, nota:"punto actual del comercio" };
  return null;
}
const CAL_TXT = { numero:"dirección con número", calle:"dirección a nivel de calle", comercio:"el local ubicado por nombre", distrito:"solo el distrito (aproximado)", lugar:"un lugar de referencia", visita:"el GPS de otra visita", sunat:"la dirección fiscal de SUNAT", sin_ubicar:"sin ubicar" };
const gmaps = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
function mapa(v){
  const r = puntoRef(v);
  const regla = `<span>Hasta ${REGLA.cerca} m se valida sin mirar; de ${REGLA.cerca} a ${REGLA.lejos} m se revisa; más de ${REGLA.lejos} m se observa.</span>`;
  if (v.lat == null) return `<div class="mapa"><div class="vacio" style="padding:22px">La visita llegó sin ubicación. No se puede comparar con el punto del comercio.</div>${r ? `<div class="pie"><span></span><a href="${gmaps(r.lat, r.lng)}" target="_blank" rel="noopener">Ver el comercio en Google Maps ↗</a></div>` : ""}</div>`;
  const col = claseDist(v);
  const actualDistinto = v.geo_lat != null && r && v2m(v.geo_lat, v.geo_lng, r.lat, r.lng) > 15 && v2m(v.geo_lat, v.geo_lng, v.lat, v.lng) > 15;
  const anclado = v.geo_lat != null && r && v2m(v.geo_lat, v.geo_lng, v.lat, v.lng) <= 3 && v2m(r.lat, r.lng, v.lat, v.lng) > 15;
  return `<div class="mapa">
    <div id="mapaVisita" class="mapa-real" data-id="${v.id}"></div>
    <div class="leyenda">
      <span><i class="pt ref"></i><b>Comercio</b> · ${r ? esc(r.nota || CAL_TXT[r.cal] || "punto de la base") : "sin punto"}${r && r.cal && CAL_TXT[r.cal] && r.nota !== CAL_TXT[r.cal] ? ` <em>(${esc(CAL_TXT[r.cal])})</em>` : ""}</span>
      <span><i class="pt vis ${col}"></i><b>Visita</b> · ${esc(nombreCorto(ejDe(v.correo).nombre))} a las ${hh(v.visitado_en)} · GPS ±${Math.round(Number(v.precision_m) || 0)} m · <b class="dist ${col}" style="display:inline">${mDist(v.distancia_m)}</b> del comercio</span>
      ${actualDistinto ? `<span><i class="pt act"></i><b>Punto actual del comercio</b> · ${esc(CAL_TXT[v.geo_calidad] || v.geo_calidad || "")}</span>` : ""}
      ${anclado ? `<span class="nota-mapa">La ficha del comercio quedó anclada a este GPS después de la visita, por eso el punto de comparación es el que tenía antes.</span>` : ""}
    </div>
    <div class="pie">${regla}<span class="links">${r ? `<a href="${gmaps(r.lat, r.lng)}" target="_blank" rel="noopener">Comercio ↗</a>` : ""}<a href="${gmaps(v.lat, v.lng)}" target="_blank" rel="noopener">Visita ↗</a>${r && (v.distancia_m || 0) > 10 ? `<a href="https://www.google.com/maps/dir/?api=1&origin=${v.lat},${v.lng}&destination=${r.lat},${r.lng}&travelmode=walking" target="_blank" rel="noopener">Ruta entre ambos ↗</a>` : ""}</span></div>
  </div>`;
}
function v2m(a1, o1, a2, o2){ if ([a1,o1,a2,o2].some(x => x == null)) return null; const dy = (a1-a2)*111320, dx = (o1-o2)*111320*Math.cos((a1+a2)/2*Math.PI/180); return Math.round(Math.sqrt(dx*dx+dy*dy)); }
function montarMapa(el){
  const v = S.act.find(x => x.id === el.dataset.id); if (!v) return;
  if (!window.L){ el.innerHTML = `<div class="vacio" style="padding:22px">No se pudo cargar el mapa. Usa los enlaces de abajo.</div>`; return; }
  const r = puntoRef(v);
  const css = getComputedStyle(document.documentElement);
  const color = k => css.getPropertyValue(k).trim();
  const colVis = { ok:color("--verde"), med:color("--ambar"), mal:color("--rojo"), no:color("--muted") }[claseDist(v)];
  const m = L.map(el, { zoomControl:true, attributionControl:true, scrollWheelZoom:false });
  m.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(m);
  const pts = [];
  const vis = [v.lat, v.lng]; pts.push(vis);
  L.circle(vis, { radius:Math.max(3, Number(v.precision_m) || 3), color:colVis, weight:1, fillColor:colVis, fillOpacity:.12 }).addTo(m);
  if (r){
    const ref = [r.lat, r.lng]; pts.push(ref);
    L.polyline([vis, ref], { color:colVis, weight:2, dashArray:"5 5" }).addTo(m);
    L.circleMarker(ref, { radius:8, color:"#fff", weight:2, fillColor:color("--navy-2") || "#232C86", fillOpacity:1 }).addTo(m)

  }
  if (v.geo_lat != null && r && v2m(v.geo_lat, v.geo_lng, r.lat, r.lng) > 15 && v2m(v.geo_lat, v.geo_lng, v.lat, v.lng) > 15){

    L.circleMarker(act, { radius:6, color:"#fff", weight:2, fillColor:color("--muted"), fillOpacity:1 }).addTo(m).bindTooltip("Punto actual", { direction:"right", className:"etq" });
  }
  L.circleMarker(vis, { radius:7, color:"#fff", weight:2, fillColor:colVis, fillOpacity:1 }).addTo(m)
    .bindTooltip(`Visita ${hh(v.visitado_en)} · ${mDist(v.distancia_m)}`, { permanent:true, direction:"top", offset:[0,-8], className:"etq" });

  else m.setView(vis, 18);
  S._mapa = m;
}

const DOW = ["dom","lun","mar","mié","jue","vie","sáb"];
function diasPeriodo(){
  const p = S.periodo; if (!p) return [];
  const fin = hoyISO() < p.fin ? hoyISO() : p.fin;
  const out = []; const d = new Date(p.ini + "T12:00:00Z");
  while (d.toISOString().slice(0,10) <= fin){ const s2 = d.toISOString().slice(0,10), dow = d.getUTCDay(); out.push({ iso:s2, dow, habil: dow >= 1 && dow <= 5 }); d.setUTCDate(d.getUTCDate() + 1); }
  return out.filter(x => x.dow !== 0 || S.act.some(v => iso(v.visitado_en) === x.iso));
}
function habiles(){
  const p = S.periodo; if (!p) return { total:0, antes:0, hastaHoy:0 };
  let total = 0, antes = 0, hastaHoy = 0; const hoy = hoyISO(); const d = new Date(p.ini + "T12:00:00Z");
  while (d.toISOString().slice(0,10) <= p.fin){ const s2 = d.toISOString().slice(0,10), dow = d.getUTCDay();
    if (dow >= 1 && dow <= 5){ total++; if (s2 < hoy) antes++; if (s2 <= hoy) hastaHoy++; } d.setUTCDate(d.getUTCDate() + 1); }
  return { total, antes, hastaHoy };
}
function vistaEquipo(){
  const dias = diasPeriodo(), H = habiles();
  const metaEj = (S.avance && S.avance[0] && S.avance[0].meta_visitas) || 160;
  const metaDia = H.total ? metaEj / H.total : 8;
  const hoy = hoyISO();
  const filas = S.ejecutivos.map(e => {
    const todas = S.act.filter(v => v.correo === e.correo);
    const vs = todas.filter(v => v.estado_anul !== "anulada");
    const porDia = {};
    vs.forEach(v => { const k = iso(v.visitado_en); const o = porDia[k] ||= { com:new Set(), n:0, h1:null, h2:null, obs:0, pend:0 }; o.n++; if (v.lat != null) o.com.add(v.customer_id); const t = D(v.visitado_en); if (!o.h1 || t < o.h1) o.h1 = t; if (!o.h2 || t > o.h2) o.h2 = t; if (estadoDe(v) === "obs") o.obs++; if (estadoDe(v) === "pend") o.pend++; });
    const com = new Set(vs.filter(v => v.lat != null).map(v => v.customer_id)).size;
    const restantes = Math.max(1, H.total - H.antes);
    return { e, porDia, com, reg:vs.length,
      val: vs.filter(v => estadoDe(v) === "val").length, pend: vs.filter(v => estadoDe(v) === "pend").length, obs: vs.filter(v => estadoDe(v) === "obs").length, anu: todas.length - vs.length,
      contacto: vs.filter(v => v.con !== "Nadie").length, reunion: vs.filter(v => v.que === "Reunión concretada").length, consumos: vs.filter(v => v.decision === "Realizará consumos").length,
      lejos: vs.filter(v => v.distancia_m == null || v.distancia_m > REGLA.lejos).length,
      ritmo: H.hastaHoy ? com / H.hastaHoy : 0, necesario: Math.max(0, metaEj - com) / restantes, esperado: metaDia * H.hastaHoy };
  });
  const T = { com: filas.reduce((a,f) => a + f.com, 0), reg: filas.reduce((a,f) => a + f.reg, 0) };
  const metaEq = metaEj * filas.length, metaDiaEq = metaDia * filas.length;
  const ritmoEq = H.hastaHoy ? T.com / H.hastaHoy : 0, necEq = Math.max(0, metaEq - T.com) / Math.max(1, H.total - H.antes);
  const celda = (o, d, correo) => {
    const n = o ? o.com.size : 0; const k = n === 0 ? "c0" : n < metaDia * .5 ? "c1" : n < metaDia ? "c2" : "c3";
    const tip = o ? `${n} comercios · ${o.n} registros · de ${hh(o.h1)} a ${hh(o.h2)}${o.pend ? ` · ${o.pend} por validar` : ""}${o.obs ? ` · ${o.obs} observadas` : ""}` : "sin visitas";
    return `<td class="dia ${k}${d.habil ? "" : " finde"}${d.iso === hoy ? " hoy" : ""}"><button data-ir-dia="${d.iso}" data-ir-ej="${esc(correo)}" title="${esc(tip)}" ${o ? "" : "disabled"}>${n || "·"}${o && o.pend ? `<i class="pd" aria-label="por validar"></i>` : ""}</button></td>`;
  };
  // gráfico: comercios por día, apilado por ejecutivo, con la meta diaria del equipo
  const W = 920, Hc = 190, pl = 34, pr = 12, pt = 16, pb = 34;

  const ymax = Math.max(metaDiaEq, ...tot, 1) * 1.15;
  const bw = Math.min(46, (W - pl - pr) / Math.max(1, dias.length) * .62), step = (W - pl - pr) / Math.max(1, dias.length);
  const y = n => pt + (Hc - pt - pb) * (1 - n / ymax);
  const barras = dias.map((d, i) => { let acc = 0; const x = pl + step * i + (step - bw) / 2;
    const segs = filas.map(f => { const n = f.porDia[d.iso] ? f.porDia[d.iso].com.size : 0; if (!n) return ""; const y1 = y(acc + n), y0 = y(acc); acc += n;
      return `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y0 - y1 - 1.5).toFixed(1)}" rx="2" fill="${f.e.color}"><title>${esc(f.e.nombre)} · ${n} comercios el ${fISO(d.iso)}</title></rect>`; }).join("");
    return `${segs}${tot[i] ? `<text x="${(x + bw/2).toFixed(1)}" y="${(y(tot[i]) - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${tot[i]}</text>` : ""}
      <text x="${(x + bw/2).toFixed(1)}" y="${Hc - 18}" text-anchor="middle" font-size="10.5" fill="${d.iso === hoy ? "var(--naranja)" : "var(--muted)"}" font-weight="${d.iso === hoy ? 700 : 400}">${fISO(d.iso)}</text>
      <text x="${(x + bw/2).toFixed(1)}" y="${Hc - 5}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${DOW[d.dow]}</text>`; }).join("");
  const grafico = `<svg viewBox="0 0 ${W} ${Hc}" role="img" aria-label="Comercios visitados por día y por ejecutivo">
    <line x1="${pl}" y1="${y(0)}" x2="${W - pr}" y2="${y(0)}" stroke="var(--linea)"/>
    <line x1="${pl}" y1="${y(metaDiaEq).toFixed(1)}" x2="${W - pr}" y2="${y(metaDiaEq).toFixed(1)}" stroke="var(--naranja)" stroke-width="1.5" stroke-dasharray="6 4"/>
    ${barras}</svg>`;
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  return `
  <div class="resumen">
    <div class="tile acc"><div class="k">Comercios visitados</div><div class="v num">${T.com}<small> / ${metaEq}</small></div><div class="d">${pct(T.com, metaEq)} % de la meta del periodo · ${T.reg} registros</div></div>
    <div class="tile"><div class="k">Días hábiles</div><div class="v num">${H.hastaHoy}<small> de ${H.total}</small></div><div class="d">${pct(H.hastaHoy, H.total)} % del periodo corrido, contando hoy</div></div>
    <div class="tile ${ritmoEq >= metaDiaEq ? "ok" : "warn"}"><div class="k">Ritmo del equipo</div><div class="v num">${ritmoEq.toFixed(1).replace(".", ",")}<small> por día</small></div><div class="d">meta ${Math.round(metaDiaEq)} por día hábil (${Math.round(metaDia)} por ejecutivo)</div></div>
    <div class="tile ${necEq > metaDiaEq ? "bad" : ""}"><div class="k">Para cerrar en meta</div><div class="v num">${necEq.toFixed(1).replace(".", ",")}<small> por día</small></div><div class="d">en los ${Math.max(0, H.total - H.antes)} días hábiles que quedan, contando hoy</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px">
    <div class="barra"><b>Comercios visitados por día</b><span class="lbl">cada color es un ejecutivo · solo visitas con ubicación, no anuladas, un comercio cuenta una vez por día</span>
      <div class="der leyenda-ej"><span><i class="meta"></i>meta diaria del equipo · ${Math.round(metaDiaEq)}</span>${filas.map(f => `<span><i style="background:${f.e.color}"></i>${esc(nombreCorto(f.e.nombre))}</span>`).join("")}</div></div>
    <div style="padding:6px 12px 2px;overflow-x:auto">${grafico}</div>
  </div>
  <div class="panel">
    <div class="barra"><b>Por ejecutivo y por día</b><span class="lbl">verde: llegó a la meta diaria (${Math.round(metaDia)}) · ámbar: a más de la mitad · rojo: menos de la mitad · el punto naranja marca visitas por validar</span></div>
    <div style="overflow-x:auto"><table class="datos matriz">
      <thead><tr><th>Ejecutivo</th>${dias.map(d => `<th class="dia${d.iso === hoy ? " hoy" : ""}${d.habil ? "" : " finde"}">${DOW[d.dow]}<br>${fISO(d.iso)}</th>`).join("")}<th class="n">Comercios</th><th class="n">Ritmo<br>por día</th><th class="n">Necesita<br>por día</th><th class="n">Contacto</th><th class="n">Reunión</th><th class="n">Realizará<br>consumos</th><th class="n">Lejos o<br>sin GPS</th><th>Validación</th></tr></thead>
      <tbody>${filas.map(f => `<tr>
        <td><button class="ej-btn" data-ir-dia="periodo" data-ir-ej="${esc(f.e.correo)}"><span class="ej">${AVATAR(f.e)}${esc(f.e.nombre)}</span></button></td>
        ${dias.map(d => celda(f.porDia[d.iso], d, f.e.correo)).join("")}
