<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1137">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("stratis-esc-tema")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Stratis · CRM de campo · escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
:root{ color-scheme:light;
  --navy:#0C1137; --navy-2:#232C86; --azul:#3B43FB; --naranja:#F86F35; --verde:#0BBC96; --rojo:#D6455D; --ambar:#B7791F;
  --ink:#1b2340; --texto:#3F5073; --muted:#7d89a3; --linea:#D3DBEB; --suelo:#EEF1F8; --tarjeta:#FFFFFF; --hover:#F5F7FC;
  --azul-t:#DDE4F4; --naranja-t:#FDE6DA; --verde-t:#DDF5EE; --rojo-t:#FADDE2; --ambar-t:#FBEFD5;
  --rail:#0C1137; --rail-txt:#C9CFEE; --rail-on:#FFFFFF; --rail-line:rgba(255,255,255,.1);
  --sombra:0 6px 18px rgba(12,17,55,.08); --foco:#3B43FB;
  --verde-txt:#07785F; --ambar-txt:#8A5A12; --rojo-txt:#A82E43; --azul-txt:#2A31C9;
  /* un color por ejecutivo (validado: daltonismo y contraste sobre la tarjeta) */
  --ej1:#B8388F; --ej2:#3B43FB; --ej3:#E8622A; --ej4:#0A9E7E; --ej5:#B7791F; --ej6:#D6455D;
  /* rampa secuencial del mapa: claro = poco, oscuro = mucho */
  --s0:#E3EDFB; --s1:#b7d3f6; --s2:#86b6ef; --s3:#5598e7; --s4:#2a78d6; --s5:#1c5cab; --sin:#E6E9F1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --ink:#EEF1FA; --texto:#D8DEF0; --muted:#8F99BE; --linea:#2A3360; --suelo:#0B0F26; --tarjeta:#141A3A; --hover:#1B224A;
    --azul-t:#1E2760; --naranja-t:#4A2616; --verde-t:#0F3A31; --rojo-t:#4A1E29; --ambar-t:#3E2E10;
    --rail:#070A1C; --rail-txt:#AEB6DC; --sombra:0 6px 18px rgba(0,0,0,.35);
    --verde-txt:#5FE3C1; --ambar-txt:#F0C674; --rojo-txt:#FF8FA3; --azul-txt:#9FA6FF; --navy-2:#9FA6FF;
    --ej1:#DB5CA6; --ej2:#6F7BFF; --ej3:#E36A2E; --ej4:#14A98A; --ej5:#F0C674; --ej6:#FF8FA3;
    --s0:#26356A; --s1:#104281; --s2:#1c5cab; --s3:#2a78d6; --s4:#5598e7; --s5:#9ec5f4; --sin:#1B2248;
  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --ink:#EEF1FA; --texto:#D8DEF0; --muted:#8F99BE; --linea:#2A3360; --suelo:#0B0F26; --tarjeta:#141A3A; --hover:#1B224A;
  --azul-t:#1E2760; --naranja-t:#4A2616; --verde-t:#0F3A31; --rojo-t:#4A1E29; --ambar-t:#3E2E10;
  --rail:#070A1C; --rail-txt:#AEB6DC; --sombra:0 6px 18px rgba(0,0,0,.35);
  --verde-txt:#5FE3C1; --ambar-txt:#F0C674; --rojo-txt:#FF8FA3; --azul-txt:#9FA6FF; --navy-2:#9FA6FF;
  --ej1:#DB5CA6; --ej2:#6F7BFF; --ej3:#E36A2E; --ej4:#14A98A; --ej5:#F0C674; --ej6:#FF8FA3;
  --s0:#26356A; --s1:#104281; --s2:#1c5cab; --s3:#2a78d6; --s4:#5598e7; --s5:#9ec5f4; --sin:#1B2248;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{height:100%}
body{margin:0;background:var(--suelo);color:var(--texto);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--azul-txt)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- shell ---------- */
#app{height:100%}
.app{display:grid;grid-template-columns:232px 1fr;height:100%;min-height:100%}
.rail{background:var(--rail);color:var(--rail-txt);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.rail .marca{font-weight:800;letter-spacing:.14em;color:var(--naranja);font-size:12px;padding:6px 10px}
.rail .prod{color:var(--rail-on);font-weight:800;font-size:16px;padding:0 10px 14px;line-height:1.2}
.rail .prod small{display:block;color:var(--rail-txt);font-weight:600;font-size:11.5px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--rail-txt);padding:10px 10px;border-radius:10px;text-align:left;font-weight:600;width:100%}
.nav button:hover{background:var(--rail-line);color:var(--rail-on)}
.nav button.on{background:var(--naranja);color:#fff}
.nav button svg{width:18px;height:18px;flex:none}
.nav button .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 7px;border-radius:99px}
.nav button.on .cnt{background:rgba(255,255,255,.25)}
.nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--rail-txt);opacity:.7;padding:14px 10px 4px}
.rail .pie{margin-top:auto;padding:10px;font-size:11.5px;line-height:1.4;border-top:1px solid var(--rail-line)}
.rail .pie b{color:var(--rail-on);display:block}
.rail .muestra{font-size:10.5px;background:rgba(248,111,53,.18);color:#FFC5A8;padding:6px 8px;border-radius:8px;margin:8px 0 0}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--linea);background:var(--tarjeta);flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .der{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(11,188,150,.5);animation:pulso 2s infinite}
.vivo.pausa i{background:var(--muted);animation:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(11,188,150,.45)}70%{box-shadow:0 0 0 7px rgba(11,188,150,0)}100%{box-shadow:0 0 0 0 rgba(11,188,150,0)}}
.per{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linea);border-radius:10px;padding:6px 10px;font-size:12.5px;background:var(--tarjeta)}
.per b{color:var(--ink)}
.usuario{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--navy-2);flex:none}
.contenido{flex:1;overflow:auto;padding:18px 22px;min-height:0}

.btn{border:1px solid var(--linea);background:var(--tarjeta);border-radius:9px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.p:hover{filter:brightness(1.05)}
.btn.v{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.a{background:var(--ambar);border-color:var(--ambar);color:#fff}
.btn.r{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.q{border-color:transparent;background:transparent;color:var(--azul-txt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn kbd{font-family:inherit;font-size:10.5px;background:rgba(0,0,0,.12);padding:1px 5px;border-radius:5px;margin-left:2px}

/* ---------- resumen ---------- */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tile .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:4px}
.tile .v small{font-size:12px;font-weight:600;color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}
.tile.warn .v{color:var(--ambar-txt)} .tile.bad .v{color:var(--rojo-txt)} .tile.ok .v{color:var(--verde-txt)} .tile.acc .v{color:var(--naranja)}

/* ---------- validación: cola + ficha ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.panel{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.barra{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--tarjeta);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--texto);display:inline-flex;align-items:center;gap:6px}
.chip .c{font-size:11px;background:var(--suelo);color:var(--muted);padding:0 6px;border-radius:99px;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .c{background:rgba(255,255,255,.2);color:#fff}
select.sel{border:1px solid var(--linea);background:var(--tarjeta);border-radius:9px;padding:5px 8px;font-size:12.5px}
.barra .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

table.cola{width:100%;min-width:720px;border-collapse:collapse;font-size:12.5px}
table.cola th{position:sticky;top:0;background:var(--tarjeta);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--linea);z-index:1}
table.cola td{padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:middle}
table.cola tr.f{cursor:pointer}
table.cola tr.f:hover td{background:var(--hover)}
table.cola tr.f.sel td{background:var(--azul-t)}
table.cola tr.nueva td{animation:llega 1.6s ease-out}
@keyframes llega{0%{background:var(--naranja-t)}100%{background:transparent}}
.tabla-wrap{max-height:calc(100vh - 330px);overflow:auto}
.ej{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ej .avatar{width:22px;height:22px;font-size:9.5px}
.com b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.com small{color:var(--muted);font-size:11.5px;white-space:nowrap;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.res{line-height:1.3;white-space:nowrap}
.res small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.res small{display:block;color:var(--muted);font-size:11.5px}
.dist{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.dist i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dist.ok i{background:var(--verde)} .dist.med i{background:var(--ambar)} .dist.mal i{background:var(--rojo)} .dist.no i{background:var(--muted)}
.dist small{color:var(--muted);font-weight:400}
.senal{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--ambar-t);color:var(--ambar-txt);margin:1px 3px 1px 0;white-space:nowrap}
.senal.r{background:var(--rojo-t);color:var(--rojo-txt)} .senal.i{background:var(--azul-t);color:var(--azul-txt)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pend{background:var(--suelo);color:var(--texto);border:1px dashed var(--muted)}
.pill.val{background:var(--verde-t);color:var(--verde-txt)}
.pill.obs{background:var(--ambar-t);color:var(--ambar-txt)}
.pill.anu{background:var(--rojo-t);color:var(--rojo-txt)}
td.chk{width:30px}
input[type=checkbox]{accent-color:var(--naranja);width:15px;height:15px}
.vacio{padding:36px 20px;text-align:center;color:var(--muted)}

/* ficha */
.ficha{position:sticky;top:0}
.ficha .cab{padding:14px 16px;border-bottom:1px solid var(--linea)}
.ficha .cab h2{font-size:15.5px;font-weight:800}
.ficha .cab .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.ficha .cab .meta b{color:var(--texto);font-weight:600}
.ficha .cuerpo{padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 260px);overflow:auto}
.ficha h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.hechos{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px}
.hechos div{border-top:1px solid var(--linea);padding-top:6px}
.hechos small{display:block;color:var(--muted);font-size:11px}
.hechos b{color:var(--ink);font-weight:600}
.coment{background:var(--suelo);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.coment .ed{font-size:11px;color:var(--muted);margin-top:4px}
.mapa{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--suelo)}
.mapa > svg{display:block;width:100%;height:auto}
.mapa-real{height:270px;width:100%;background:var(--suelo)}
.mapa .leyenda{display:flex;flex-direction:column;gap:5px;padding:9px 11px;font-size:12px;color:var(--texto);border-top:1px solid var(--linea);background:var(--tarjeta)}
.mapa .leyenda em{font-style:normal;color:var(--muted)}
.mapa .leyenda .nota-mapa{color:var(--muted);font-size:11.5px}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--tarjeta);box-shadow:0 0 0 1px var(--linea)}
.pt.ref{background:var(--navy-2)} .pt.act{background:var(--muted)}
.pt.vis.ok{background:var(--verde)} .pt.vis.med{background:var(--ambar)} .pt.vis.mal{background:var(--rojo)} .pt.vis.no{background:var(--muted)}
.mapa .links{display:flex;gap:12px;flex-wrap:wrap}
.leaflet-tooltip.etq{font-family:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tarjeta);color:var(--ink);border:1px solid var(--linea);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.leaflet-tooltip.etq::before{display:none}
.leaflet-container{font-family:inherit}
:root[data-theme="dark"] .mapa-real .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-control-attribution{font-size:9px}
.mapa .pie{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--linea);background:var(--tarjeta);flex-wrap:wrap;gap:6px}
.linea-t{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:14px 1fr;gap:10px;position:relative;padding-bottom:12px;font-size:12.5px}
.ev::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--linea)}
.ev:last-child::before{display:none}
.ev i{width:13px;height:13px;border-radius:50%;background:var(--linea);border:3px solid var(--tarjeta);box-shadow:0 0 0 1px var(--linea);margin-top:2px}
.ev.reg i{background:var(--azul)} .ev.ed i{background:var(--ambar)} .ev.val i{background:var(--verde)} .ev.obs i{background:var(--ambar)} .ev.anu i{background:var(--rojo)} .ev.tr i{background:var(--navy-2)}
.ev b{color:var(--ink);font-weight:600}
.ev small{display:block;color:var(--muted);font-size:11.5px}
.ev .ad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px;font-size:11.5px}
.ev .ad span{background:var(--suelo);border-radius:7px;padding:5px 8px}
.ev .ad span em{font-style:normal;display:block;color:var(--muted);font-size:10.5px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--linea);background:var(--tarjeta);position:sticky;bottom:0}
.motivo{display:none;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--linea);background:var(--suelo)}
.motivo.on{display:flex}
.motivo label{font-size:12px;color:var(--muted)}
.motivo select,.motivo textarea{border:1px solid var(--linea);border-radius:9px;padding:8px 10px;background:var(--tarjeta);width:100%;font-size:12.5px;resize:vertical}
.motivo .fila{display:flex;gap:8px;justify-content:flex-end}
.aviso{font-size:12px;padding:9px 12px;border-radius:9px;background:var(--azul-t);color:var(--azul-txt)}
.aviso.ok{background:var(--verde-t);color:var(--verde-txt)} .aviso.mal{background:var(--rojo-t);color:var(--rojo-txt)} .aviso.warn{background:var(--ambar-t);color:var(--ambar-txt)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12px}
.hist div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--linea);padding-top:6px}
.hist span{color:var(--muted)}

/* ---------- auditoría ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--naranja);border-bottom-color:var(--naranja)}
.grid2{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.buscar{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);border-radius:10px;padding:7px 10px;background:var(--tarjeta)}
.buscar input{border:0;background:none;flex:1;outline:none;font-size:13px;min-width:0}
.buscar svg{width:16px;height:16px;color:var(--muted);flex:none}
.lista{display:flex;flex-direction:column}
.lista button{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--linea);padding:10px 12px;text-align:left;width:100%}
.lista button:hover{background:var(--hover)}
.lista button.on{background:var(--azul-t)}
.lista .t{flex:1;min-width:0}
.lista .t b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .t small{color:var(--muted);font-size:11.5px}
.lista .n{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){ .cards{grid-template-columns:1fr} }
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px 16px}
.card h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mini div{border-top:2px solid var(--linea);padding-top:6px}
.mini b{display:block;font-size:18px;font-weight:800;color:var(--ink);line-height:1.1}
.mini small{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
.mini div.mal{border-top-color:var(--rojo)} .mini div.med{border-top-color:var(--ambar)} .mini div.ok{border-top-color:var(--verde)}
.hist-h{margin-top:8px}
/* ---------- por ejecutivo ---------- */
.leyenda-ej{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.leyenda-ej i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leyenda-ej i.meta{width:16px;height:0;border-top:2px dashed var(--naranja);border-radius:0;vertical-align:3px}

function revisarMarcacion(v){

  if (v.con === "Dueño" && /(due[ñn][oa]|propietari[oa]|titular)\s+no\s+(se\s+)?(encontraba|encuentra|estaba|est[aá])/.test(c)) return "marcó Dueño, pero el comentario dice que no estaba";

  if (v.que === "Sin éxito" && v.con !== "Nadie" && /reprograma|volver a visitar|regres(e|ar)|venga|pasar (posteriormente|luego|ma[ñn]ana)|estar[aá] ma[ñn]ana|vuelvan? a llamar/.test(c)) return "el comentario dice que quedaron en volver";
  if (v.con === "Nadie" && v.motivo !== "Dirección errada" && /vivienda|otro negocio|nadie da raz[oó]n|no conocen|no hay comercio|no se encuentra comercio/.test(c)) return "el comentario dice que el comercio no está en esa dirección";

const MOTIVOS_REVISAR = ["Zona insegura", "Otro motivo"];
function senales(v){
  const s = [];
  // Desde el 25/09 no se valida la dirección ni la distancia: la visita vale como la registra el ejecutivo.
  if (v.lat == null) s.push(["r", "Sin GPS"]);
  const h = horaLima(v.visitado_en); if (h < REGLA.jornadaIni || h >= REGLA.jornadaFin) s.push(["r","Fuera de jornada"]);
  if (repetidaHoy(v)) s.push(["","Repetida hoy"]);
  if (revisarMarcacion(v) && v.estado_anul !== "anulada") s.push(["", "Revisar marcación"]);
  // 29/09: motivos que no dejan rastro del comercio; la visita cuenta igual, solo se revisa el comentario
  if (v.con === "Nadie" && MOTIVOS_REVISAR.includes(v.motivo) && v.estado_anul !== "anulada") s.push(["", "Revisar motivo: " + v.motivo.toLowerCase()]);
  if (v.ubicacion_editada_en) s.push(["i","Ubicación actualizada después"]);
  if (v.resultado_editado_en) s.push(["i","Resultado corregido"]);
  if (v.comentario_editado_en) s.push(["i","Comentario corregido"]);
  if (v.fuera_plazo && v.estado_anul !== "anulada") s.push(["r", `Fuera de plazo (tenía hasta el ${fISO(v.plazo_hasta)})`]);
  if (v.estado_anul === "pendiente") s.push(["r","Pide anulación"]);
  if ((v.comentario || "").trim().length < REGLA.comentarioMin) s.push(["","Comentario corto"]);
  const lag = (D(v.recibido_en) - D(v.visitado_en))/60000; if (lag > REGLA.retrasoMin) s.push(["", `Llegó ${Math.round(lag)} min después`]);
  return s;
}

async function cargar(){
  S.cargando = true; S.error = ""; pintar();
  try {
    const hoy = hoyISO();
    const [u, p] = await Promise.all([
      sb.from("usuarios").select("correo,nombre,nombre_corto,rol,activo").eq("correo", S.sesion.user.email.toLowerCase()).maybeSingle(),
      sb.from("v2_periodos").select("*").lte("ini", hoy).gte("fin", hoy).maybeSingle(),
    ]);
    if (u.error) throw u.error;
    if (!u.data || !u.data.activo) throw new Error("Tu usuario no está activo en el CRM.");
    // Quién entra lo decide la base (tabla v2_acceso_escritorio), no el rol: por ahora, solo Jose.
    const acc = await sb.rpc("v2_puede_escritorio");
    if (acc.error) throw acc.error;
    if (acc.data !== true){ S.denegado = true; S.nuevaClave = null; await sb.auth.signOut().catch(() => {}); S.sesion = null; throw new Error("La vista de escritorio todavía no está habilitada para tu usuario. Tu CRM de campo sigue en el celular, igual que siempre."); }
    S.yo = u.data; S.admin = true;
    S.periodo = p.data || null;
    const us = await sb.from("usuarios").select("correo,nombre,nombre_corto,rol,activo").eq("activo", true).order("nombre");
    S.ejecutivos = (us.data || []).filter(x => x.rol === "Ejecutivo").map((x, i) => ({ correo:x.correo, nombre:x.nombre_corto || x.nombre, ini:iniciales(x.nombre_corto || x.nombre), color:COLORES[i % COLORES.length] }));
    await Promise.all([cargarActividad(true), cargarBase(), cargarAvance(), cargarFbInferido(), cargarMsiInferido(), cargarRetenidas()]);
  } catch(e){ S.error = e.message || String(e); }
  S.cargando = false; pintar();
  if (!S.error) escuchar();
}
// La API corta en 1.000 filas por respuesta y v2_actividad no pagina: si una respuesta llega al tope, se parte el rango de fechas en dos
// hasta que cada parte quepa (así no se pierden visitas sin avisar). Un solo día con más de 1.000 visitas no se puede partir.
async function leerActividad(d1, d2){
  const { data, error } = await sb.rpc("v2_actividad", { p_desde:d1, p_hasta:d2 });
  if (error) return { data:null, error };
  if ((data || []).length >= 1000 && d1 >= d2){ console.warn("v2_actividad: el día " + d1 + " llegó al tope de 1.000 visitas; pueden faltar filas"); if (typeof toast === "function") toast("El día " + fISO(d1) + " tiene 1.000 visitas o más: puede faltar alguna en la pantalla."); }
  if ((data || []).length < 1000 || d1 >= d2) return { data:data || [], error:null };
  const dias = Math.round((new Date(d2 + "T12:00:00Z") - new Date(d1 + "T12:00:00Z")) / 86400000);
  const m = new Date(d1 + "T12:00:00Z"); m.setUTCDate(m.getUTCDate() + Math.floor(dias / 2));
  const s2 = new Date(m); s2.setUTCDate(s2.getUTCDate() + 1);
  const [a, b] = await Promise.all([leerActividad(d1, m.toISOString().slice(0, 10)), leerActividad(s2.toISOString().slice(0, 10), d2)]);
  if (a.error || b.error) return { data:null, error:a.error || b.error };
  const vistos = new Set(), todo = [];
  a.data.concat(b.data).forEach(v => { if (!vistos.has(v.id)){ vistos.add(v.id); todo.push(v); } });
  return { data: todo.sort((x, y) => D(y.visitado_en) - D(x.visitado_en)), error:null };
}
async function cargarActividad(silencio){
  if (S._actCargando) return; S._actCargando = true;
  const desde = (S.periodo && S.periodo.ini) || ayerISO();
  const [{ data, error }] = await Promise.all([leerActividad(desde, hoyISO()), cargarRetenidas()]);
  S._actCargando = false;
  if (error){ if (!silencio) toast("No se pudo actualizar: " + error.message); return; }
  const firma = JSON.stringify(data || []);
  if (silencio && firma === S._firma){ S.actEn = new Date(); const el = $("#ahora"); if (el) el.textContent = hh(S.actEn); return; }
  S._firma = firma;
  const antes = new Set(S.act.map(v => v.id));
  const nuevas = (data || []).filter(v => !antes.has(v.id));
  S.act = data || [];
  S.actEn = new Date();
  const ult = S.act.reduce((m, v) => v.recibido_en > m ? v.recibido_en : m, "");
  S.ultimaRecep = ult ? new Date(ult) : null;
  if (antes.size && nuevas.length){
    nuevas.forEach(v => S.nuevas.add(v.id));
    const v = nuevas[0]; toast(`${nuevas.length === 1 ? "Nueva visita" : nuevas.length + " visitas nuevas"} · ${ejDe(v.correo).nombre}: ${v.comercio}${senales(v).length ? " · con señales" : ""}`);
    setTimeout(() => { nuevas.forEach(v => S.nuevas.delete(v.id)); }, 2500);
  }
  // se invalidan las bitácoras cargadas, por si hubo cambios
  if (!silencio){ S.bit = {}; S.rutasBit = null; }
  pintar();
}

// 10/11/2026: v2_mi_base devuelve ya más de 1.000 filas al analista (1.124 con el bloque 2) y la API corta en 1.000: se pide por
// tramos (la función va ordenada por customer_id, migración 20261110230000) hasta que un tramo venga incompleto.
async function leerBasePorTramos(periodo){
  const todo = [];
  for (let i = 0; ; i += 1000){
    const { data, error } = await sb.rpc("v2_mi_base", periodo ? { p_periodo:periodo } : {}).range(i, i + 999);
    if (error) return { data:null, error };
    todo.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return { data: todo, error:null };
}
async function cargarBase(){
  const { data, error } = await leerBasePorTramos();
  if (error){ toast("No se pudo leer la base: " + error.message); return; }
  // Base 2026-11: los de «salida» siguen en v2_asignaciones (regla n.º 1), pero ya no son cartera salvo que reciban una visita.
  // baseMap guarda todos, para leer el comercio de cualquier visita.
  S.base = (data || []).filter(enCartera); S.baseMap = {}; S.docMap = {};
  (data || []).forEach(c => { if (c.documento) S.docMap[c.documento] = c.customer_id; });
  S.hayOrigen = (data || []).some(c => c.origen); (data || []).forEach(c => { S.baseMap[c.customer_id] = c; });
}
// Identificador visible (Jose, 22/10): el documento de BBVA (RUC o DNI) si el comercio lo tiene; si no (base anterior), el Customer ID.
// Los comercios que ya existían conservan su Customer ID antiguo, que no es el que manejan BBVA y Jose.
const docDe = cid => (S.baseMap[cid] || {}).documento || "";
const idTxt = cid => docDe(cid) ? "Doc. BBVA " + docDe(cid) : "Customer ID " + (cid || "—");
const enCartera = c => c.origen !== "salida" || (c.visitas || 0) > 0;
// Comercio que suma a la meta de visitados (Jose, 21/10): solo la base nueva, igual que v2_avance. La base anterior va aparte.

async function accion(id, tipo, motivo, nota){
  if (S.ocupado) return; S.ocupado = true; pintar();
  const v = S.act.find(x => x.id === id);
  try {
    let r;
    if (tipo === "val") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"validada", p_nota:nota || null });
    else if (tipo === "obs") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"observada", p_motivo:motivo, p_nota:nota || null });
    else if (tipo === "cola") r = await sb.rpc("v2_validar_visita", { p_visita_id:id, p_estado:"validada", p_nota:nota || null });
    else if (tipo === "anu") r = v && v.estado_anul === "pendiente" ? await sb.rpc("v2_resolver_anulacion", { p_visita_id:id, p_aprobar:true, p_nota:[motivo, nota].filter(Boolean).join(" · ") }) : await sb.rpc("v2_anular_visita", { p_visita_id:id, p_motivo:motivo, p_nota:nota || null });
    else if (tipo === "rest") r = await sb.rpc("v2_restituir_visita", { p_visita_id:id, p_nota:nota || null });
    else if (tipo === "rech") r = await sb.rpc("v2_resolver_anulacion", { p_visita_id:id, p_aprobar:false, p_nota:nota || null });
    if (r && r.error) throw r.error;
    delete S.bit[id];
    S.accion = null;
    await cargarActividad(true);
    return true;
  } catch(e){ toast("No se pudo: " + (e.message || e)); return false; }
  finally { S.ocupado = false; pintar(); }
}

    if (S.dia === "hoy" && !esHoy(v)) return false;
    if (S.dia === "ayer" && !esAyer(v)) return false;
    if (/^\d{4}-/.test(S.dia) && iso(v.visitado_en) !== S.dia) return false;

}

function puntoRef(v){

}

function v2m(a1, o1, a2, o2){ if ([a1,o1,a2,o2].some(x => x == null)) return null; const dy = (a1-a2)*111320, dx = (o1-o2)*111320*Math.cos((a1+a2)/2*Math.PI/180); return Math.round(Math.sqrt(dx*dx+dy*dy)); }

    ${rejilla}<line x1="${pl}" y1="${y(metaDia).toFixed(1)}" x2="${W - pr}" y2="${y(metaDia).toFixed(1)}" stroke="var(--naranja)" stroke-width="2" stroke-dasharray="6 4"/>${barras}</svg>`;
  const celda = (f, d) => { const o = f.porDia[d.iso], n = o ? o.nuevas : 0, r = o ? o.rev : 0; const k = !o ? "c0" : n === 0 ? "c0" : n < metaDia * .5 ? "c1" : n < metaDia ? "c2" : "c3";
    const tip = o ? `${n} nuevos${r ? ` · ${r} revisitas` : ""} · ${o.n} registros${o.pend ? ` · ${o.pend} por validar` : ""}${o.tarde ? ` · ${o.tarde} fuera de plazo (no cuentan)` : ""}` : "sin visitas";
    return `<td class="dia ${k}${d.habil ? "" : " finde"}${d.iso === hoy ? " hoy" : ""}"><button data-ir-dia="${d.iso}" data-ir-ej="${esc(f.e.correo)}" title="${esc(tip)}" ${o ? "" : "disabled"}>${n || (r ? 0 : "·")}${r ? `<small class="rv">+${r} rev.</small>` : ""}${o && o.pend ? `<i class="pd" aria-label="por validar"></i>` : ""}</button></td>`; };
  const filasDia = dias.slice().reverse().map((d, i) => { const ti = dias.length - 1 - i, tr = filas.reduce((a, f) => a + (f.porDia[d.iso] ? f.porDia[d.iso].rev : 0), 0);
    return `<tr><td class="fecha${d.iso === hoy ? " hoy" : ""}${d.habil ? "" : " finde"}"><b>${DOW[d.dow]} ${fISO(d.iso)}</b></td>${filas.map(f => celda(f, d)).join("")}<td class="dia tot${d.iso === hoy ? " hoy" : ""}"><b>${totDia[ti] || "·"}</b>${tr ? `<small class="rv">+${tr} rev.</small>` : ""}</td></tr>`; }).join("");
  const todasRev = filas.flatMap(f => f.revs).sort((a, b) => D(b.visitado_en) - D(a.visitado_en));
  const filaRev = v => { const p = RV.ant.get(v.id), ej = ejDe(v.correo);
    return `<tr><td>${fISO(iso(v.visitado_en))} ${hh(v.visitado_en)}</td><td><span class="ej">${AVATAR(ej)}${esc(nombreCorto(ej.nombre))}</span></td><td>${esc(v.comercio)}<small class="muted" style="display:block">revisita ${RV.rev.get(v.id) + 1}</small></td>
      <td>${p ? esc(comoFue(p)[0]) : "—"}<small class="muted" style="display:block">luego</small>${esc(comoFue(v)[0])}${avanceRev(v, p) ? ` <span class="pill val">avanzó</span>` : ""}</td></tr>`; };
  return `

/* =========================================================================
   Base y bloques · periodo 2026-11 (ESPEC_nueva_estructura_2026-11, sección 3)
   225 comercios por ejecutivo y periodo (origen 'base_nueva') en dos bloques quincenales.
   'base_anterior' va aparte: no es pendiente, pero cuenta si BBVA lo reactiva.
   ========================================================================= */
const POR_PERIODO = 225;
const GRUPO_UB = { 1:["val","Ubicado al 100 %"], 2:["obs","Rango cercano"], 3:["anu","Requiere búsqueda"] };
const esValida = v => v.estado_anul !== "anulada" && v.lat != null && !v.fuera_plazo;
// Reactivado que cuenta para comisión: BBVA lo reporta y transacciona 2 días distintos después de la primera visita válida con contacto
const cuentaCom = c => !!c.bbva_reactivado && (c.dias_trx || 0) >= 2;
function fechasBloques(){
  const f = {};
  (S.base || []).forEach(c => { if (c.bloque && c.bloque_ini && !f[c.bloque]) f[c.bloque] = { ini:c.bloque_ini, fin:c.bloque_fin }; });
  // bloque en curso: el 2 desde que empieza; antes (o sin fechas cargadas), el 1
  return { f, act: f[2] && hoyISO() >= f[2].ini ? 2 : 1 };
}
function cifrasBloques(l){
  const vis = new Set(), con = new Set();
  S.act.forEach(v => { if (!esValida(v)) return; vis.add(v.customer_id); if (v.con !== "Nadie") con.add(v.customer_id); });
  const nueva = l.filter(c => c.origen === "base_nueva"), ant = l.filter(c => c.origen === "base_anterior");
  const pot = xs => xs.reduce((s, c) => s + (Number(c.potencial) || 0), 0);
  const cuenta = xs => ({ n:xs.length, vis:xs.filter(c => vis.has(c.customer_id)).length, con:xs.filter(c => con.has(c.customer_id)).length,
    rea:xs.filter(c => c.bbva_reactivado).length, cuentan:xs.filter(cuentaCom).length });
  const g = { 1:0, 2:0, 3:0, sin:0 }; nueva.forEach(c => { g[GRUPO_UB[c.grupo_ubicacion] ? c.grupo_ubicacion : "sin"]++; });
  return { b1:cuenta(nueva.filter(c => c.bloque === 1)), b2:cuenta(nueva.filter(c => c.bloque === 2)), per:cuenta(nueva), ant:cuenta(ant), g,
    pot:{ asig:pot(nueva), vis:pot(nueva.filter(c => vis.has(c.customer_id))), rea:pot(nueva.filter(c => c.bbva_reactivado)) }, vis };
}
function vistaBloques(){
  const base = S.base || [];
  if (!base.some(c => c.origen)) return `<div class="aviso warn">La base del periodo ${esc(S.periodo ? S.periodo.id : "")} todavía no viene por bloques: el bloque, el origen, el potencial y la ubicación llegan con la carga de la base nueva de BBVA (la prepara Análisis y se aplica con tu OK). Hasta entonces este cuadro queda vacío y el resto del escritorio funciona igual.</div>`;
  const { f, act } = fechasBloques(), T = cifrasBloques(base), nEj = Math.max(1, S.ejecutivos.length);
  const rango = b => f[b] ? `${fISO(f[b].ini)} al ${fISO(f[b].fin)}` : "fechas por cargar";
  const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
  const B = act === 1 ? T.b1 : T.b2;
  const ejs = S.ejecutivos.map(e => ({ e, x:cifrasBloques(base.filter(c => c.correo === e.correo)) })).filter(r => r.x.per.n || r.x.ant.n);
  const verCel = e => `<button class="btn chico" data-ver-cel="${esc(e.correo)}" title="Abrir su celular tal como lo ve él">${ICON.cel} Celular</button>`;
  const nomEj = e => `<span class="ej">${AVATAR(e)}${esc(nombreCorto(e.nombre))}</span>`;
  const conTotal = ejs.length > 1;
  const filaAv = (nom, x, n, btn) => `<tr><td>${nom}</td>

    <td class="n num">${x.per.rea}</td><td class="n num"><b>${x.per.cuentan}</b></td>
    <td class="n num">${x.ant.n}</td><td class="n num">${x.ant.con}</td><td class="n num">${x.ant.rea}</td><td class="n num">${x.ant.cuentan}</td><td>${btn || ""}</td></tr>`;
  const filaPot = (nom, x) => `<tr><td>${nom}</td><td class="n num">${solesO(x.pot.asig)}</td><td class="n num">${solesO(x.pot.vis)} <span class="muted">${pct(x.pot.vis, x.pot.asig)} %</span></td><td class="n num">${solesO(x.pot.rea)} <span class="muted">${pct(x.pot.rea, x.pot.asig)} %</span></td></tr>`;

    o.n++; o.p += Number(c.potencial) || 0; if (GRUPO_UB[c.grupo_ubicacion]) o[c.grupo_ubicacion]++; if (T.vis.has(c.customer_id)) o.vis++; if (c.correo) o.ejs.add(c.correo); });
  const filasDis = Object.entries(dis).sort((a, b) => b[1][3] - a[1][3] || b[1].p - a[1].p || b[1].n - a[1].n);

/* ---------- Rutas: la recomendada frente a la que arma cada ejecutivo en su celular (21/10) ----------
   ruta y orden son la recomendada (la carga el analista); la del ejecutivo es ruta_propia/orden_propio si la armó (v2_armar_ruta).
   Los nombres de ruta se repiten entre ejecutivos («Ruta 99 · Por ubicar»), así que todo se agrupa por correo y ruta.
   Cada cambio deja una línea en v2_bitacora_visita con accion = 'ruta', sin visita, leída por periodo y customer_id. */
const rutaRec = c => c.ruta || ("Distrito · " + (c.distrito || "sin distrito"));   // igual que rutas() del celular
const rutaSuya = c => c.ruta_propia || rutaRec(c);
const ordenSuyo = c => c.ruta_propia ? c.orden_propio : c.orden;
const cambioRuta = c => !c.ruta_propia ? "" : c.ruta_propia !== c.ruta ? "movido" : c.orden_propio !== c.orden ? "orden" : "igual";
const paradaTxt = (r, o) => `${esc(r)}${o ? ` · ${o}` : ""}`;
async function cargarRutasBit(){
  const per = S.periodo && S.periodo.id; if (!per || (S.rutasBit && S.rutasBit.per === per)) return;
  S.rutasBit = { per, cargando:true, l:[] };
  const l = [];
  for (let i = 0; ; i += 1000){
    const { data, error } = await sb.from("v2_bitacora_visita").select("*").eq("periodo", per).eq("accion", "ruta").order("en").range(i, i + 999);
    if (error){ S.rutasBit = { per, err:error.message, l:[] }; pintar(); return; }
    l.push(...(data || [])); if (!data || data.length < 1000) break;
  }
  S.rutasBit = { per, l:l.filter(x => x.accion === "ruta" && x.periodo === per && x.customer_id) }; pintar();
}
// La ruta de hoy, como la calcula el celular (rutaHoyDe): la de su última visita si le quedan comercios por visitar;
// si no, la primera (por nombre) con pendientes. Solo con sus comercios, agrupados por su correo.
function rutaHoyEj(correo){
  const mios = S.base.filter(c => c.correo === correo), m = new Map();
  mios.forEach(c => { const k = rutaSuya(c); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  const rs = [...m.entries()].map(([nombre, cs]) => ({ nombre, cs:cs.sort((a, b) => (ordenSuyo(a) || 999) - (ordenSuyo(b) || 999)) }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, "es", { numeric:true }));
  const pendiente = r => r.cs.some(c => c.estado === "por");
  const ultima = mios.filter(c => c.ultima_visita).sort((a, b) => String(b.ultima_visita).localeCompare(String(a.ultima_visita)))[0];
  const rU = ultima ? rs.find(r => r.cs.includes(ultima)) : null;
  const hoy = (rU && pendiente(rU) ? rU : null) || rs.find(pendiente) || rs[0];
  if (!hoy) return null;
  const rec = mios.filter(c => rutaRec(c) === hoy.nombre).sort((a, b) => (a.orden || 999) - (b.orden || 999));
  return { nombre:hoy.nombre, suya:hoy.cs, rec };
}
// Cuánto se parece la ruta de hoy a la recomendada del mismo nombre
function comparaHoy(h){
  const enRec = new Set(h.rec.map(c => c.customer_id)), enSuya = new Set(h.suya.map(c => c.customer_id));
  const comunes = h.suya.filter(c => enRec.has(c.customer_id)).map(c => c.customer_id);
  return { igual:comunes.length, traidos:h.suya.length - comunes.length, sacados:h.rec.filter(c => !enSuya.has(c.customer_id)).length,
    mismoOrden:comunes.join() === h.rec.filter(c => enSuya.has(c.customer_id)).map(c => c.customer_id).join() };
}
function vistaRutas(){
  cargarRutasBit();
  const RB = S.rutasBit || { cargando:true, l:[] }, ids = new Set(S.base.map(c => c.customer_id));

  const porCom = {}; bit.forEach(x => { (porCom[x.customer_id] ||= []).push(x); });
  const nombre = c => c.nombre_comercial || c.razon_social || c.customer_id;
  const ultCambio = c => c.ruta_propia_en || ((porCom[c.customer_id] || []).slice(-1)[0] || {}).en || "";
  const cifras = cs => { const rutas = new Set(cs.filter(c => c.ruta_propia).map(c => c.correo + "|" + c.ruta_propia));
    const nuevas = [...rutas].filter(k => !cs.some(c => c.correo + "|" + c.ruta === k)), cids = new Set(cs.map(c => c.customer_id));

      volvieron:cs.filter(c => !c.ruta_propia && porCom[c.customer_id]).length, rutas:rutas.size, nuevas:nuevas.length,

  const filas = S.ejecutivos.filter(e => S.base.some(c => c.correo === e.correo)).map(e => ({ e, x:cifras(S.base.filter(c => c.correo === e.correo)), h:rutaHoyEj(e.correo) }));
  const T = cifras(S.base.filter(c => c.correo));
  const nomEj = e => `<span class="ej">${AVATAR(e)}${esc(nombreCorto(e.nombre))}</span>`;
  const leeHoy = h => { if (!h) return `<span class="muted">sin comercios</span>`;
    if (!h.suya.some(c => c.ruta_propia) && h.suya.length === h.rec.length) return `<b>${esc(h.nombre)}</b> <span class="pill val">la recomendada</span>`;
    if (!h.rec.length) return `<b>${esc(h.nombre)}</b> <span class="pill obs">ruta nueva</span> <span class="muted">${h.suya.length} comercios de otras rutas</span>`;
    const k = comparaHoy(h);
    return `<b>${esc(h.nombre)}</b> <span class="pill obs">cambiada</span> <span class="muted">${k.igual} de ${h.rec.length} de la recomendada${k.traidos ? ` · ${k.traidos} traído${k.traidos === 1 ? "" : "s"}` : ""}${k.sacados ? ` · ${k.sacados} sacado${k.sacados === 1 ? "" : "s"}` : ""}${k.igual > 1 && !k.mismoOrden ? " · otro orden" : ""}</span>`; };
  const filaEj = (nom, x, hoy) => `<tr><td>${nom}</td><td class="n num">${x.n}</td><td class="n num"><b>${x.mov}</b></td><td class="n num">${x.ord}</td><td class="n num">${x.volvieron}</td>

  // La ruta de hoy lado a lado: la recomendada a la izquierda, la que armó a la derecha
  const lista = (cs, lado, h) => cs.length ? `<ol class="ruta-lista">${cs.map(c => { const s = rutaSuya(c);
      const nota = lado === "rec" ? (s !== h.nombre ? `<span class="pill anu">la sacó · ahora en ${esc(s)}</span>` : ordenSuyo(c) !== c.orden ? `<span class="pill pend">ahora parada ${ordenSuyo(c) || "—"}</span>` : "")
        : (rutaRec(c) !== h.nombre ? `<span class="pill obs">viene de ${paradaTxt(rutaRec(c), c.orden)}</span>` : c.orden !== ordenSuyo(c) ? `<span class="pill pend">antes parada ${c.orden || "—"}</span>` : "");

  const panelHoy = r => !r.h ? "" : `<div class="panel ruta-hoy" style="margin-bottom:16px"><div class="barra"><b>${esc(nombreCorto(r.e.nombre))} · ruta de hoy</b><span class="lbl">${leeHoy(r.h)}</span></div>

  // Comercios con ruta propia o con líneas en la bitácora (también los que volvieron a la recomendada)
  const tocados = S.base.filter(c => c.ruta_propia || porCom[c.customer_id]).sort((a, b) => String(ultCambio(b)).localeCompare(String(ultCambio(a))));
  const ESTADO_R = { movido:["obs","Movido de ruta"], orden:["pend","Otro orden"], igual:["val","Igual a la recomendada"], "":["val","Volvió a la recomendada"] };
  const hc = S.rutaHist && ids.has(S.rutaHist) ? S.baseMap[S.rutaHist] : null, hl = hc ? (porCom[hc.customer_id] || []) : [];
  const hist = !hc ? "" : `<div class="panel" id="rutaHist" style="margin-bottom:16px"><div class="barra"><b>Historial de ruta · ${esc(nombre(hc))}</b><span class="lbl">${esc(idTxt(hc.customer_id))} · ${esc(nombreCorto(ejDe(hc.correo).nombre))} · recomendada ${paradaTxt(rutaRec(hc), hc.orden)} · hoy en ${paradaTxt(rutaSuya(hc), ordenSuyo(hc))}</span><button class="btn chico" data-ruta-hist="" title="Cerrar el historial" style="margin-left:auto">Cerrar</button></div>
    ${hl.length ? `<table class="datos"><thead><tr><th>Cuándo</th><th>Quién</th><th>Antes</th><th>Después</th></tr></thead><tbody>${hl.map(x => `<tr><td class="num">${ddhh(x.en)}</td><td>${esc(nomDe(x.por))}</td><td>${esc(x.antes || "—")}</td><td>${esc(x.despues || "—")}</td></tr>`).join("")}</tbody></table>`
      : `<div class="vacio">${RB.cargando ? "Leyendo la bitácora…" : "Sin cambios de ruta en la bitácora de este periodo."}</div>`}</div>`;
  return `

    <div class="tile"><div class="k">Cambios en la bitácora</div><div class="v num">${RB.cargando ? "…" : T.lin}</div><div class="d">una línea por comercio cada vez que guarda una ruta</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="barra"><b>Rutas por ejecutivo</b><span class="lbl">la recomendada (la que carga el analista) frente a la que arma cada uno en su celular</span></div>
    <div style="overflow:auto"><table class="datos"><thead><tr><th>Ejecutivo</th><th class="n">Comercios</th><th class="n">Movidos de ruta</th><th class="n">Otro orden</th><th class="n">Volvieron</th><th class="n">Rutas armadas</th><th class="n">Cambios</th><th>Último cambio</th><th>Ruta de hoy</th></tr></thead><tbody>

/* ---------- Cierres de periodo (24/10) ----------
   El histórico congelado de cada periodo cerrado, tal como se firmó en el acta. Todo en % del sueldo base: los sueldos
   no viven en el CRM, y lo retenido es lo que se acumula para el cierre del proyecto. Con «Equipo completo» se ve el
   histórico y el detalle de un periodo (con el cuadre: visitados y con contacto se vuelven a contar); con un ejecutivo

async function cargarCierres(){

  const { data, error } = await sb.rpc("v2_cierres_equipo");
  S.cierres = error ? { err:error.message, l:[], cuadre:{} } : { l:data || [], cuadre:{} };

}
async function cargarCuadre(per){

  C.cuadre[per] = error ? { err:error.message } : { m:new Map((data || []).map(r => [r.correo, r])) };

}
const pctC = v => v == null ? "—" : priv((Math.round(Number(v) * 100) / 100).toFixed(2).replace(".", ",").replace(/,?0+$/, "") + " %");
const solesC = v => v == null ? "—" : priv("S/ " + Number(v).toFixed(2).replace(".", ","));

/* Reactivados BBVA vs. comisión (09/10/2026). BBVA reporta el comercio reactivado; al ejecutivo le cuenta solo si, después de su
   primera visita válida con contacto, transacciona en 2 días distintos (v2_dias_trx, que da c.dias_trx). Sin data diaria se separa
   «Por confirmar» (se movió en el corte que incluye el día de la visita) de «Solo antes de la visita». */
const diaLimaE = x => D(x).toLocaleDateString("en-CA", { timeZone:"America/Lima" });
async function cargarComision(){
  S.trxCom = [];
  const meses = S.periodo ? [...new Set([S.periodo.ini, S.periodo.fin].map(d => String(d).slice(0, 7)))] : null;
  let q = sb.from("v2_transacciones").select("customer_id,fecha_corte,mes,formato,trx"); if (meses) q = q.in("mes", meses);
  const [t] = await Promise.all([q, S.seg ? null : cargarSeguimientos()]);
  S.trxCom = t && !t.error ? (t.data || []) : []; pintar();
}
function clasificarComision(c, d1, cortes){
  if (!d1) return "sincontacto";
  if ((c.dias_trx || 0) >= 2) return "cuenta";
  if (c.dias_trx === 1) return "uno";
  if (!cortes.length) return "sindata";
  const grupos = {}; cortes.forEach(t => { const k = t.mes + "|" + t.formato; (grupos[k] = grupos[k] || []).push(t); });
  let antes = false;
  for (const l of Object.values(grupos)){
    l.sort((a, b) => String(a.fecha_corte).localeCompare(String(b.fecha_corte)));
    l.forEach((t, i) => {
      const diario = t.formato === "diario";
      const prev = diario ? diaLimaE(Date.parse(t.fecha_corte + "T12:00:00Z") - 864e5) : i ? l[i - 1].fecha_corte : diaLimaE(Date.parse(t.mes + "-01T12:00:00Z") - 864e5);
      const delta = diario ? t.trx : t.trx - (i ? l[i - 1].trx : 0);
      if (delta <= 0) return;
      if (prev < d1 && d1 <= t.fecha_corte) t._conf = true; else if (t.fecha_corte < d1) antes = true;
    });
    if (l.some(t => t._conf)) return "confirmar";
  }
  return antes ? "antes" : "sindata";
}
function filasComision(){
  const pv = {};   // primera visita válida con contacto
  (S.act || []).forEach(v => { if (v.estado_anul === "anulada" || v.con === "Nadie" || v.lat == null || v.fuera_plazo) return;
    const d = diaLimaE(v.visitado_en); if (!pv[v.customer_id] || d < pv[v.customer_id]) pv[v.customer_id] = d; });
  const trx = {}; (S.trxCom || []).forEach(t => { (trx[t.customer_id] = trx[t.customer_id] || []).push(t); });
  return (S.base || []).filter(c => c.bbva_reactivado).map(c => {
    const d1 = pv[c.customer_id] || null;

function comoFueTexto(v){
  if (v.con === "Nadie") return v.motivo === "Dirección errada" ? "El comercio no está en esta dirección" : "No se pudo hacer la visita";

  if (v.que === "Reagendada") return "No estaba quien decide · quedamos en volver" + otra;
  if (v.que === "Sin éxito") return "No estaba quien decide · sin compromiso" + otra;
  return v.que || "";
}

  const t = ev.target.closest("[data-recup-validar],[data-recup-observar],[data-descartar-ret],[data-pq],[data-pq-alc],[data-pq-csv],[data-base-bbva],[data-fb-tipo],[data-fb-csv],[data-ir-dia],[data-mmet],[data-mdist],#btnTema,[data-vista],[data-filtro],[data-sel],[data-accion],[data-cancelar],[data-confirmar],[data-tab],[data-traza],[data-copiar],[data-ir-cola],[data-ir-traza],[data-tipo],[data-salir],[data-refrescar],#elegir,#otroArchivo,#cargar,#guardarTotales,#otraCarga,#valBloque,#limpiarSel,#btnPausa");

  if (t.dataset.irDia){ S.vista = "validacion"; S.filtro = "todos"; S.dia = t.dataset.irDia; elegirEj(t.dataset.irEj || "todos"); S.accion = null; try { history.replaceState(null, "", "#validacion"); } catch(e){} pintar(); return; }

      const ok = await accion(id, a);
      if (ok){ toast(a === "val" ? "Validada." : a === "rest" ? "Restituida. Vuelve a contar." : a === "rech" ? "Pedido rechazado. La visita sigue contando." : "Observación levantada. Vuelve a la cola."); if (a === "val" && S.filtro === "pend") siguientePendiente(id); pintar(); }

  if (t.dataset.confirmar){ const id = S.sel; const m = $("#mSel").value, n = $("#mNota").value.trim(); const tipo = t.dataset.confirmar;
    if ((m === "Otro" && n.length < 5) || (tipo === "obs" && n.length === 0 && m === "Otro")){ toast("Con el motivo «Otro» escribe en la nota qué hay que revisar."); $("#mNota").focus(); return; } const ok = await accion(id, tipo, m, n); if (ok){ toast(tipo === "obs" ? "Observada. El ejecutivo la ve en revisión." : "Anulada. Ya no cuenta."); if (S.filtro === "pend") siguientePendiente(id); pintar(); } return; }

document.addEventListener("keydown", ev => {
  if (!S.sesion || S.vista !== "validacion" || ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  const l = filtradas(); const i = l.findIndex(v => v.id === S.sel);
  if (ev.key === "ArrowDown" && l[i+1]){ S.sel = l[i+1].id; S.accion = null; pintar(); ev.preventDefault(); }
  if (ev.key === "ArrowUp" && l[i-1]){ S.sel = l[i-1].id; S.accion = null; pintar(); ev.preventDefault(); }
  if (ev.key.toLowerCase() === "v" && S.sel){ const v = S.act.find(x=>x.id===S.sel); if (v && estadoDe(v) !== "anu" && estadoDe(v) !== "val") accion(S.sel, "val").then(ok => { if (ok){ toast("Validada."); if (S.filtro === "pend") siguientePendiente(S.sel); pintar(); } }); }
  if (ev.key.toLowerCase() === "o" && S.sel){ S.accion = "obs"; pintar(); $("#mSel")?.focus(); }
  if (ev.key.toLowerCase() === "a" && S.sel){ S.accion = "anu"; pintar(); $("#mSel")?.focus(); }
  if (ev.key === "Escape" && S.accion){ S.accion = null; pintar(); }
});
