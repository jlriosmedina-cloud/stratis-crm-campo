<!DOCTYPE html>

<head>

<title>Stratis CRM — BBVA Adquirencia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stratis CRM">
<link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27512%27%20height%3D%27512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%2796%27%20fill%3D%27%230b2545%27/%3E%3Ctext%20x%3D%27256%27%20y%3D%27340%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%27280%27%20font-weight%3D%27800%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27512%27%20height%3D%27512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%2796%27%20fill%3D%27%230b2545%27/%3E%3Ctext%20x%3D%27256%27%20y%3D%27340%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%27280%27%20font-weight%3D%27800%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%20%22Stratis%20CRM%20%E2%80%94%20BBVA%20Adquirencia%22%2C%20%22short_name%22%3A%20%22Stratis%20CRM%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22scope%22%3A%20%22.%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%230b2545%22%2C%20%22theme_color%22%3A%20%22%230b2545%22%2C%20%22orientation%22%3A%20%22portrait%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%3Bcharset%3Dutf-8%2C%253Csvg%2520xmlns%253D%2527http%253A//www.w3.org/2000/svg%2527%2520width%253D%2527512%2527%2520height%253D%2527512%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%252796%2527%2520fill%253D%2527%25230b2545%2527/%253E%253Ctext%2520x%253D%2527256%2527%2520y%253D%2527340%2527%2520font-family%253D%2527system-ui%252Csans-serif%2527%2520font-size%253D%2527280%2527%2520font-weight%253D%2527800%2527%2520fill%253D%2527%2523ffffff%2527%2520text-anchor%253D%2527middle%2527%253ES%253C/text%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22512x512%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%20maskable%22%7D%5D%7D">

<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f3f4f1; --card:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --ring:rgba(11,11,11,.10);
  --brand:#0b2545; --brand-2:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#a32626; --warn-ink:#8a6100; --serious-ink:#9c4a25;
  --good-bg:#e8f6e8; --warn-bg:#fef3d9; --serious-bg:#fdeade; --crit-bg:#fbe6e6; --info-bg:#e7f0fc;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
  --nav-h:62px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --card:#1a1a19;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --line:#383835; --ring:rgba(255,255,255,.10);
  --brand:#0f1c2e; --brand-2:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-ink:#0ca30c; --crit-ink:#e66767; --warn-ink:#fab219; --serious-ink:#ec835a;
  --good-bg:#122b12; --warn-bg:#33280a; --serious-bg:#33200f; --crit-bg:#331414; --info-bg:#0f2137;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--plane); color:var(--ink);
  font-size:15px; line-height:1.45; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#login{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(160deg,#0b2545 0%,#123a63 48%,#1b5183 100%);
}
.lg-card{width:100%;max-width:412px;background:var(--card);border-radius:20px;padding:30px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lg-logo{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.lg-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(140deg,#0b2545,#2a78d6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px;flex:none}
.lg-logo h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.lg-logo p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;font-size:14.5px;margin-bottom:8px}
.ms-btn:hover{background:var(--plane)}
.ms-tiles{width:19px;height:19px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
.ms-tiles i{display:block;border-radius:1px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--grid)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-1);outline:none;font-size:16px;
}
textarea{resize:vertical;min-height:78px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(42,120,214,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand-2);color:#fff;font-weight:650;cursor:pointer;font-size:14.5px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--plane)}
.btn.danger{background:var(--crit)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.err{background:var(--crit-bg);color:var(--crit-ink);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.demo-users{margin-top:14px;border-top:1px solid var(--grid);padding-top:13px}
.demo-users p{margin:0 0 8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.du{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 9px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;margin-bottom:2px}
.du:hover{background:var(--plane);border-color:var(--grid)}
.av{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;background:var(--s1)}
.du b{display:block;font-size:13.5px;font-weight:600}
.du span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- APP SHELL ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:11px
}
header.top .mark{width:31px;height:31px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
header.top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.72;letter-spacing:0}
.icon-btn{background:rgba(255,255,255,.13);border:0;color:#fff;width:33px;height:33px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}
.icon-btn:hover{background:rgba(255,255,255,.24)}
main{flex:1;padding:13px 13px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);
  border-top:1px solid var(--grid);display:flex;padding-bottom:env(safe-area-inset-bottom)
}
nav.bottom button{
  flex:1;background:none;border:0;padding:8px 2px 7px;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;position:relative
}
nav.bottom button .ic{font-size:18px;line-height:1}
nav.bottom button.on{color:var(--brand-2)}
nav.bottom button .dot{position:absolute;top:5px;right:calc(50% - 17px);min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* ---------- COMPONENTS ---------- */
.card{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:11px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-2)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}

/* ================= AJUSTES =================
   La pantalla se lee como secciones, no como una pila de tarjetas iguales.
   Cada sección abre con su título y una línea que dice para qué sirve; la
   letra chica vive plegada, para que lo accionable quede a la vista. */
.aj-sec{margin:0 0 22px}
.aj-sec > .aj-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 9px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.aj-sec > .aj-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.aj-sec > .aj-h span{font-size:12.5px;color:var(--muted)}
.aj-grid{display:grid;grid-template-columns:1fr;gap:11px;align-items:start}
.aj-grid > .card{margin-bottom:0}

/* Identidad */
.aj-yo{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.aj-yo .av{width:46px;height:46px;font-size:15px;flex:none}
.aj-yo .quien{flex:1;min-width:180px}
.aj-yo .quien b{font-size:15.5px;letter-spacing:-.2px}
.aj-yo .quien div{font-size:12.5px;color:var(--muted);margin-top:2px}
.aj-acc{display:flex;gap:8px;flex-wrap:wrap}
.aj-acc .btn{flex:1;min-width:132px}

/* Una fila de descarga: qué es, el botón que lo baja, y los CSV sueltos.
   En celular se apilan en ese orden —lo principal primero—; en pantalla ancha
   el botón se va a la derecha y los CSV quedan debajo del texto. */
.aj-dl{display:grid;grid-template-columns:1fr;gap:10px;
  padding:14px 0;border-bottom:1px solid var(--grid)}
.aj-dl:first-of-type{padding-top:2px}
.aj-dl:last-of-type{border-bottom:0;padding-bottom:2px}
.aj-dl .txt b{font-size:14.5px;letter-spacing:-.1px}
.aj-dl .txt div{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.aj-dl .btn{align-self:start}
.aj-csv{display:flex;gap:7px;flex-wrap:wrap}
/* Acá el ancho ya lo pone el contenedor; el tope de 820px dejaba el borde
   derecho de cada aviso desalineado con el de su tarjeta. */
.view-ajustes .note{max-width:none}

/* Lo que antes eran tres bloques azules seguidos */
details.aj-mas{border-top:1px solid var(--grid);margin-top:11px;padding-top:9px}
details.aj-mas > summary{cursor:pointer;list-style:none;font-size:12.5px;font-weight:650;
  color:var(--brand-2);display:inline-flex;align-items:center;gap:6px;padding:3px 0;user-select:none}
details.aj-mas > summary::-webkit-details-marker{display:none}
details.aj-mas > summary:before{content:"›";display:inline-block;transition:transform .16s;font-size:15px;line-height:1}
details.aj-mas[open] > summary:before{transform:rotate(90deg)}
details.aj-mas > summary:hover{text-decoration:underline}
details.aj-mas .cuerpo{font-size:12.8px;color:var(--ink-2);line-height:1.58;padding:9px 0 2px;max-width:840px}
details.aj-mas .cuerpo p{margin:0 0 9px}
details.aj-mas .cuerpo p:last-child{margin-bottom:0}

/* Reglas: rejilla real, no columnas que dejan huérfanas */
.aj-reglas{display:grid;grid-template-columns:1fr;gap:0}
.aj-reglas .kv{padding:9px 0}
.aj-pie{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px 4px;line-height:1.6}
.aj-pie b{color:var(--ink-2);font-weight:650}

/* Equipo */
.eq-top{display:flex;align-items:center;justify-content:space-between;gap:11px;flex-wrap:wrap;
  margin:0 0 12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.eq-conteo{font-size:13.5px}
.eq-conteo b{font-size:17px;letter-spacing:-.3px;margin-right:2px}
table.tbl-equipo td:first-child{min-width:190px}
table.tbl-equipo tr.eq-baja td{opacity:.55}
/* En celular la tabla no cabe: los dos números se bajan al nombre en vez de
   dejar la fila cortada por el borde derecho. */
.eq-mini{display:none;font-size:11.5px;color:var(--muted);margin-top:5px;
  align-items:center;gap:6px;flex-wrap:wrap}
@media(max-width:759px){
  .eq-mini{display:flex}
  table.tbl-equipo thead{display:none}   /* una sola columna no necesita cabecera */
  table.tbl-equipo th:nth-child(2), table.tbl-equipo td:nth-child(2),
  table.tbl-equipo th:nth-child(3), table.tbl-equipo td:nth-child(3),
  table.tbl-equipo th:nth-child(4), table.tbl-equipo td:nth-child(4){display:none}
  table.tbl-equipo td:first-child{min-width:0}
  table.tbl-equipo td:last-child{white-space:normal;width:104px}
  table.tbl-equipo td:last-child .btn{display:block;width:100%}
  table.tbl-equipo td:last-child .btn + .btn{margin-top:5px}
}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.chip.p1{background:#fbe6e6;color:#a32626} .chip.p2{background:#fdeade;color:#9c4a25}
.chip.p3{background:#fef3d9;color:#8a6100} .chip.p4{background:#eceae4;color:#52514e}
:root[data-theme=dark] .chip.p1{background:#331414;color:#e66767}
:root[data-theme=dark] .chip.p2{background:#33200f;color:#ec835a}
:root[data-theme=dark] .chip.p3{background:#33280a;color:#fab219}
:root[data-theme=dark] .chip.p4{background:#2c2c2a;color:#c3c2b7}
.chip.ok{background:var(--good-bg);color:var(--good-ink)}
.chip.no{background:var(--plane);color:var(--muted);border:1px solid var(--grid)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.crit{background:var(--crit-bg);color:var(--crit-ink)}
.chip.serious{background:var(--serious-bg);color:var(--serious-ink)}
.chip.info{background:var(--info-bg);color:var(--brand-2)}
.toolbar{display:flex;gap:8px;margin-bottom:11px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{padding-left:34px;border-radius:11px}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.pills{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 5px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.pill.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.cl{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh)}
.cl:active{transform:scale(.995)}
.cl .body{flex:1;min-width:0}
.cl .name{font-weight:670;font-size:14.5px;letter-spacing:-.15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.cl .sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cl .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cl .amt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cl .amt small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--grid)}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;word-break:break-word}
.kv dd.upd{color:var(--good-ink);font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:11px}
.stat{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh)}
.stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat .val{font-size:25px;font-weight:730;letter-spacing:-.8px;margin-top:3px;line-height:1.1}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:9px;opacity:.6}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.tl-item{position:relative;margin-bottom:11px}
.tl-item:before{content:"";position:absolute;left:-22px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--s1);border:2px solid var(--card);box-shadow:0 0 0 2px var(--grid)}
.tl-item.cancel:before{background:var(--crit)}
.tl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:6px}
.tl-h .dt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-h .who{font-weight:660;font-size:13.5px}
.quote{border-left:3px solid var(--grid);padding:2px 0 2px 10px;margin:7px 0 0;font-size:13px;color:var(--ink-2)}
.quote b{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;font-weight:700}
.ev-thumb{width:100%;max-height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--ring);margin-top:9px;display:block;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;gap:7px}

@media(min-width:760px){

/* ---------- LAPTOP: se aprovecha el ancho de la ventana ----------
   La pantalla de una laptop es cuatro veces más ancha que la de un celular.
   A partir de acá el contenido deja de ser una columna larga y se reparte,
   sin llegar nunca a estirar el texto de borde a borde: eso cansa de leer. */
@media(min-width:1180px){
  main{max-width:1400px;padding:24px 28px 48px}
  .card{padding:17px 19px}
  .cl-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cl{padding:14px 15px}
  .stat-row{gap:12px}

  /* Formularios y ajustes fluyen en dos columnas. Las tarjetas nunca se
     parten a la mitad. */
  .view-form, .view-cols{column-count:2;column-gap:18px}
  .view-form > *, .view-cols > *{break-inside:avoid}
  .view-form > .back,
  .view-form > .sticky-actions{column-span:all}
  .view-form > .card:first-of-type{column-span:all}
  /* Las tarjetas con tabla, y las marcadas como anchas, ocupan todo el ancho:
     así las columnas se reparten parejo en vez de dejar un hueco largo. */
  .view-cols > .card:has(.tbl-wrap),
  .view-cols > .card.ancho{column-span:all}
  .kv-cols{column-count:2;column-gap:26px}
  .kv-cols .kv{break-inside:avoid}

  /* Ajustes: rejilla explícita. Dos tarjetas por fila, misma altura de fila,
     sin los huecos que dejaba el masonry. La pantalla no se estira de borde a
     borde —un panel de configuración a 1600px de ancho no se lee mejor, se lee
     peor: los botones quedan del largo de la mesa y el ojo pierde la columna. */
  .view-ajustes{max-width:1020px;margin:0 auto}
  .aj-grid{grid-template-columns:repeat(2,1fr);gap:13px;align-items:stretch}
  .aj-grid.una{grid-template-columns:1fr}
  .aj-sec{margin-bottom:26px}
  .aj-sec > .aj-h h2{font-size:16.5px}
  .aj-reglas{grid-template-columns:repeat(2,1fr);column-gap:32px}
  .aj-yo .quien b{font-size:16.5px}
  .aj-acc{justify-content:flex-start}
  .aj-acc .btn{flex:0 0 auto;min-width:150px}
  .view-form .sticky-actions{position:static;justify-content:flex-end;
    background:none;border-top:1px solid var(--grid);padding-top:14px}
  .view-form .sticky-actions .btn{flex:none;min-width:210px}

  /* El historial deja de ser una tira angosta con la mitad de la pantalla
     vacía: las tarjetas se reparten en columnas. */
  .tl-lectura{max-width:none;column-count:2;column-gap:14px}
  .tl-lectura .tl-item{break-inside:avoid;-webkit-column-break-inside:avoid}
  .tl-lectura .tl-item:before{display:none}
  .tl-lectura.tl{padding-left:0}
  .tl-lectura.tl:before{display:none}

  /* El texto largo no se estira de lado a lado */
  .note, .quote{max-width:820px}
  .view-form .note, .view-form .quote{max-width:none}
  .ev-thumb{max-width:420px}
  .campo-corto input, .campo-corto select{max-width:420px}
}

/* ---------- MONITOR: una columna más ---------- */
@media(min-width:1560px){
  main{max-width:1680px;padding:26px 32px 52px}
  .cl-grid{grid-template-columns:repeat(3,1fr)}
  .stat .val{font-size:28px}
  .view-form, .view-cols{column-count:3;column-gap:18px}
  .tl-lectura{column-count:3}
  .kv-cols{column-count:3}
  .view-ajustes{max-width:1140px}
  .grid2{gap:14px}
}

/* ---------- PANTALLA GRANDE: se usa casi todo el ancho ---------- */
@media(min-width:1900px){
  main{max-width:min(1880px, 94vw)}
  .cl-grid{grid-template-columns:repeat(4,1fr)}
  .sel-row{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}

<script>
/* =========================================================================
   STRATIS CRM — Campaña BBVA Adquirencia
   Núcleo: conexión a Supabase, reglas de negocio y estado

   v3 — cartera en campo y sin datos sensibles. El único dato que viene de
   BBVA es el customer_id; el nombre del comercio lo escribe el ejecutivo.
   ========================================================================= */
"use strict";

const SUPABASE_URL      = "https://xwvpnagvdrjffayzsnke.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-WtGPS_yJYllxVMR0RCDQg_kQHLHSPq";  // publishable — pública por diseño

const CONFIG = {
  dominio: "mystratis.com",
  cumpleVisitaHistorico: true
};

let sb = null;

/* ---- Medio de contacto (los ids coinciden con el trigger en SQL) -------- */
const TIPOS_CONTACTO = [
  { id:"visita_presencial", label:"Visita presencial",   desc:"En el local del comercio",                 modo:"presencial", cumple:true,  gps:true  },
  { id:"reunion_presencial",label:"Reunión presencial",  desc:"Reunión fuera del local (oficina, café)",  modo:"presencial", cumple:true,  gps:true  },
  { id:"reunion_virtual",   label:"Reunión virtual",     desc:"Teams, Meet o Zoom con cámara",            modo:"virtual",    cumple:true,  gps:false },
  { id:"videollamada",      label:"Videollamada",        desc:"Videollamada por WhatsApp u otro",         modo:"virtual",    cumple:true,  gps:false },
  { id:"llamada",           label:"Llamada telefónica",  desc:"Solo audio — no califica como visita",     modo:"otro",       cumple:false, gps:false },
  { id:"whatsapp",          label:"Mensaje WhatsApp",    desc:"Chat — no califica como visita",           modo:"otro",       cumple:false, gps:false },
  { id:"correo",            label:"Correo electrónico",  desc:"No califica como visita",                  modo:"otro",       cumple:false, gps:false }
];
const tipoById = id => TIPOS_CONTACTO.find(t => t.id === id) || null;

/* ---- Resultado del intento — es lo que separa intentar de lograr -------
   Ojo con la palabra: acá "logrado" es que el cliente respondió, no que se
   haya retenido. Si el objetivo se cumplió o no, eso lo dice el cierre de la
   gestión (Retenido / Venta / Perdido), que es otra cosa y va en otra columna.
   Enviar un correo o un WhatsApp no es una respuesta: es un intento. */
const RESULTADOS = [
  { id:"efectivo",        label:"El cliente respondió",  desc:"Contestó la llamada, respondió el mensaje o te atendió en el local", ok:true  },
  { id:"no_contesta",     label:"No respondió",          desc:"Llamaste o escribiste y no hubo respuesta", ok:false },
  { id:"local_cerrado",   label:"Local cerrado",         desc:"Fue al local y estaba cerrado",      ok:false },
  { id:"titular_ausente", label:"Titular ausente",       desc:"Atendió otra persona, no el contacto", ok:false },
  { id:"datos_errados",   label:"Datos errados",         desc:"Teléfono o dirección equivocada",    ok:false },
  { id:"rechazo",         label:"No quiso atender",      desc:"Se negó a la conversación",          ok:false }
];
const resultadoById = id => RESULTADOS.find(r => r.id === id) || null;
const esEfectivo = id => id === "efectivo";

/* Medios donde el mensaje sale sin que nadie lo conteste todavía. Ahí decir
   que el cliente respondió obliga a transcribir su respuesta: si respondió,
   hay algo que citar. La base aplica la misma regla. */
const MEDIOS_ASINCRONICOS = ["correo", "whatsapp"];
const pruebaDeRespuesta = f =>
  esEfectivo(f.Resultado) && MEDIOS_ASINCRONICOS.includes(f.Tipo_Contacto);

/* Un registro presencial solo tiene respaldo si el GPS del equipo entregó las
   coordenadas. Si el ejecutivo tuvo que guardar sin señal, queda marcado. */
const sinUbicacionVerificada = r =>

const TZ = "America/Lima";
const pad = n => String(n).padStart(2,"0");
const ahoraLima = () => new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
const fmtLima = d => d.toLocaleString("es-PE", { timeZone: TZ });
const hoyISO = () => { const d = ahoraLima(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const horaISO = () => { const d = ahoraLima(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseDT = (f,h) => new Date(`${f}T${(h||"00:00")}:00`);
const ts = r => parseDT(r.Fecha_Contacto, r.Hora_Contacto).getTime();
const fmtFecha = f => { if(!f) return "—"; const [y,m,d] = String(f).slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const fmtDT = (f,h) => `${fmtFecha(f)}${h ? " · " + h : ""}`;
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;


/* =========================================================================
   REGLAS DE NEGOCIO
   Las autoritativas viven en Postgres. Estas son el espejo en pantalla.
   ========================================================================= */
const RULES = {
  cumpleVisita(id, resultado){
    const t = tipoById(id);
    return (t && t.cumple && esEfectivo(resultado || "efectivo")) ? "SI" : "No";
  },
  visitaPresencial(id){ const t = tipoById(id); return (t && t.modo === "presencial") ? "SI" : "No"; },
  visitaVirtual(id){ const t = tipoById(id); return (t && t.modo === "virtual") ? "SI" : "No"; },
  requiereUbicacion(id){ const t = tipoById(id); return !!(t && t.gps); },


  /* Resumen por cliente. Cada interacción cuenta como intento; solo cuentan
     como respuesta aquellas en las que el cliente contestó. Nada de esto dice
     si se retuvo: eso es el cierre de la gestión. */
  recomputarBase(cid){
    const c = byId[String(cid)];
    if (!c) return null;
    const regs = DB.delCliente(cid);
    const b = {
      Contactado:"No", Visita_Presencial:"No", Visita_Virtual:"No", Cumple_Visita:"No",
      Fecha_Visita_Actualizada:"",
      Comentario_Ejecutivo:"", Comentario_Cliente:"",
      _n: regs.length,
      _intentos: regs.length,
      _efectivos: regs.filter(r => esEfectivo(r.Resultado)).length,
      _ultimo:null
    };
    if (!regs.length){ c._base = b; return b; }

    const ult = regs[0];
    b._ultimo = ult;
    b.Contactado = b._efectivos > 0 ? "Si" : "Intentado";
    b.Visita_Presencial = ult.Visita_Presencial || "No";
    b.Visita_Virtual    = ult.Visita_virtual    || "No";
    b.Comentario_Ejecutivo = ult.Comentario_Ejecutivo || "";
    b.Comentario_Cliente   = ult.Comentario_Cliente   || "";

    const cumplidas = regs.filter(r => r.Cumple_Visita === "SI");
    if (CONFIG.cumpleVisitaHistorico){
      b.Cumple_Visita = cumplidas.length ? "SI" : "No";
      b.Fecha_Visita_Actualizada = cumplidas.length ? cumplidas[0].Fecha_Contacto : "";
    } else {
      b.Cumple_Visita = ult.Cumple_Visita || "No";
      b.Fecha_Visita_Actualizada = ult.Cumple_Visita === "SI" ? ult.Fecha_Contacto : "";
    }

    c._base = b;
    return b;
  }
};

function pantallaPegar(estado){
  const e = estado || {};
  $("#login").innerHTML = `<div class="lg-card">

      <div><h1>Pegar el enlace</h1><p>Cuando el enlace no abre la aplicación</p></div></div>

    </div>
    <div class="field">
      <label>Dirección copiada</label>
      <textarea id="pegado" placeholder="https://…#access_token=…" style="font-size:13px;min-height:96px"></textarea>
    </div>
    <button class="btn block" id="entrarPegado">Entrar</button>
    <button class="btn ghost block" id="volverLogin" style="margin-top:8px">Volver</button>
  </div>`;
  $("#volverLogin").onclick = () => renderLogin();
  $("#entrarPegado").onclick = async () => {
    const txt = ($("#pegado").value || "").trim();
    if (!txt) return pantallaPegar({ error:"Pega la dirección que copiaste." });
    const frag = txt.includes("#") ? txt.slice(txt.indexOf("#") + 1) : txt;
    const p = new URLSearchParams(frag.replace(/^\/?\??/, ""));
    const at = p.get("access_token"), rt = p.get("refresh_token");
    if (!at || !rt){
      const err = p.get("error_description") || p.get("error");
      return pantallaPegar({ error: err
        ? `El enlace trae un error: ${err.replace(/\+/g," ")}. Pide uno nuevo.`
        : "Esa dirección no contiene los datos de acceso. Debe incluir “access_token”." });
    }
    $("#entrarPegado").disabled = true; $("#entrarPegado").textContent = "Entrando…";
    const { data, error } = await sb.auth.setSession({ access_token: at, refresh_token: rt });
    if (error || !data.session) return pantallaPegar({ error: (error && error.message) || "No se pudo abrir la sesión. El enlace pudo vencer." });
    await entrar(data.session).catch(x => pantallaPegar({ error:x.message }));
  };
}

/* ---- Sesión ------------------------------------------------------------- */
async function comprobarSesion(){
  if (!sb) return renderLogin();
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await entrar(session);
}

async function entrar(session){
  if (S.entrando || S.user) return;      // evita que se ejecute dos veces
  S.entrando = true;
  try {
    const correo = (session.user.email || "").toLowerCase();
    pantallaCarga("Verificando tu acceso…");
    const { data: yo, error } = await sb.from("usuarios").select("*").eq("correo", correo).maybeSingle();
    if (error || !yo || !yo.activo){
      await sb.auth.signOut();
      return renderLogin({ error: yo && !yo.activo
        ? `Tu acceso al CRM está desactivado. Comunícate con el administrador.`
        : `La cuenta ${esc(correo)} no figura en la lista de usuarios del CRM.` });
    }
    S.user = { correo: yo.correo, nombre: yo.nombre_corto || yo.nombre,
               nombreCompleto: yo.nombre, rol: yo.rol };

    if ((session.user.user_metadata || {}).debe_cambiar) return pantallaClaveInicial();
    await abrirApp();
  } finally { S.entrando = false; }
}

  await cargarDatos();

}

/* ---- Carga de datos ----------------------------------------------------- */
async function cargarDatos(){
  pantallaCarga("Cargando tu cartera…");
  const [cli, inter, usr, cfg, rub] = await Promise.all([
    sb.from("clientes").select("*").limit(5000),
    sb.from("interacciones").select("*").limit(20000),
    sb.from("usuarios").select("*").order("rol"),
    sb.from("config").select("*"),
    sb.from("rubros").select("*").order("orden")
  ]);
  const fallo = [cli, inter, usr].find(r => r.error);
  if (fallo) throw new Error(fallo.error.message);

  /* La lista de rubros la ve cualquier sesión válida, siempre. Si vuelve
     vacía es que la sesión caducó: la base no rechaza con error, simplemente
     no devuelve nada. Sin esta comprobación el CRM se abría en cero —sin
     comercios, sin equipo, sin rubros— y parecía que se hubiera borrado todo. */
  if (!(rub.data || []).length){
    await sb.auth.signOut();
    S.user = null;
    throw new Error("Tu sesión caducó. Vuelve a entrar con tu correo y contraseña.");
  }

  RUBROS = rub.data || [];
  CLIENTES = (cli.data || []).map((c,i) => Object.assign({ _i:i }, c));
  byId = {}; CLIENTES.forEach(c => byId[String(c.customer_id)] = c);
  USUARIOS = (usr.data || []).map(u => ({ nombre: u.nombre_corto || u.nombre,
    nombreCompleto: u.nombre, correo:u.correo, rol:u.rol, activo:u.activo }));
  (cfg.data || []).forEach(({clave, valor}) => {
    if (clave === "cumple_visita_historico") CONFIG.cumpleVisitaHistorico = valor === "true";
    if (clave === "dominio_permitido")     CONFIG.dominio = valor;
  });

  DB.cargar(inter.data || []);
  await firmarEvidencias();
  CLIENTES.forEach(c => RULES.recomputarBase(c.customer_id));
  await cargarAuditoria();
}

/* Bitácora de cambios — la base solo la devuelve a Analista y Manager */
async function cargarAuditoria(){
  AUDITORIA = [];
  if (!S.user || S.user.rol === "Ejecutivo" || S.demo) return;
  const { data, error } = await sb.from("auditoria").select("*")
    .order("creado_en", { ascending:false }).limit(2000);
  if (!error) AUDITORIA = data || [];
}

async function firmarEvidencias(){
  const paths = [...new Set(DB.todos().map(r => r.Evidencia_Path).filter(p => p && !EVID_URL[p]))];
  if (!paths.length) return aplicarEvidencias();
  for (let i = 0; i < paths.length; i += 90){
    const lote = paths.slice(i, i+90);
    const { data } = await sb.storage.from("evidencias").createSignedUrls(lote, 3600);
    (data || []).forEach(d => { if (d.signedUrl) EVID_URL[d.path] = d.signedUrl; });
  }
  aplicarEvidencias();
}
const aplicarEvidencias = () =>
  DB.todos().forEach(r => { if (r.Evidencia_Path) r.Evidencia = EVID_URL[r.Evidencia_Path] || ""; });

async function refrescar(){
  const { data, error } = await sb.from("interacciones").select("*").limit(20000);
  if (error) return toast("No se pudo actualizar: " + error.message);
  DB.cargar(data || []);
  await firmarEvidencias();
  CLIENTES.forEach(c => c._base = null);
  CLIENTES.forEach(c => RULES.recomputarBase(c.customer_id));
}

/* Recarga la cartera tras un alta, edición o borrado */
async function recargarCartera(){
  const cli = await sb.from("clientes").select("*").limit(5000);
  if (cli.error) throw new Error(cli.error.message);
  CLIENTES = (cli.data || []).map((c,i) => Object.assign({ _i:i }, c));
  byId = {}; CLIENTES.forEach(c => byId[String(c.customer_id)] = c);
  CLIENTES.forEach(c => RULES.recomputarBase(c.customer_id));
}

/* ---- Subida de evidencias ---------------------------------------------- */
function dataURLaBlob(d){
  const [cab, b64] = d.split(",");
  const mime = (cab.match(/:(.*?);/) || [,"image/jpeg"])[1];
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type:mime });
}

async function subirEvidencia(dataUrl){
  if (!dataUrl) return null;
  if (dataUrl.startsWith("http")) return null;                 // ya estaba subida
  const blob = dataURLaBlob(dataUrl);
  const nombre = `${S.user.correo}/${Date.now()}-${Math.floor(Math.random()*1e6)}.jpg`;
  const { error } = await sb.storage.from("evidencias")
    .upload(nombre, blob, { contentType:"image/jpeg", upsert:false });
  if (error) throw new Error("No se pudo subir la evidencia: " + error.message);
  const { data } = await sb.storage.from("evidencias").createSignedUrl(nombre, 3600);
  if (data) EVID_URL[nombre] = data.signedUrl;
  return nombre;
}

  const b = c._base || RULES.recomputarBase(c.customer_id);

  if (b._efectivos > 0) return { chip:"warn", label:"Respondió" };

    String(c.direccion||"").toLowerCase().includes(q) ||
    String(c.ruc||"").includes(q) ||
    String(c.razon_social||"").toLowerCase().includes(q));

  if (S.fDistrito !== "todos")   lista = lista.filter(c => c.distrito === S.fDistrito);

  if (S.fContacto !== "todos") lista = lista.filter(c => {

    distrito:"", direccion:"", estado:"ACTIVO",
    resultado_gestion:"PENDIENTE", observacion:""

function formDeCliente(c){
  return {

    customer_id: c.customer_id,
    ruc: c.ruc || "", razon_social: c.razon_social || "",
    nombre_comercio: c.nombre_comercio || "",
    rubro: c.rubro, rubro_otro: c.rubro_otro || "",
    distrito: c.distrito || "", direccion: c.direccion || "",

function editarCliente(cid){

/* ---------------------------------------------------------------------------
   Qué cierres puede elegir el ejecutivo

   Dos reglas, las mismas que vigila la base:
   · Retenido y Venta solo existen si ya hubo un contacto logrado. Sin eso,
     BBVA recibiría un objetivo cumplido con cero visitas y cero llamadas.
   · Retenido es para un comercio activo; si al gestionarlo figuraba dado de
     baja y se recuperó, eso es una venta y se deriva al ejecutivo de BBVA.
   --------------------------------------------------------------------------- */
function hayContactoLogrado(cid){
  return !!cid && DB.delCliente(cid).some(r => esEfectivo(r.Resultado));
}

function gestionesPosibles(){
  const f = S.formCli;
  const logrado = hayContactoLogrado(S.editCli);
  return RESULTADOS_GESTION.filter(g => {
    if (g.id === "PENDIENTE" || g.id === "PERDIDO") return true;
    if (!logrado) return false;
    if (g.id === "RETENIDO") return f.estado === "ACTIVO";
    if (g.id === "VENTA")    return f.estado === "DE BAJA";
    return true;
  });
}

function pintarGestion(){
  const f = S.formCli, box = $("#boxGestion");
  if (!box) return;
  const posibles = gestionesPosibles();
  if (!posibles.some(g => g.id === f.resultado_gestion)) f.resultado_gestion = "PENDIENTE";
  const logrado = hayContactoLogrado(S.editCli);
  const aviso = !logrado
    ? `Todavía no hay ningún contacto logrado con este comercio, así que el cierre no se puede marcar.
       Registra la gestión en la que hablaste con el titular y después vuelve acá.`
    : f.estado === "ACTIVO"
      ? `El comercio figura <b>activo</b>: si se queda con BBVA es una <b>retención</b>.`
      : `El comercio figura <b>dado de baja</b>: si lo recuperaste es una <b>venta</b>, y se deriva al
         ejecutivo de BBVA. Si no lo recuperaste, no hay retención que contar.`;
  box.innerHTML = `
    <div class="field" style="margin-bottom:0">
      <select data-c="resultado_gestion">
        ${posibles.map(g => `<option value="${g.id}" ${f.resultado_gestion===g.id?"selected":""}>${esc(g.label)} — ${esc(g.desc)}</option>`).join("")}
      </select>
    </div>
    <div class="note ${logrado ? "" : "warn"}" style="margin:11px 0 0">${aviso}</div>`;
  box.querySelectorAll("[data-c]").forEach(el => el.onchange = () => f[el.dataset.c] = el.value);
}

/* La identificación cambia según el origen: Customer ID, o RUC y razón social
   para una venta nueva que BBVA todavía no tiene afiliada. */
function pintarIdentificacion(){
  const f = S.formCli, box = $("#boxIdent"), editando = !!S.editCli;
  if (!box) return;
  if (f.tipo_registro === "NUEVO"){
    box.innerHTML = `
      <div class="field">
        <label>RUC <span class="req">*</span> <span class="hint">— 11 dígitos</span></label>
        <input type="text" data-c="ruc" value="${esc(f.ruc)}" ${editando ? "disabled" : ""}
               inputmode="numeric" maxlength="11" placeholder="20123456789">
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px">
          Como todavía no está afiliado no tiene Customer ID: el RUC es la llave.
        </div>
      </div>
      <div class="field">
        <label>Razón social <span class="req">*</span></label>
        <input type="text" data-c="razon_social" value="${esc(f.razon_social)}"
               placeholder="Tal como figura en SUNAT">
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px">
          Con este nombre aparecerá el comercio en tu cartera.
        </div>
      </div>`;
  } else {
    box.innerHTML = `
      <div class="field">
        <label>Customer ID <span class="req">*</span> <span class="hint">— el código del comercio en BBVA</span></label>
        <input type="text" data-c="customer_id" value="${esc(f.customer_id)}" ${editando ? "disabled" : ""}
               inputmode="numeric" autocapitalize="characters" placeholder="Ej.: 40218755">
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px">
          Es el único dato que conecta este registro con la base de BBVA.
        </div>
      </div>`;
  }
  box.querySelectorAll("[data-c]").forEach(el => el.oninput = el.onchange = () => f[el.dataset.c] = el.value);
  camposSegunOrigen();
  pintarNotas();
  pintarNotaDatos();
}

/* Una venta nueva se registra con lo mínimo: RUC, razón social y rubro. La
   dirección, el distrito y el estado son de la cartera de BBVA — un comercio
   que recién se afilia todavía no tiene estado que reportar. */
/* Medios con los que se puede cerrar una afiliación nueva. Por teléfono,
   correo o WhatsApp no se cierra una venta: hay que estar ahí o verse la cara. */
const MEDIOS_VENTA = ["visita_presencial","reunion_presencial","reunion_virtual","videollamada"];

function camposSegunOrigen(){
  const nuevo = S.formCli.tipo_registro === "NUEVO";
  const ocultarSiCartera = ["#cardCierre", "#cardEvidencia"];
  [["#fldNombre", nuevo], ["#fldEstado", nuevo], ["#cardUbicacion", nuevo], ["#cardGestion", nuevo]]
    .forEach(([sel, ocultar]) => { const el = $(sel); if (el) el.style.display = ocultar ? "none" : ""; });
  ocultarSiCartera.forEach(sel => { const el = $(sel); if (el) el.style.display = nuevo ? "" : "none"; });

  if (nuevo){
    // Una venta nueva es una derivación: el resultado lo confirma BBVA en el
    // siguiente corte. Para el ejecutivo la derivación ya cuenta.
    S.formCli.resultado_gestion = "VENTA";
    // La gestión que cierra la venta se arma en el mismo formulario.
    if (!S.form) S.form = nuevoForm();
    S.form.Resultado = "efectivo";
    pintarMediosVenta();
  } else {
    ["#derivado","#boxGps","#boxGasto"].forEach(sel => { const el = $(sel); if (el) el.innerHTML = ""; });
    pintarGestion();
  }
}

function pintarMediosVenta(){
  const f = S.form, box = $("#optsCierre");
  if (!box) return;
  box.innerHTML = TIPOS_CONTACTO.filter(t => MEDIOS_VENTA.includes(t.id)).map(t => `
    <div class="opt ${f.Tipo_Contacto === t.id ? "on" : ""}" data-medio="${t.id}">
      <span class="rd"></span><span><b>${t.label}</b><span>${t.desc}</span></span>
    </div>`).join("");
  box.querySelectorAll("[data-medio]").forEach(el => el.onclick = () => {
    f.Tipo_Contacto = el.dataset.medio;
    box.querySelectorAll("[data-medio]").forEach(x => x.classList.toggle("on", x.dataset.medio === f.Tipo_Contacto));
    pintarDerivado(); pintarGps(); pintarGasto();
  });
  pintarDerivado(); pintarGps(); pintarEvidencia(); pintarGasto();
}

/* La cartera de BBVA usa una nota interna; el cliente nuevo usa los dos
   comentarios de siempre, los mismos que se piden en cada gestión. */
function pintarNotas(){
  const f = S.formCli, box = $("#boxNotas"), tit = $("#tituloNotas");

/* ---- Guardar ------------------------------------------------------------ */
async function guardarCliente(){
  const f = S.formCli, editando = !!S.editCli, errores = [];
  const nuevo = f.tipo_registro === "NUEVO";
  const cid = String(f.customer_id || "").trim().toUpperCase();
  const ruc = String(f.ruc || "").replace(/[^0-9]/g, "");

  if (!editando){
    if (nuevo){
      if (ruc.length !== 11) errores.push("El RUC debe tener 11 dígitos.");
      if (CLIENTES.some(c => c.ruc === ruc)) errores.push(`El RUC ${ruc} ya está registrado en la campaña.`);
    } else {
      if (cid.length < 3) errores.push("Escribe el Customer ID del comercio (mínimo 3 caracteres).");
      if (byId[cid]) errores.push(`El Customer ID ${cid} ya está registrado en tu cartera.`);
    }
  }
  if (nuevo){
    if (!String(f.razon_social).trim()) errores.push("Escribe la razón social: BBVA la necesita para afiliarlo.");
    if (!editando){
      const g = S.form || {};
      if (!g.Tipo_Contacto) errores.push("Indica cómo se cerró la venta: visita al local o reunión.");
      if (RULES.requiereUbicacion(g.Tipo_Contacto) && !g.Ubicacion_Verificada && !g._sinUbicacion)
        errores.push("Captura la ubicación con el botón. Si el GPS no responde, usa “Registrar sin ubicación verificada”.");
      if (!g.Evidencia) errores.push("Adjunta la evidencia de la gestión.");
      if (!String(g.Comentario_Ejecutivo || "").trim()) errores.push("Escribe el comentario del ejecutivo.");
      const gasto = Number(g.Gasto_Total || 0);
      const nCmp = (g.Gastos_Paths||[]).length + (g.Gastos_Nuevos||[]).length;
      if (gasto > 0 && nCmp === 0) errores.push("Adjunta el comprobante del gasto que declaraste.");
      if (nCmp > 0 && gasto <= 0)  errores.push("Anota el monto total de los comprobantes que adjuntaste.");
      if (gasto < 0)    errores.push("El monto del gasto no puede ser negativo.");
      if (gasto > 2000) errores.push("El monto supera el máximo permitido por visita (S/ 2,000).");
    }
  } else {
    if (!String(f.nombre_comercio).trim()) errores.push("Ponle un nombre al comercio para poder reconocerlo.");
    if (!String(f.distrito).trim()) errores.push("Indica el distrito.");
    if (!String(f.direccion).trim()) errores.push("Indica la dirección.");
  }
  if (!f.rubro) errores.push("Selecciona el rubro del comercio.");
  if (f.rubro === "otro" && !String(f.rubro_otro).trim()) errores.push("Escribe cuál es el rubro.");

  if (errores.length){
    $("#errCli").innerHTML = `<div class="err"><b>Falta completar:</b><ul style="margin:6px 0 0;padding-left:18px">${errores.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
    $("#errCli").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  const btn = $("#guardarCli");
  btn.disabled = true; btn.textContent = "Guardando…";

  const fila = {
    tipo_registro: f.tipo_registro,
    rubro: f.rubro,
    rubro_otro: f.rubro === "otro" ? String(f.rubro_otro).trim() : null,
    resultado_gestion: nuevo ? "VENTA" : (f.resultado_gestion || "PENDIENTE")
  };
  if (nuevo){
    // Ficha mínima: el resto del onboarding lo hace BBVA por su canal.
    fila.ruc             = ruc;
    fila.razon_social    = String(f.razon_social).trim();
    fila.nombre_comercio = String(f.razon_social).trim();
    fila.distrito = null; fila.direccion = null; fila.estado = null; fila.observacion = null;
  } else {
    fila.nombre_comercio = String(f.nombre_comercio).trim();
    fila.distrito        = String(f.distrito).trim().toUpperCase();
    fila.direccion       = String(f.direccion).trim();
    fila.estado          = f.estado;
    fila.observacion     = String(f.observacion).trim() || null;
    if (!editando) fila.customer_id = cid;
  }

  try {
    if (editando){
      const { error } = await sb.from("clientes").update(fila).eq("customer_id", S.editCli);
      if (error) throw error;
    } else if (nuevo){
      // El comercio y la gestión que lo cerró entran juntos o no entra ninguno.
      const g = S.form;
      if (g.Evidencia && !g.Evidencia_Path){
        const ruta = await subirEvidencia(g.Evidencia);
        if (ruta) g.Evidencia_Path = ruta;
      }
      for (const d of (g.Gastos_Nuevos || [])){
        const ruta = await subirEvidencia(d);
        if (ruta) g.Gastos_Paths.push(ruta);
      }
      g.Gastos_Nuevos = [];
      const { error } = await sb.rpc("crear_venta_nueva", {
        p_ruc: ruc,
        p_razon_social: fila.razon_social,
        p_rubro: fila.rubro,
        p_rubro_otro: fila.rubro_otro,
        p_tipo_contacto: g.Tipo_Contacto,
        p_fecha: g.Fecha_Contacto,
        p_hora: g.Hora_Contacto,
        p_evidencia_path: g.Evidencia_Path || "",
        p_comentario_ejecutivo: String(g.Comentario_Ejecutivo || "").trim(),
        p_comentario_cliente: String(g.Comentario_Cliente || "").trim() || null,
        p_calificacion: g.Calificacion || null,
        p_ubicacion: g.Ubicacion || null,
        p_ubicacion_verificada: !!g.Ubicacion_Verificada,
        p_gasto_total: String(g.Gasto_Total).trim() === "" ? null : Number(g.Gasto_Total),
        p_gastos_paths: g.Gastos_Paths || []
      });
      if (error) throw error;
    } else {
      fila.asignado = S.user.nombre;
      fila.asignado_correo = S.user.correo;
      const { error } = await sb.from("clientes").insert(fila);
      if (error) throw error;
    }
    const destino = editando ? S.editCli : (nuevo ? "NUEVO-" + ruc : cid);
    await recargarCartera(); await refrescar(); await cargarAuditoria();
    toast(editando ? "Comercio actualizado" : (nuevo ? "Venta nueva registrada con su gestión" : "Comercio registrado"));
    S.formCli = null; S.editCli = null; S.form = null; S.tab = "cartera"; S.cid = destino;
    window.scrollTo(0,0);
    render();
  } catch (err){
    btn.disabled = false; btn.textContent = editando ? "Guardar cambios" : "Registrar comercio";
    const msg = String(err.message || err);
    const amable = /duplicate key|clientes_pkey|23505/i.test(msg)
      ? `${nuevo ? "El RUC <b>"+esc(ruc)+"</b>" : "El Customer ID <b>"+esc(cid)+"</b>"} ya está registrado por otro ejecutivo de la campaña. Cada comercio pertenece a quien lo registró primero — coordínalo con tu supervisor.`
      : /violates row-level security|permission/i.test(msg)
      ? "La base rechazó el registro: solo puedes crear y editar comercios a tu propio nombre."
      : esc(msg);
    $("#errCli").innerHTML = `<div class="err"><b>No se pudo guardar.</b><br>${amable}</div>`;
    $("#errCli").scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

function confirmarEliminarCliente(cid){
  const c = byId[String(cid)];
  if (!c) return;
  if (!esMiCliente(c)) return toast("Solo puedes eliminar los comercios que tú registraste");
  const n = DB.delCliente(cid).length;
  modal(`
    <h3>Eliminar comercio</h3>
    <p>Se eliminará <b>${esc(titulo(nombreCliente(c)))}</b> (ID ${esc(c.customer_id)})
    ${n ? `junto con sus <b>${n}</b> registro${n===1?"":"s"} de contacto` : ""}.
    Esta acción no se puede deshacer.</p>
    <div style="display:flex;gap:9px">
      <button class="btn danger" id="okDelCli" style="flex:1">Eliminar</button>
      <button class="btn ghost" onclick="cerrarModal()" style="flex:1">Conservar</button>
    </div>`);
  $("#okDelCli").onclick = async () => {
    const { error } = await sb.from("clientes").delete().eq("customer_id", String(cid));
    if (error){ cerrarModal(); return toast("No se pudo eliminar: " + error.message); }
    await recargarCartera(); await cargarAuditoria();
    cerrarModal(); toast("Comercio eliminado");
    S.cid = null; S.tab = "cartera"; render();
  };
}

/* -------------------------------------------------------------------------
   Corregir un Customer ID mal tipeado

   La llave con la que se cruza contra la cartera del banco. Si se registró
   con un dedazo, el comercio no le pega a nada en el archivo de BBVA, y hasta
   ahora la única salida era borrarlo —perdiendo sus gestiones y su evidencia—
   y volver a empezar. La corrección la hacen el Analista y el Manager: el
   error lo comete quien registra, así que no debería revisarse a sí mismo.
   ------------------------------------------------------------------------- */
function modalCorregirId(cid){
  const c = byId[String(cid)];
  if (!c) return;
  if (esDeCampo()) return toast("La corrección del Customer ID la hacen el Analista o el Manager");
  if (esClienteNuevo(c)) return toast("Una venta nueva se identifica por RUC, no por Customer ID");
  const n = DB.delCliente(cid).length;

  modal(`
    <h3>Corregir el Customer ID</h3>
    <p><b>${esc(titulo(nombreCliente(c)))}</b> — registrado por ${esc(c.asignado)}.</p>
    <div class="kv" style="border:0;padding:0 0 12px"><dt>Customer ID actual</dt>
      <dd class="mono">${esc(c.customer_id)}</dd></div>
    <div class="field">
      <label for="fixNuevo">Customer ID correcto <span class="req">*</span></label>
      <input type="text" id="fixNuevo" inputmode="numeric" autocomplete="off"
             placeholder="${esc(c.customer_id)}" value="">
    </div>
    <div class="note" style="margin-bottom:12px">
      ${n ? `Sus <b>${n}</b> gestión${n===1?"":"es"} y la evidencia se mueven con él; no se pierde nada. `
          : "El comercio todavía no tiene gestiones. "}
      La corrección queda en la bitácora con tu nombre.
    </div>
    <div id="fixMsg"></div>
    <div style="display:flex;gap:9px;margin-top:4px">
      <button class="btn" id="fixOk" style="flex:1">Corregir</button>
      <button class="btn ghost" onclick="cerrarModal()" style="flex:1">Cancelar</button>
    </div>`);

  const caja = $("#fixNuevo");
  caja.focus();
  caja.oninput = () => $("#fixMsg").innerHTML = "";

  $("#fixOk").onclick = async () => {
    const nuevo = caja.value.trim();
    const msg = $("#fixMsg");
    if (!nuevo) return msg.innerHTML = `<div class="err">Escribe el Customer ID correcto.</div>`;
    if (nuevo === String(c.customer_id))
      return msg.innerHTML = `<div class="err">Ese es el mismo que ya tiene.</div>`;
    if (!/^[A-Za-z0-9._-]{3,30}$/.test(nuevo))
      return msg.innerHTML = `<div class="err">Entre 3 y 30 caracteres, sin espacios ni símbolos raros.</div>`;
    if (byId[nuevo])
      return msg.innerHTML = `<div class="err">El ${esc(nuevo)} ya lo tiene <b>${esc(titulo(nombreCliente(byId[nuevo])))}</b>.</div>`;

    const b = $("#fixOk"); b.disabled = true; b.textContent = "Corrigiendo…";
    try {
      const { error } = await sb.rpc("corregir_customer_id",
        { p_actual: String(c.customer_id), p_nuevo: nuevo });
      if (error) throw new Error(error.message);
      await recargarCartera(); await cargarAuditoria();
      cerrarModal(); toast("Customer ID corregido");
      S.cid = nuevo; render();
    } catch (e) {
      b.disabled = false; b.textContent = "Corregir";
      msg.innerHTML = `<div class="err">${esc(String(e.message).replace(/^.*?:\s*/, ""))}</div>`;
    }
  };
}

/* =========================================================================
   Formulario: registro de cada contacto o intento de comunicación
   ========================================================================= */
function nuevoForm(){
  return {
    Fecha_Contacto: hoyISO(), Hora_Contacto: horaISO(),
    Tipo_Contacto: "", Resultado: "efectivo",
    Ubicacion: "", Ubicacion_Verificada: false, Evidencia: "", Calificacion: "",
    Gasto_Total: "", Gastos_Paths: [], Gastos_Nuevos: [],
    Comentario_Ejecutivo: "", Comentario_Cliente: "",
    Cierre: null            // resultado_gestion del comercio, se define acá mismo
  };
}

function renderFormulario(){
  const c = byId[S.cid];
  if (!c) return go("cartera");
  if (!esDeCampo() && !S.editId){
    S.tab = "cartera";
    return toast("Las gestiones las registran los ejecutivos en campo");
  }
  if (!S.form) S.form = S.editId ? Object.assign({}, DB.buscar(S.editId)) : nuevoForm();
  const f = S.form;

  $("#view").innerHTML = `
  <button class="back" data-back>‹ ${esc(titulo(nombreCliente(c)))}</button>
  <div class="card">
    <h3 style="margin-bottom:4px">${S.editId ? "Editar" : "Registrar"} contacto / intento</h3>
    <div style="font-size:13px;color:var(--muted)">${esc(titulo(nombreCliente(c)))} · ID ${esc(c.customer_id)} · ${esc(titulo(c.distrito))}</div>
    ${S.editId ? `<div class="note" style="margin-top:11px">La <b>ubicación capturada no se puede modificar</b>: queda como constancia del lugar donde se hizo el registro.</div>` : ""}
  </div>

  ${S.editId ? "" : `
  <div class="card">
    <h3>Fecha y hora del contacto</h3>
    <div class="row2">
      <div class="field"><label>Fecha <span class="req">*</span></label><input type="date" data-f="Fecha_Contacto" value="${f.Fecha_Contacto}" max="${hoyISO()}"></div>
      <div class="field" style="margin-bottom:0"><label>Hora <span class="req">*</span></label><input type="time" data-f="Hora_Contacto" value="${f.Hora_Contacto}"></div>
    </div>
    <div class="note" style="margin-top:4px">Se registra automáticamente a nombre de <b>${esc(S.user.nombreCompleto || S.user.nombre)}</b> (${esc(S.user.correo)}).</div>
  </div>`}

  ${S.editId ? `
  <div class="card">
    <h3>Lo que quedó registrado <span style="text-transform:none;font-weight:500;color:var(--muted)">(no editable)</span></h3>
    <div class="note warn" style="margin-bottom:11px">
      El medio de contacto, el resultado y la fecha <b>no se pueden cambiar</b>: son los que alimentan
      el conteo de intentos y la tasa de respuesta. Si te equivocaste al elegirlos, elimina este registro y
      créalo de nuevo — la eliminación queda en la bitácora.
    </div>
    <div class="kv"><dt>Fecha y hora</dt><dd>${fmtDT(f.Fecha_Contacto, f.Hora_Contacto)}</dd></div>
    <div class="kv"><dt>Medio de contacto</dt><dd>${esc((tipoById(f.Tipo_Contacto)||{}).label || f.Tipo_Contacto)}</dd></div>
    <div class="kv"><dt>Resultado</dt><dd><span class="chip ${esEfectivo(f.Resultado)?"ok":"serious"}">${esc((resultadoById(f.Resultado)||{}).label || f.Resultado)}</span></dd></div>
    <div id="derivado" style="margin-top:11px"></div>
  </div>
  ` : `
  <div class="card">
    <h3>¿Cómo se contactó al cliente? <span class="req">*</span></h3>
    <div class="opts">
      ${TIPOS_CONTACTO.map(t => `
        <div class="opt ${f.Tipo_Contacto === t.id ? "on" : ""}" data-tipo="${t.id}">
          <span class="rd"></span><span><b>${t.label}</b><span>${t.desc}</span></span>
        </div>`).join("")}
    </div>
    <div id="derivado" style="margin-top:11px"></div>
  </div>

  <div class="card">
    <h3>¿Cuál fue el resultado? <span class="req">*</span></h3>
    <div class="note" style="margin-bottom:11px">Todo registro cuenta como intento de comunicación. Solo <b>“Habló con el contacto”</b> cuenta como contacto logrado y puede calificar como visita.</div>
    <div class="opts">
      ${RESULTADOS.map(r => `
        <div class="opt ${f.Resultado === r.id ? "on" : ""}" data-res="${r.id}">
          <span class="rd"></span><span><b>${r.label}</b><span>${r.desc}</span></span>
        </div>`).join("")}
    </div>
  </div>`}

  <div id="boxGps"></div>



  <div class="card">
    <h3>Evidencia del contacto <span class="req">*</span></h3>
    <div id="evBox"></div>
  </div>

  <div id="boxGasto"></div>

  <div id="boxCierre"></div>

  <div class="card">
    <h3>Comentarios</h3>
    <div class="field"><label>Calificación del cliente</label>
      <select data-f="Calificacion">
        <option value="">Seleccionar…</option>
        ${CALIFICACIONES.map(k => `<option value="${k.id}" ${f.Calificacion===k.id?"selected":""}>${k.label}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>Comentario del ejecutivo <span class="req">*</span> <span class="hint">— cómo calificas al cliente</span></label>
      <textarea data-f="Comentario_Ejecutivo" placeholder="Ej.: Cliente con buena disposición, opera con Izipay por tasa. Solicita revisión de comisión para mantener el POS BBVA.">${esc(f.Comentario_Ejecutivo)}</textarea></div>
    <div class="field" style="margin-bottom:0"><label>Comentario del cliente ${pruebaDeRespuesta(f) ? '<span class="req">*</span>' : ''} <span class="hint">— ${pruebaDeRespuesta(f) ? "qué respondió, en sus palabras" : "el sentir del cliente, en sus palabras"}</span></label>
      <textarea data-f="Comentario_Cliente" placeholder="Ej.: “El POS funciona bien pero la comisión es más alta que la competencia; si me igualan me quedo.”">${esc(f.Comentario_Cliente)}</textarea>
      ${(pruebaDeRespuesta(f) && !String(f.Comentario_Cliente).trim()) ? `<div class="note warn" style="margin-top:8px">
        Marcaste que el cliente respondió por ${esc(nomTipo(f.Tipo_Contacto).toLowerCase())}. Escribe qué respondió:
        es lo que separa una conversación de un mensaje enviado. Si todavía no contesta, el resultado
        es <b>No respondió</b>.</div>` : ""}</div>
  </div>

  <div id="errBox"></div>
  <div class="sticky-actions">
    <button class="btn" id="guardar">${S.editId ? "Guardar cambios" : "Registrar"}</button>
    <button class="btn ghost" data-back>Cancelar</button>
  </div>`;

  bindForm(c);
}

function bindForm(c){
  const f = S.form;
  $("#view").querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
    S.form = null; S.editId = null; S.tab = "cartera"; S.cid = String(c.customer_id); render(); });
  $("#view").querySelectorAll("[data-f]").forEach(el => {
    el.oninput = el.onchange = () => { f[el.dataset.f] = el.value; };
  });
  $("#view").querySelectorAll("[data-tipo]").forEach(el => el.onclick = () => {
    f.Tipo_Contacto = el.dataset.tipo;
    $("#view").querySelectorAll("[data-tipo]").forEach(x => x.classList.toggle("on", x.dataset.tipo === f.Tipo_Contacto));
    pintarDerivado(); pintarGps(); pintarGasto(); pintarCierre(c);
  });
  $("#view").querySelectorAll("[data-res]").forEach(el => el.onclick = () => {
    f.Resultado = el.dataset.res;
    $("#view").querySelectorAll("[data-res]").forEach(x => x.classList.toggle("on", x.dataset.res === f.Resultado));
    pintarDerivado(); pintarCierre(c);
  });
  $("#guardar").onclick = () => guardar(c);
  pintarDerivado(); pintarGps(); pintarEvidencia(); pintarGasto(); pintarCierre(c);
}

/* -------------------------------------------------------------------------
   Cerrar la gestión desde acá

   El momento en que el ejecutivo habla con el titular es el momento en que
   sabe si lo retuvo. Obligarlo a entrar después a "Editar comercio" era
   pedirle que se acuerde: las carteras se quedaban en Pendiente y a BBVA le
   llegaba Gestión = NO.

   Se ofrece lo mismo que permite la base: retención solo para un comercio
   activo, venta solo para uno que estaba dado de baja, y ninguna de las dos
   sin haber logrado la comunicación.
   ------------------------------------------------------------------------- */
function pintarCierre(c){
  const f = S.form, box = $("#boxCierre");
  if (!box) return;
  if (!c || esClienteNuevo(c)){ box.innerHTML = ""; return; }   // la venta nueva ya es venta

  const actual = c.resultado_gestion || "PENDIENTE";
  if (f.Cierre === null || f.Cierre === undefined) f.Cierre = actual;

  const logrado = esEfectivo(f.Resultado) ||
    DB.delCliente(c.customer_id).some(r => esEfectivo(r.Resultado) && r._id !== S.editId);

  const posibles = RESULTADOS_GESTION.filter(g => {
    if (g.id === "PENDIENTE" || g.id === "PERDIDO") return true;
    if (!logrado) return false;
    if (g.id === "RETENIDO") return c.estado === "ACTIVO";
    if (g.id === "VENTA")    return c.estado === "DE BAJA";
    return true;
  });
  if (!posibles.some(g => g.id === f.Cierre)) f.Cierre = "PENDIENTE";

  const cambia = f.Cierre !== actual;
  box.innerHTML = `
  <div class="card">
    <h3>¿Con esto se cierra la gestión?</h3>
    <div class="note" style="margin-bottom:11px">
      Es lo que BBVA lee como <b>objetivo cumplido</b>. Márcalo ahora, mientras tienes fresco lo que
      pasó: mientras siga pendiente, al banco le llega <b>Gestión = NO</b>.
    </div>
    <div class="opts">
      ${posibles.map(g => `
        <div class="opt ${f.Cierre === g.id ? "on" : ""}" data-cierre="${g.id}">
          <span class="rd"></span><span><b>${g.id === "PENDIENTE" ? "Sigue abierta" : g.label}</b>
          <span>${g.id === "PENDIENTE" ? "Todavía hay que seguir trabajándola" : esc(g.desc)}</span></span>
        </div>`).join("")}
    </div>
    ${!logrado ? `<div class="note warn" style="margin-top:11px">
      Con este resultado no se logró hablar con el titular, así que no se puede marcar como
      retención ni como venta. Registra el intento y vuelve cuando consigas la conversación.</div>` : ""}
    <div class="note ${cambia ? (gestionCumplida({resultado_gestion:f.Cierre}) ? "ok" : "") : ""}" style="margin-top:11px">
      ${cambia
        ? `Al guardar, el comercio pasa de <b>${esc((RESULTADOS_GESTION.find(g=>g.id===actual)||{}).label)}</b>
           a <b>${esc((RESULTADOS_GESTION.find(g=>g.id===f.Cierre)||{}).label)}</b> ·
           Para BBVA · Gestión = <b>${gestionCumplida({resultado_gestion:f.Cierre}) ? "SI" : "NO"}</b>`
        : `El comercio queda como está: <b>${esc((RESULTADOS_GESTION.find(g=>g.id===actual)||{}).label)}</b> ·
           Para BBVA · Gestión = <b>${gestionCumplida(c) ? "SI" : "NO"}</b>`}
    </div>
  </div>`;
  box.querySelectorAll("[data-cierre]").forEach(el => el.onclick = () => {
    f.Cierre = el.dataset.cierre;
    pintarCierre(c);
  });
}

function pintarGps(){
  const f = S.form, box = $("#boxGps");
  if (!box) return;
  if (!RULES.requiereUbicacion(f.Tipo_Contacto)){ box.innerHTML = ""; return; }

  if (S.editId){
    const ok = f.Ubicacion_Verificada === true;
    box.innerHTML = `
    <div class="card">
      <h3>Ubicación capturada</h3>
      <div class="note"><b>Este dato no se puede modificar.</b> La ubicación la tomó el GPS del equipo en el momento de la visita y sirve como constancia auditable; la base rechaza cualquier intento de cambiarla.</div>
      ${ok ? `
      <div class="kv" style="margin-top:9px"><dt>Coordenadas</dt><dd class="mono">${esc(f.Ubicacion) || "—"}</dd></div>
      ${/^-?\d+\.\d+,\s*-?\d+\.\d+/.test(f.Ubicacion||"") ? `<div style="margin-top:9px">
        <a class="btn ghost sm" target="_blank" rel="noopener"
           href="https://www.google.com/maps?q=${encodeURIComponent(String(f.Ubicacion).split("(")[0].trim())}">Ver en el mapa</a></div>` : ""}`
      : `<div class="note warn" style="margin-top:9px"><b>Sin ubicación verificada.</b> Este registro se guardó sin señal de GPS, así que no tiene respaldo del lugar. La marca es permanente.</div>`}
    </div>`;
    return;
  }

  const cap = f.Ubicacion_Verificada === true;
  box.innerHTML = `
  <div class="card">
    <h3>Ubicación del registro <span class="req">*</span></h3>
    <div class="note" style="margin-bottom:11px">
      Obligatoria para contactos presenciales: deja constancia auditable de dónde se realizó la visita.
      Las coordenadas <b>las toma el GPS del equipo</b> — no se escriben ni se pueden corregir, ni antes
      ni después de guardar.
    </div>
    <button class="btn ${cap ? "ghost" : ""} block" id="gps">📍 ${cap ? "Volver a capturar" : "Capturar mi ubicación actual"}</button>
    <div id="gpsVal" style="margin-top:11px">${cap ? tarjetaUbicacion(f.Ubicacion) : ""}</div>
    <div id="gpsMsg"></div>
    ${(!cap && !f._sinUbicacion) ? `
      <button class="btn ghost sm block" id="gpsOmitirYa" style="margin-top:9px">
        No puedo capturar la ubicación</button>
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center">
        Sin señal, sin permiso de GPS, o una visita anterior que estás registrando después.
      </div>` : ""}
    ${f._sinUbicacion ? notaSinUbicacion() : ""}
  </div>`;

  /* La salida tiene que estar visible desde el principio. Antes solo aparecía
     después de que el GPS fallara, y si el navegador nunca respondía —permiso
     descartado, equipo sin ubicación— el ejecutivo quedaba atrapado: el aviso
     le pedía usar un botón que no estaba en pantalla. */
  if ($("#gpsOmitirYa")) $("#gpsOmitirYa").onclick = () => {
    f.Ubicacion = ""; f.Ubicacion_Verificada = false; f._sinUbicacion = true;
    pintarGps();
  };

  $("#gps").onclick = () => {
    const msg = $("#gpsMsg");
    if (!navigator.geolocation){ return fallaGps("Este dispositivo no permite obtener la ubicación."); }
    msg.innerHTML = `<div class="note" style="margin-top:9px">Obteniendo ubicación…</div>`;
    // Algunos navegadores no llaman de vuelta si el usuario descarta el aviso
    // de permiso: sin esto, el mensaje se queda girando para siempre.
    let respondio = false;
    setTimeout(() => { if (!respondio && $("#gpsMsg") && /Obteniendo/.test($("#gpsMsg").innerText))
      fallaGps("El equipo no respondió. Puede que no se haya dado permiso de ubicación."); }, 14000);
    navigator.geolocation.getCurrentPosition(
      p => {
        respondio = true;
        f.Ubicacion = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)} (±${Math.round(p.coords.accuracy)} m)`;
        f.Ubicacion_Verificada = true;
        f._sinUbicacion = false;
        pintarGps();
        $("#gpsMsg").innerHTML = `<div class="note ok" style="margin-top:9px"><b>Ubicación capturada.</b> Precisión ±${Math.round(p.coords.accuracy)} m.</div>`;
      },
      e => { respondio = true; fallaGps(e.message); },
      { enableHighAccuracy:true, timeout:12000, maximumAge:0 });
  };

  function fallaGps(motivo){
    f.Ubicacion = ""; f.Ubicacion_Verificada = false;
    $("#gpsVal").innerHTML = "";
    $("#gpsMsg").innerHTML = `
      <div class="note warn" style="margin-top:9px">
        <b>No se pudo obtener la ubicación.</b> ${esc(motivo || "")}
        <div style="margin-top:5px;font-size:12px">Revisa que el GPS del celular esté encendido y que el navegador
        tenga permiso de ubicación. Vuelve a intentarlo desde el botón de arriba.</div>
        <button class="btn ghost sm block" id="gpsOmitir" style="margin-top:9px">Registrar sin ubicación verificada</button>
      </div>`;
    $("#gpsOmitir").onclick = () => {
      f._sinUbicacion = true;
      pintarGps();
    };
  }
}

function tarjetaUbicacion(v){

      <div class="mono" style="font-size:15px;margin-top:3px">${esc(v)}</div>
      ${coord ? `<a class="btn ghost sm" style="margin-top:8px" target="_blank" rel="noopener"
         href="https://www.google.com/maps?q=${encodeURIComponent(coord)}">Ver en el mapa</a>` : ""}

  const f = S.form, msg = $("#gastoMsg");
  if (!msg) return;
  const monto = Number(f.Gasto_Total || 0);
  const n = (f.Gastos_Paths||[]).length + (f.Gastos_Nuevos||[]).length;

    msg.innerHTML = `<div class="note warn">Declaraste <b>${soles(monto)}</b> pero todavía no adjuntas ningún comprobante.</div>`;

    msg.innerHTML = `<div class="note ok"><b>${soles(monto)}</b> con ${n} comprobante${n===1?"":"s"} adjunto${n===1?"":"s"}.</div>`;

    ${(guardados.length || nuevos.length) ? `<div class="cmp-grid">
      ${guardados.map((p,i) => `<div class="cmp"><div class="cmp-ph">📄</div>
        <div class="cmp-n">Comprobante ${i+1}</div>
        <button class="btn ghost sm" data-cmpdelg="${i}">Quitar</button></div>`).join("")}
      ${nuevos.map((d,i) => `<div class="cmp"><img src="${d}" alt="Comprobante">

    <button class="btn ghost block" id="cmpAdd" style="margin-top:9px">📎 Adjuntar comprobante</button>

function comprimir(file, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1100, r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => cb(rd.result);
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}


/* ---- Guardar ----------------------------------------------------------- */
async function guardar(c){
  const f = S.form, errores = [];
  if (!f.Fecha_Contacto) errores.push("Indica la fecha del contacto.");
  if (!f.Tipo_Contacto) errores.push("Selecciona cómo se contactó al cliente.");
  if (!f.Resultado) errores.push("Indica cuál fue el resultado del intento.");
  if (!S.editId && RULES.requiereUbicacion(f.Tipo_Contacto) && !f.Ubicacion_Verificada && !f._sinUbicacion)
    errores.push("Captura la ubicación con el botón, o marca “No puedo capturar la ubicación” si el GPS no responde o estás registrando una visita anterior.");
  if (!f.Evidencia) errores.push("Adjunta la evidencia (foto o print de pantalla) del contacto.");
  if (!String(f.Comentario_Ejecutivo).trim()) errores.push("Escribe el comentario del ejecutivo.");
  /* Enviar un correo o un WhatsApp no es que te hayan respondido. Si se marca
     que el cliente respondió, tiene que haber algo que citar. */
  if (pruebaDeRespuesta(f) && !String(f.Comentario_Cliente).trim())
    errores.push(`Escribe qué respondió el cliente por ${nomTipo(f.Tipo_Contacto).toLowerCase()}. Si todavía no contesta, cambia el resultado a “No respondió”.`);
  const gasto = Number(f.Gasto_Total || 0);
  const nCmp = (f.Gastos_Paths||[]).length + (f.Gastos_Nuevos||[]).length;
  if (gasto > 0 && nCmp === 0) errores.push("Adjunta el comprobante del gasto que declaraste.");
  if (nCmp > 0 && gasto <= 0)  errores.push("Anota el monto total de los comprobantes que adjuntaste.");
  if (gasto < 0)     errores.push("El monto del gasto no puede ser negativo.");
  if (gasto > 2000)  errores.push("El monto supera el máximo permitido por visita (S/ 2,000).");
  if (errores.length){
    $("#errBox").innerHTML = `<div class="err"><b>Falta completar:</b><ul style="margin:6px 0 0;padding-left:18px">${errores.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
    $("#errBox").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  const btn = $("#guardar");
  btn.disabled = true; btn.textContent = "Guardando…";
  try {
    {
      // La evidencia va al bucket privado; en la fila solo queda la ruta.
      if (f.Evidencia && !f.Evidencia_Path){
        const ruta = await subirEvidencia(f.Evidencia);
        if (ruta) f.Evidencia_Path = ruta;
      }
      // Cada comprobante nuevo va al bucket privado, igual que la evidencia.
      if ((f.Gastos_Nuevos || []).length){
        for (const d of f.Gastos_Nuevos){
          const ruta = await subirEvidencia(d);
          if (ruta) f.Gastos_Paths.push(ruta);
        }
        f.Gastos_Nuevos = [];
      }
      const fila = aDB(f, c);
      const { error } = S.editId
        ? await sb.from("interacciones").update(fila).eq("id", S.editId)
        : await sb.from("interacciones").insert(fila);
      if (error) throw new Error(error.message);

      // El cierre va después de la gestión, nunca antes: la base exige que ya
      // exista el contacto logrado que lo respalda.
      if (f.Cierre && !esClienteNuevo(c) && f.Cierre !== (c.resultado_gestion || "PENDIENTE")){
        const { error: eCierre } = await sb.from("clientes")
          .update({ resultado_gestion: f.Cierre }).eq("customer_id", String(c.customer_id));
        if (eCierre) throw new Error("La gestión quedó registrada, pero el cierre no: " + eCierre.message);
      }
      await recargarCartera(); await refrescar(); await cargarAuditoria();
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = S.editId ? "Guardar cambios" : "Registrar";
    $("#errBox").innerHTML = `<div class="err"><b>No se pudo guardar.</b><br>${esc(err.message)}</div>`;
    $("#errBox").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  const cerro = f.Cierre && !esClienteNuevo(c) && f.Cierre !== "PENDIENTE" && f.Cierre !== (c.resultado_gestion || "PENDIENTE");
  toast(cerro
    ? `Gestión cerrada como ${(RESULTADOS_GESTION.find(g=>g.id===f.Cierre)||{}).label}`
    : (S.editId ? "Registro actualizado" : "Contacto registrado en el histórico"));
  S.form = null; S.editId = null; S.tab = "cartera"; S.cid = String(c.customer_id);
  window.scrollTo(0,0);
  render();
}

  S.editId = id; S.cid = String(r.Customer_id); S.form = null;
  S.tab = "form_visita";

  render();
}

function confirmarEliminar(id){
  const r = DB.buscar(id);
  if (!r) return;
  if (!puedeEditar(r)) return toast("Solo puedes eliminar tus propios registros");
  const c = byId[String(r.Customer_id)];
