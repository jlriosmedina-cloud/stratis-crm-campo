/* ---------- Registros: historial con buscador y filtros ------------------ */
function viewRegistros(){
  let todos = S.user.rol === "Ejecutivo"
    ? DB.todos().filter(r => r.Correo_Stratis === S.user.correo)
    : DB.todos();
  todos.sort((a,b) => ts(b) - ts(a));

  const efect   = todos.filter(r => esEfectivo(r.Resultado)).length;

  let lista = todos;
  const q = S.qReg.trim().toLowerCase();
  if (q) lista = lista.filter(r => {
    const c = byId[String(r.Customer_id)] || {};
    return String(r.Customer_id).toLowerCase().includes(q)
        || String(c.nombre_comercio||"").toLowerCase().includes(q)
        || String(c.distrito||"").toLowerCase().includes(q)
        || String(r.Ejecutivo||"").toLowerCase().includes(q)
        || String(r.Comentario_Ejecutivo||"").toLowerCase().includes(q)
        || String(r.Comentario_Cliente||"").toLowerCase().includes(q);
  });
  if (S.fResultado === "efectivos")      lista = lista.filter(r => esEfectivo(r.Resultado));
  else if (S.fResultado === "fallidos")  lista = lista.filter(r => !esEfectivo(r.Resultado));
  else if (S.fResultado === "sin_ubicacion") lista = lista.filter(sinUbicacionVerificada);
  else if (S.fResultado !== "todos")     lista = lista.filter(r => r.Resultado === S.fResultado);
  if (S.fMedio !== "todos")   lista = lista.filter(r => r.Tipo_Contacto === S.fMedio);
  if (S.fEjecReg !== "todos") lista = lista.filter(r => r.Ejecutivo === S.fEjecReg);

  const medios = TIPOS_CONTACTO.filter(t => todos.some(r => r.Tipo_Contacto === t.id));
  const mostrar = lista.slice(0, S.limiteReg);

  const filtrando = q || S.fResultado !== "todos" || S.fMedio !== "todos" || S.fEjecReg !== "todos";
  const opciones = (valor, todos, items) =>
    `<option value="todos"${valor==="todos"?" selected":""}>${todos}</option>` +
    items.map(([v,l]) => `<option value="${esc(v)}"${valor===v?" selected":""}>${esc(l)}</option>`).join("");

  return `
  <div class="page-head">
    <div>
      <h2>${S.user.rol === "Ejecutivo" ? "Mis registros" : "Registros del equipo"}</h2>
      <div class="sub">Cada contacto y cada intento, en orden del más reciente al más antiguo</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="lbl">Registros</div><div class="val">${todos.length}</div><div class="sub">intentos de comunicación</div></div>
    <div class="stat"><div class="lbl">Con respuesta</div><div class="val">${efect}</div><div class="sub">${todos.length?Math.round(efect/todos.length*100):0}% de los intentos obtuvo respuesta</div></div>
    <div class="stat"><div class="lbl">Visitas válidas</div><div class="val">${todos.filter(r=>r.Cumple_Visita==="SI").length}</div><div class="sub">presenciales o virtuales logradas</div></div>
    <div class="stat"><div class="lbl">Sin ubicación</div><div class="val">${todos.filter(sinUbicacionVerificada).length}</div><div class="sub">presenciales sin respaldo de GPS</div></div>
  </div>

  <div class="filtros">
    <div class="search"><span class="mag">⌕</span>
      <input type="search" id="qReg" placeholder="Buscar por comercio, Customer ID, distrito o comentario…" value="${esc(S.qReg)}"></div>

    <div class="seg" role="group" aria-label="Resultado">
      ${[["todos","Todos"],["efectivos","El cliente respondió"],["fallidos","Sin respuesta"]]
        .map(([k,l]) => `<button class="${S.fResultado===k?"on":""}" data-fr="${k}">${l}</button>`).join("")}
      ${todos.some(sinUbicacionVerificada)
        ? `<button class="${S.fResultado==="sin_ubicacion"?"on":""}" data-fr="sin_ubicacion">Sin ubicación</button>` : ""}
    </div>

    <div class="sel-row">
      <label class="fsel"><span>Resultado</span>
        <select data-fr-sel>${opciones(RESULTADOS.some(x=>x.id===S.fResultado)?S.fResultado:"todos", "Cualquier resultado",
          RESULTADOS.filter(x => todos.some(r => r.Resultado === x.id)).map(x => [x.id, `${x.label} · ${todos.filter(r => r.Resultado === x.id).length}`]))}</select></label>
      <label class="fsel"><span>Medio</span>
        <select data-fm-sel>${opciones(S.fMedio, "Todos los medios", medios.map(t => [t.id, `${t.label} · ${todos.filter(r => r.Tipo_Contacto === t.id).length}`]))}</select></label>
      ${S.user.rol !== "Ejecutivo" ? `<label class="fsel"><span>Ejecutivo</span>
        <select data-fe-sel>${opciones(S.fEjecReg, `Todo el equipo · ${todos.length}`,
          USUARIOS.filter(u=>u.rol==="Ejecutivo")
            .map(u => [u.nombre, `${u.nombre} · ${todos.filter(r => r.Ejecutivo === u.nombre).length}`]))}</select></label>` : ""}
    </div>

    ${filtrando ? `<div class="filtros-pie">
      <span>${lista.length} de ${todos.length} registros</span>
      <button class="btn ghost sm" id="limpiarReg">Quitar filtros</button>
    </div>` : ""}
  </div>

  <div class="sec-title">${lista.length} registro${lista.length===1?"":"s"}${S.user.rol==="Ejecutivo"?" — míos":" — todo el equipo"}</div>
  ${mostrar.length ? `<div class="tl tl-lectura">${mostrar.map(r => {
      const c = byId[String(r.Customer_id)];
      const res = resultadoById(r.Resultado);
      return `<div class="tl-item">
        <div class="card" style="margin-bottom:0">
          <div class="tl-h">
            <div>
              <div class="who" data-cid="${r.Customer_id}" style="cursor:pointer;color:var(--brand-2)">${esc(titulo(c?nombreCliente(c):"—"))}</div>
              <div class="dt">${fmtDT(r.Fecha_Contacto,r.Hora_Contacto)} · ${esc((tipoById(r.Tipo_Contacto)||{}).label||"")} · ${esc(r.Ejecutivo)}</div>
            </div>
            <span class="chip ${res && res.ok ? "ok" : "serious"}">${esc(res?res.label:r.Resultado)}</span>
          </div>
          ${sinUbicacionVerificada(r)?`<div style="margin-top:7px"><span class="chip crit">📍 Sin ubicación verificada</span></div>`:""}
          ${r.Comentario_Ejecutivo?`<div class="quote"><b>Ejecutivo</b>${esc(r.Comentario_Ejecutivo)}</div>`:""}
          ${puedeEditar(r)?`<div style="display:flex;gap:7px;margin-top:11px">
            <button class="btn ghost sm" data-edit="${r._id}">Editar</button>
            <button class="btn ghost sm" data-del="${r._id}" style="color:var(--crit-ink)">Eliminar</button>
            <button class="btn ghost sm" data-cid="${r.Customer_id}">Ver ficha</button></div>`:""}
        </div></div>`;
    }).join("")}</div>`
    : todos.length
      ? `<div class="empty"><div class="big">⌕</div>No hay registros con estos filtros.</div>`
      : `<div class="empty"><div class="big">≡</div>Todavía no has registrado contactos.<br><br>
         <button class="btn" data-go="cartera">Ir a mi cartera</button></div>`}
  ${lista.length > mostrar.length ? `<button class="btn ghost block" id="masReg">Ver ${Math.min(40, lista.length-mostrar.length)} más de ${lista.length-mostrar.length}</button>` : ""}

  <div class="card" style="margin-top:14px">
    <div class="note"><b>Editar no suma un intento.</b> El contador solo sube cuando registras un contacto
    nuevo desde la ficha del comercio. Al editar solo puedes corregir comentarios y calificación:
    el medio, el resultado, la fecha y la ubicación quedan fijos.</div>
  </div>`;
}


/* ---------- Panel de avance y efectividad -------------------------------- */
function viewPanel(){
  const base = cartera();
  base.forEach(c => RULES.recomputarBase(c.customer_id));
  const total = base.length;
  const conEf = base.filter(c => c._base._efectivos > 0).length;
  const cumple = base.filter(c => c._base.Cumple_Visita === "SI").length;

  const visibles = new Set(base.map(c => String(c.customer_id)));
  const regs = DB.todos().filter(r => visibles.has(String(r.Customer_id)));
  const intentos = regs.length;
  const efectivos = regs.filter(r => esEfectivo(r.Resultado)).length;
  const pctEf = intentos ? Math.round(efectivos / intentos * 100) : 0;

  const ejecutivos = USUARIOS.filter(u => u.rol === "Ejecutivo").map(u => {
    const cs = CLIENTES.filter(c => c.asignado_correo === u.correo);
    cs.forEach(c => RULES.recomputarBase(c.customer_id));
    const rs = DB.todos().filter(r => r.Correo_Stratis === u.correo);
    const ef = rs.filter(r => esEfectivo(r.Resultado)).length;
    return { nombre:u.nombre, clientes:cs.length, intentos:rs.length, efectivos:ef,
      ids: cs.filter(c => !esClienteNuevo(c)).length,
      nuevos: cs.filter(esClienteNuevo).length,
      cumple: rs.filter(r => r.Cumple_Visita === "SI").length,
      trabajados: new Set(rs.map(r => String(r.Customer_id))).size,
      pct: rs.length ? ef / rs.length * 100 : 0 };
  }).filter(e => e.clientes || e.intentos).sort((a,b) => b.pct - a.pct);

  /* ---- Cierre de la gestión --------------------------------------------
     Dos números distintos y los dos hacen falta:
     · Avance: cuánto de la cartera ya tiene el objetivo cumplido. Al inicio
       de campaña es bajo por definición, porque casi todo está pendiente.
     · Efectividad de cierre: de lo ya decidido, cuánto se ganó. Dice qué tan
       bien cierran, sin castigarlos por lo que todavía están trabajando.
     Por separado engañan: 100% de efectividad de cierre con 3 comercios
     decididos de 200 no es una buena campaña. */
  const nCierre = id => base.filter(c => (c.resultado_gestion || "PENDIENTE") === id).length;
  const retenidos = nCierre("RETENIDO"), ventas = nCierre("VENTA");
  const perdidos  = nCierre("PERDIDO"),  pendientes = nCierre("PENDIENTE");
  const cumplido  = retenidos + ventas;
  const decididos = cumplido + perdidos;
  const pctAvance = total ? Math.round(cumplido / total * 100) : 0;
  const pctCierre = decididos ? Math.round(cumplido / decididos * 100) : 0;
  const repartoCierre = [
    { label:"Retenidos",  n:retenidos,  color:"var(--good)" },
    { label:"Ventas",     n:ventas,     color:"var(--brand-2)" },
    { label:"Perdidos",   n:perdidos,   color:"var(--crit)" },
    { label:"Pendientes", n:pendientes, color:"var(--line)" }
  ].filter(x => x.n > 0);

  const porResultado = RESULTADOS.map(x => ({ label:x.label, ok:x.ok,
    n: regs.filter(r => r.Resultado === x.id).length })).filter(x => x.n > 0);
  const maxRes = Math.max(1, ...porResultado.map(x => x.n));

  const tipos = TIPOS_CONTACTO.map(t => ({ label:t.label, n: regs.filter(r => r.Tipo_Contacto === t.id).length }))
    .filter(x => x.n > 0).sort((a,b) => b.n - a.n);
  const maxTipo = Math.max(1, ...tipos.map(t => t.n));

  const rubros = RUBROS.map(r => {
    const cs = base.filter(c => c.rubro === r.codigo);
    const ct = cs.filter(c => c._base._efectivos > 0).length;
    return { label:r.nombre, total:cs.length, cont:ct, pct: cs.length ? ct/cs.length*100 : 0 };
  }).filter(x => x.total > 0).sort((a,b) => b.total - a.total);

  const insistencia = [1,2,3].map(k => ({ k,
    n: base.filter(c => c._base._intentos === k).length }))
    .concat([{ k:"4+", n: base.filter(c => c._base._intentos >= 4).length }])
    .filter(x => x.n > 0);
  const maxIns = Math.max(1, ...insistencia.map(x => x.n));

  // Respaldo de ubicación: cuántos registros presenciales tienen coordenadas de GPS
  const presenciales = regs.filter(r => RULES.requiereUbicacion(r.Tipo_Contacto));
  const sinUbi = presenciales.filter(r => r.Ubicacion_Verificada !== true);
  const pctUbi = presenciales.length ? Math.round((presenciales.length - sinUbi.length) / presenciales.length * 100) : 100;
  // Viáticos: lo que la campaña lleva gastado en campo
  const conGasto = regs.filter(r => Number(r.Gasto_Total) > 0);
  const totalGasto = conGasto.reduce((n,r) => n + Number(r.Gasto_Total), 0);
  const gastoEjec = [...new Set(conGasto.map(r => r.Ejecutivo))]
    .map(n => ({ nombre:n, total: conGasto.filter(r => r.Ejecutivo === n).reduce((a,r) => a + Number(r.Gasto_Total), 0),
                 visitas: conGasto.filter(r => r.Ejecutivo === n).length }))
    .sort((a,b) => b.total - a.total);
  const maxGasto = Math.max(1, ...gastoEjec.map(x => x.total));

  const sinUbiEjec = [...new Set(sinUbi.map(r => r.Ejecutivo))]
    .map(n => ({ nombre:n, n: sinUbi.filter(r => r.Ejecutivo === n).length }))
    .sort((a,b) => b.n - a.n);


  return `
  <div class="stat-row">
    <div class="stat"><div class="lbl">Comercios</div><div class="val">${total}</div><div class="sub">registrados en campo</div></div>
    <div class="stat"><div class="lbl">Intentos</div><div class="val">${intentos}</div><div class="sub">${total?(intentos/total).toFixed(1):0} por comercio</div></div>
    <div class="stat"><div class="lbl">Tasa de respuesta</div><div class="val">${pctEf}%</div><div class="sub">${efectivos} de ${intentos} intentos obtuvieron respuesta</div></div>
    <div class="stat"><div class="lbl">Visitas válidas</div><div class="val">${cumple}</div><div class="sub">${total?Math.round(cumple/total*100):0}% de la cartera</div></div>
    <div class="stat"><div class="lbl">Objetivo cumplido</div><div class="val">${cumplido}</div><div class="sub">${pctAvance}% de la cartera · Gestión = SI</div></div>
  </div>

  <div class="card">
    <h3>Cierre de la gestión · lo que BBVA lee como objetivo cumplido</h3>
    ${total ? `
    <div class="stat-row" style="margin-bottom:13px">
      <div class="stat"><div class="lbl">Avance de la campaña</div><div class="val">${pctAvance}%</div>
        <div class="sub">${cumplido} de ${total} comercios ya cerraron con objetivo cumplido</div></div>
      <div class="stat"><div class="lbl">Efectividad de cierre</div><div class="val">${decididos ? pctCierre + "%" : "—"}</div>
        <div class="sub">${decididos ? cumplido + " de " + decididos + " comercios ya decididos" : "Todavía no hay ningún comercio decidido"}</div></div>
      <div class="stat"><div class="lbl">Todavía abiertos</div><div class="val">${pendientes}</div>
        <div class="sub">${total?Math.round(pendientes/total*100):0}% de la cartera en trabajo</div></div>
    </div>
    <div class="g-barra">
      ${repartoCierre.map(x => `<span style="width:${(x.n/total*100).toFixed(1)}%;background:${x.color}" title="${esc(x.label)}: ${x.n}"></span>`).join("")}
    </div>
    <div class="g-leyenda">
      ${repartoCierre.map(x => `<span><i style="background:${x.color}"></i>${esc(x.label)} · <b>${x.n}</b></span>`).join("")}
    </div>
    <div class="note" style="margin-top:12px">
      <b>Los dos números dicen cosas distintas.</b> El <b>avance</b> es cuánto de la cartera ya está
      cerrado con objetivo cumplido; al empezar la campaña va a ser bajo, y está bien.
      La <b>efectividad de cierre</b> mira solo lo ya decidido: de cada comercio que dejó de estar
      pendiente, cuántos se ganaron. Un 100% de efectividad con 3 comercios decididos de 200 no es
      una buena campaña — por eso van juntos.
    </div>
    <div class="note" style="margin-top:9px">
      Nada de esto es lo mismo que la <b>tasa de respuesta</b> de arriba, que solo mide en cuántos
      intentos el cliente contestó. Que respondan no es que se queden: se puede tener 100% de
      respuesta y 0% de retención. Y mandar un correo o un WhatsApp no cuenta como respuesta
      mientras nadie conteste.
    </div>` : `<div class="note">Todavía no hay comercios registrados en la campaña.</div>`}
  </div>

  <div class="grid2">
   <div>
    <div class="card">
      <h3>Tasa de respuesta por ejecutivo · % de intentos que obtuvieron respuesta</h3>
      ${ejecutivos.length ? ejecutivos.map(e => `
        <div class="bar-row">
          <span class="nm">${esc(e.nombre)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${e.pct.toFixed(1)}%"></span></span>
          <span class="bar-val">${Math.round(e.pct)}%</span>
        </div>
        <div class="bar-sub">${e.ids} Customer ID${e.nuevos ? " + " + e.nuevos + " nuevo" + (e.nuevos===1?"":"s") : ""} · ${e.intentos} intentos · ${e.efectivos} con respuesta · ${e.cumple} visitas válidas</div>
      `).join("") : `<div class="note">Todavía no hay actividad registrada en la campaña.</div>`}
    </div>

    <div class="card">
      <h3>Customer ID registrados · por ejecutivo</h3>
      <div class="note" style="margin-bottom:11px">
        Cuántos comercios de la cartera de BBVA lleva cargado cada uno. Las ventas nuevas van
        aparte: no tienen Customer ID.
      </div>
      ${(() => {
        const reg = ejecutivos.slice().sort((a,b) => b.ids - a.ids);
        const maxId = Math.max(1, ...reg.map(e => e.ids));
        return reg.length ? reg.map(e => `
          <div class="bar-row">
            <span class="nm">${esc(e.nombre)}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${(e.ids/maxId*100).toFixed(1)}%"></span></span>
            <span class="bar-val">${e.ids}</span>
          </div>
          ${e.nuevos ? `<div class="bar-sub">+ ${e.nuevos} venta${e.nuevos===1?"":"s"} nueva${e.nuevos===1?"":"s"} por RUC</div>` : ""}
        `).join("") : `<div class="note">Todavía no hay comercios registrados.</div>`;
      })()}
      <div class="bar-sub" style="margin-top:9px">
        Total de la campaña: <b>${base.filter(c => !esClienteNuevo(c)).length}</b> Customer ID${
          base.filter(esClienteNuevo).length ? ` · <b>${base.filter(esClienteNuevo).length}</b> ventas nuevas` : ""}
      </div>
    </div>

    <div class="card">
      <h3>Resultado de los intentos</h3>
      ${porResultado.length ? porResultado.map(x => `
        <div class="bar-row">
          <span class="nm">${esc(x.label)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(x.n/maxRes*100).toFixed(1)}%;background:${x.ok?"var(--good)":"var(--serious)"}"></span></span>
          <span class="bar-val">${x.n}</span>
        </div>`).join("") : `<div class="note">Aún no hay intentos registrados.</div>`}
      <div class="note" style="margin-top:9px">Cada registro cuenta como intento, aunque sea el cuarto con el mismo comercio. Solo el resultado <b>“Habló con el contacto”</b> suma como comunicación lograda.</div>
    </div>

    <div class="card">
      <h3>Insistencia · comercios por cantidad de intentos</h3>
      ${insistencia.length ? insistencia.map(x => `
        <div class="bar-row">
          <span class="nm">${x.k} intento${x.k===1?"":"s"}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(x.n/maxIns*100).toFixed(1)}%"></span></span>
          <span class="bar-val">${x.n}</span>
        </div>`).join("") : `<div class="note">Sin datos todavía.</div>`}
    </div>
   </div>

   <div>
    <div class="card">

const hoja = (cols, filas) => {
  const ws = XLSX.utils.aoa_to_sheet([cols].concat(filas));
  ws["!cols"] = cols.map(c => ({ wch: Math.min(32, Math.max(11, String(c).length + 3)) }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:filas.length, c:cols.length-1} }) };
  ws["!freeze"] = { xSplit:0, ySplit:1 };
  return ws;
};

function hojaAvance(){
  const cols = ["Ejecutivo","Comercios registrados","Comercios trabajados","Comercios sin intentar","Intentos",
                "Presenciales","Reuniones virtuales","Llamadas","WhatsApp","Correos","Suma por medio","Cuadra",
                "Gestiones con respuesta","Sin respuesta","% Tasa de respuesta","Intentos por comercio","Visitas válidas",
                "Retenidos","Ventas","Perdidos","Pendientes","Objetivo cumplido","% Avance","% Efectividad de cierre",
                "Sin ubicación verificada","Viáticos (S/)","Visitas con gasto"];
  const filas = USUARIOS.filter(u => u.rol === "Ejecutivo").map(u => {
    const cs = CLIENTES.filter(c => c.asignado_correo === u.correo);
    cs.forEach(c => RULES.recomputarBase(c.customer_id));
    const rs = DB.todos().filter(r => r.Correo_Stratis === u.correo);
    const ef = rs.filter(r => esEfectivo(r.Resultado)).length;
    const n = id => cs.filter(c => (c.resultado_gestion || "PENDIENTE") === id).length;
    const ret = n("RETENIDO"), ven = n("VENTA"), per = n("PERDIDO"), pen = n("PENDIENTE");
    const cumplido = ret + ven, decididos = cumplido + per;
    const nPres = rs.filter(r => ES_PRESENCIAL(r.Tipo_Contacto)).length;
    const nVirt = rs.filter(r => ES_VIRTUAL(r.Tipo_Contacto)).length;
    const nLlam = rs.filter(r => r.Tipo_Contacto === "llamada").length;
    const nWsp  = rs.filter(r => r.Tipo_Contacto === "whatsapp").length;
    const nCorr = rs.filter(r => r.Tipo_Contacto === "correo").length;
    const suma  = nPres + nVirt + nLlam + nWsp + nCorr;
    const trabajados = new Set(rs.map(r => String(r.Customer_id))).size;
    return [u.nombre, cs.length, trabajados, cs.length - trabajados, rs.length,
      nPres, nVirt, nLlam, nWsp, nCorr, suma, suma === rs.length ? "SI" : "REVISAR",
      ef, rs.length - ef,
      rs.length ? Math.round(ef/rs.length*10000)/10000 : 0,
      cs.length ? Math.round(rs.length/cs.length*10)/10 : 0,
      rs.filter(r => r.Cumple_Visita === "SI").length,
      ret, ven, per, pen, cumplido,
      cs.length ? Math.round(cumplido/cs.length*10000)/10000 : 0,
      decididos ? Math.round(cumplido/decididos*10000)/10000 : "",
      rs.filter(sinUbicacionVerificada).length,
      Math.round(rs.reduce((n2,r) => n2 + (Number(r.Gasto_Total)||0), 0) * 100) / 100,
      rs.filter(r => Number(r.Gasto_Total) > 0).length];
  });
  const ws = hoja(cols, filas);
  formatoPorcentaje(ws, cols, filas, ["% Tasa de respuesta","% Avance","% Efectividad de cierre"]);
  return ws;
}

const CAMPO_ES = { comentario_ejecutivo:"Comentario del ejecutivo", comentario_cliente:"Comentario del cliente",

  estado:"Estado del cliente", resultado_gestion:"Resultado de la gestión",
  observacion:"Observación", ruc:"RUC", razon_social:"Razón social",
  customer_id:"Customer ID" };
const nomCampo = k => CAMPO_ES[k] || k;
const valTexto = v => v === null || v === undefined || v === "" ? "(vacío)" : String(v);

function resumenAuditoria(a){
  const d = a.detalle || {};
  if (a.accion === "eliminar"){
    const b = d._borrado;
    if (!b) return a.tabla === "clientes" ? "Eliminó el comercio completo" : "Eliminó una gestión";
    /* Se arma con las partes que existan: un registro viejo puede no tener
       todas, y no queremos líneas con paréntesis vacíos ni puntos sueltos. */
    const partes = xs => xs.filter(x => x !== null && x !== undefined && String(x).trim() !== "").join(" · ");
    if (a.tabla === "clientes"){
      const g = Number(b.gestiones) || 0;
      return partes([
        "Eliminó el comercio" + (b.llave ? ` (${b.llave})` : ""),
        b.cierre ? ((RESULTADOS_GESTION.find(x=>x.id===b.cierre)||{}).label || b.cierre) : "",
        b.distrito ? titulo(b.distrito) : "",
        `se llevó ${g} ${g === 1 ? "gestión" : "gestiones"}`
      ]);
    }
    return partes([
      "Eliminó la gestión" + (b.fecha ? ` del ${b.fecha}${b.hora ? " " + b.hora : ""}` : ""),
      b.medio ? nomTipo(b.medio) : "",
      b.resultado ? nomResultado(b.resultado) : "",
      b.cumple === "SI" ? "cumplía visita" : "",
      Number(b.gasto) > 0 ? soles(b.gasto) + " en viáticos" : ""
    ]);
  }
  /* Las claves con guion bajo son contexto, no campos editados: no se listan
     como "antes → después" sino que se cuentan aparte. */
  const cambios = Object.keys(d).filter(k => k[0] !== "_")
    .map(k => `${nomCampo(k)}: ${valTexto(d[k].antes)} → ${valTexto(d[k].despues)}`);
  const n = Number(d._arrastro);
  if (n > 0) cambios.push(`se movieron ${n} ${n === 1 ? "gestión" : "gestiones"} con él`);
  if (d._nota) cambios.push(String(d._nota));
  return cambios.join(" · ");
}

/* =========================================================================
   Resumen para BBVA — una fila por comercio, en el formato exacto del banco.
   Los nombres, el orden y la cantidad de columnas son los de su archivo, para
   que el bloque se pegue tal cual sin reordenar nada.
   ========================================================================= */
const COLS_BBVA = ["customer_id","Gestión","Comentario de Cliente","Visitas","Llamadas",
  "Fecha de llamada o visita","Direccion_Actual","Contactado (Si/No)",
  "Visita_Presencial","Visita_Virtual","Cumple_Visita","Fecha_Visita"];

/* Columnas propias de Stratis, para el análisis interno. No van al banco.
   Van agrupadas por lo que miden, y la primera tanda cierra la aritmética:

     Visitas (col D) + Llamadas (col E) + Reuniones + WhatsApp + Correos
       = Suma_por_Medio = Intentos

   Visitas y Llamadas no se repiten acá a propósito: ya están en el bloque del
   banco, y dos columnas con el mismo dato terminan discrepando el día que
   alguien edite una. En su lugar va Suma_por_Medio, que las incluye, y
   Cuadra, que avisa si alguna vez dejan de coincidir. */
const COLS_BBVA_EXTRA = [
  /* 1 · Actividad: de qué se compone cada intento */
  "Intentos","Reuniones_Virtuales","WhatsApp","Correos","Suma_por_Medio","Cuadra",
  /* 2 · Comunicación: en cuántos respondió el cliente */
  "Estado_Contacto","Respuestas_del_Cliente","Sin_Respuesta","Tasa_Respuesta",
  "Medio_con_Respuesta","Ultimo_Resultado",
  /* 3 · Visita: lo que BBVA mide como cumplimiento */
  "Visitas_Validas","Medio_Cumple_Visita",
  /* 4 · Cierre y contexto */
  "Resultado_Gestion","Calificacion","Comentario_Ejecutivo",
  "Ejecutivo_Stratis","Distrito","Estado_Cliente","Rubro","Fecha_Alta"];

const ES_PRESENCIAL = id => id === "visita_presencial" || id === "reunion_presencial";
const ES_VIRTUAL    = id => id === "reunion_virtual"   || id === "videollamada";

/* Contactado (Si/No) es la columna del banco y solo tiene dos valores, así que
   mete en la misma bolsa dos cosas distintas: el comercio que se intentó y no
   respondió, y el que nadie tocó todavía. Uno mide resistencia del cliente; el
   otro mide trabajo pendiente del ejecutivo. Esta columna los separa. */
const estadoContacto = (intentos, respuestas) =>
  respuestas > 0 ? "Respondió"
  : intentos > 0 ? "Intentado sin respuesta"
  : "Sin intentar";

function filasBBVA(extra){
  return cartera().filter(c => !esClienteNuevo(c)).map(c => {
    const regs = DB.delCliente(c.customer_id);              // del más reciente al más antiguo
    const efectivos = regs.filter(r => esEfectivo(r.Resultado));
    const cumplidas = regs.filter(r => r.Cumple_Visita === "SI");
    // El comentario más reciente que exista, aunque venga de una gestión anterior
    const ultimo = campo => (regs.find(r => String(r[campo] || "").trim()) || {})[campo] || "";
    const nPresencial = regs.filter(r => ES_PRESENCIAL(r.Tipo_Contacto)).length;
    const nLlamada    = regs.filter(r => r.Tipo_Contacto === "llamada").length;
    const nVirtual    = regs.filter(r => ES_VIRTUAL(r.Tipo_Contacto)).length;
    const nWhatsapp   = regs.filter(r => r.Tipo_Contacto === "whatsapp").length;
    const nCorreo     = regs.filter(r => r.Tipo_Contacto === "correo").length;
    const base = [
      c.customer_id,
      gestionCumplida(c) ? "SI" : "NO",                     // ¿se cumplió el objetivo?
      ultimo("Comentario_Cliente"),
      nPresencial,
      nLlamada,
      regs[0] ? fmtFecha(regs[0].Fecha_Contacto) : "",
      c.direccion || "",
      efectivos.length ? "SI" : "NO",
      regs.some(r => ES_PRESENCIAL(r.Tipo_Contacto)) ? "SI" : "NO",
      regs.some(r => ES_VIRTUAL(r.Tipo_Contacto))    ? "SI" : "NO",
      cumplidas.length ? "SI" : "NO",
      cumplidas.length ? fmtFecha(cumplidas[0].Fecha_Contacto) : ""
    ];
    if (!extra) return base;
    const g = RESULTADOS_GESTION.find(x => x.id === (c.resultado_gestion || "PENDIENTE"));
    const suma = nPresencial + nLlamada + nVirtual + nWhatsapp + nCorreo;
    return base.concat([
      /* 1 · Actividad */
      regs.length,
      nVirtual,
      nWhatsapp,
      nCorreo,
      suma,
      suma === regs.length ? "SI" : "REVISAR",
      /* 2 · Comunicación */
      estadoContacto(regs.length, efectivos.length),
      efectivos.length,
      regs.length - efectivos.length,
      regs.length ? Math.round(efectivos.length / regs.length * 10000) / 10000 : "",
      efectivos.length ? nomTipo(efectivos[0].Tipo_Contacto) : "Sin respuesta",
      regs[0] ? nomResultado(regs[0].Resultado) : "Sin gestiones",
      /* 3 · Visita */
      cumplidas.length,
      cumplidas.length ? nomTipo(cumplidas[0].Tipo_Contacto) : "Sin visita válida",
      /* 4 · Cierre y contexto */
      g ? g.label : "",
      ultimo("Calificacion"),
      ultimo("Comentario_Ejecutivo"),
      c.asignado || "",
      titulo(c.distrito || ""),
      c.estado || "",
      rubroLabel(c),
      String(c.creado_en || "").slice(0,10)
    ]);
  });
}

const COLS_NUEVOS = ["RUC","Razón social","Rubro","Gestión","Fecha de la venta","Medio del cierre",
  "Visitas","Llamadas","Contactado (Si/No)","Cumple_Visita",
  "Comentario de Cliente","Comentario del Ejecutivo","Ejecutivo_Stratis"];

/* Los clientes nuevos no tienen Customer ID, así que no se pueden pegar en el
   archivo de la cartera: BBVA primero tiene que afiliarlos. Van en su propia
   hoja, con lo que el banco necesita para darlos de alta. */
function filasNuevos(){
  return cartera().filter(esClienteNuevo).map(c => {
    const regs = DB.delCliente(c.customer_id);
    const efectivos = regs.filter(r => esEfectivo(r.Resultado));
    const cumplidas = regs.filter(r => r.Cumple_Visita === "SI");
    const ultimo = campo => (regs.find(r => String(r[campo] || "").trim()) || {})[campo] || "";
    // Los comentarios salen de la gestión que cerró la venta.
    const comCliente = ultimo("Comentario_Cliente");
    const comEjec    = ultimo("Comentario_Ejecutivo");
    return [
      c.ruc || "", c.razon_social || "", rubroLabel(c),
      "SI",                                     // la derivación ya cuenta como venta
      cumplidas.length ? fmtFecha(cumplidas[0].Fecha_Contacto)
        : (regs[0] ? fmtFecha(regs[0].Fecha_Contacto)
                   : fmtFecha(String(c.creado_en || "").slice(0,10))),
      // Con qué se cerró: explica por qué una venta puede tener 0 visitas
      // presenciales y aun así cumplir — fue por reunión virtual.
      cumplidas.length ? nomTipo(cumplidas[0].Tipo_Contacto)
                       : (regs[0] ? nomTipo(regs[0].Tipo_Contacto) : ""),
      regs.filter(r => ES_PRESENCIAL(r.Tipo_Contacto)).length,
      regs.filter(r => r.Tipo_Contacto === "llamada").length,
      efectivos.length ? "SI" : "NO",
      cumplidas.length ? "SI" : "NO",
      comCliente, comEjec,
      c.asignado || ""
    ];
  });
}

function hojaNuevos(){
  const ws = hoja(COLS_NUEVOS, filasNuevos());
  ws["!cols"] = COLS_NUEVOS.map(c => ({ wch: /Comentario|Razón/.test(c) ? 40 : Math.min(26, Math.max(12, c.length + 3)) }));
  return ws;
}

/* Aplica formato de porcentaje a las columnas que lo son, buscándolas por
   nombre. Antes iban por letra fija y bastaba agregar una columna al medio
   para que el formato terminara en la de al lado. */
function formatoPorcentaje(ws, cols, filas, nombres){
  nombres.forEach(n => {
    const i = cols.indexOf(n);
    if (i < 0) return;
    const letra = XLSX.utils.encode_col(i);
    filas.forEach((_, f) => {
      const celda = ws[letra + (f + 2)];
      if (celda && typeof celda.v === "number") celda.z = "0.0%";
    });
  });
}

function hojaBBVA(){
  const cols  = COLS_BBVA.concat(COLS_BBVA_EXTRA);
  const filas = filasBBVA(true);
  const ws = hoja(cols, filas);
  ws["!cols"] = cols.map(c => ({ wch: /Comentario/.test(c) ? 46 : Math.min(30, Math.max(11, c.length + 3)) }));
  /* Las doce del banco quedan fijas al desplazarse: el bloque de Stratis es
     largo y sin esto uno se pierde de qué comercio está mirando. */
  ws["!freeze"] = { xSplit: 1, ySplit: 1 };
  formatoPorcentaje(ws, cols, filas, ["Tasa_Respuesta"]);
  return ws;
}

function exportarCSV(que){
  const mapa = { base:[COLS_BASE, filasBase(), "Base"],
                 visitas:[COLS_VISITAS, filasVisitas(), "Visitas"],
                 bbva:[COLS_BBVA, filasBBVA(false), "Resumen_BBVA"],
                 nuevos:[COLS_NUEVOS, filasNuevos(), "Clientes_nuevos"] };
  const [cols, filas, nombre] = mapa[que];
  const q = v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = "\ufeff" + [cols.map(q).join(";")].concat(filas.map(f => f.map(q).join(";"))).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${nombre}_StratisCRM.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(`${nombre} exportado`);
}

/* =========================================================================
   Gestión del equipo — solo Analista y Manager
   Las altas y las contraseñas pasan por un servicio en Supabase que guarda
   la llave de administración; el navegador nunca la ve.
   ========================================================================= */
const ROLES = ["Ejecutivo", "Analista", "Manager"];

async function equipoAPI(cuerpo){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) throw new Error("Tu sesión venció. Vuelve a entrar.");
  const r = await fetch(`${SUPABASE_URL}/functions/v1/equipo`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + session.access_token },
    body: JSON.stringify(cuerpo)
  });
  let j = {};
  try { j = await r.json(); } catch { throw new Error("El servidor no respondió correctamente."); }
  if (!r.ok || j.error) throw new Error(j.error || ("Error " + r.status));
  return j;
}

      <select id="eqRol">

        <option value="Analista">Analista — ve todo y descarga el Excel</option>
        <option value="Manager">Manager — ve todo y descarga el Excel</option>
      </select></div>
    <div id="eqMsg"></div>

      <button class="btn" id="eqOk" style="flex:1">Crear cuenta</button>
      <button class="btn ghost" onclick="cerrarModal()" style="flex:1">Cancelar</button>
    </div>`);

  $("#eqNom").oninput = () => {
    const p = $("#eqNom").value.trim().split(/\s+/);
    if (!$("#eqCorto").dataset.tocado && p.length >= 3)
      $("#eqCorto").value = p[0] + " " + p[2];
  };
  $("#eqCorto").oninput = () => $("#eqCorto").dataset.tocado = "1";

  $("#eqOk").onclick = async () => {
    const nombre = $("#eqNom").value.trim();
    const corto  = $("#eqCorto").value.trim() || nombre;
    const correo = $("#eqMail").value.trim().toLowerCase();
    const rol    = $("#eqRol").value;
    const msg = $("#eqMsg");
    if (nombre.length < 3) return msg.innerHTML = `<div class="err">Escribe el nombre completo.</div>`;
    if (!correo.endsWith("@" + CONFIG.dominio))
      return msg.innerHTML = `<div class="err">El correo debe ser @${CONFIG.dominio}.</div>`;
    const b = $("#eqOk"); b.disabled = true; b.textContent = "Creando…";
    try {
      const r = await equipoAPI({ accion:"crear", correo, nombre, nombre_corto:corto, rol });
      await recargarEquipo();
      modalClaveLista(nombre, correo, r.clave, "Cuenta creada");
    } catch (e) {
      b.disabled = false; b.textContent = "Crear cuenta";
      msg.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  };
}

  modal(`

        ${ROLES.map(r => `<option ${u.rol===r?"selected":""}>${r}</option>`).join("")}
      </select>
      ${yo ? `<div style="font-size:11.5px;color:var(--muted);margin-top:3px">No puedes cambiar tu propio rol.</div>` : ""}
    </div>
    <div class="field"><label>Acceso</label>
      <div class="opts">

          <span><b>Activo</b><span>Puede entrar al CRM</span></span></div>
        <div class="opt ${u.activo === false ? "on" : ""}" data-act="0"><span class="rd"></span>
          <span><b>De baja</b><span>Pierde el acceso, su historial se conserva</span></span></div>
      </div>
    </div>
    <div id="eqMsg"></div>
    <div style="display:flex;gap:9px;margin-top:4px">
      <button class="btn" id="eqOk" style="flex:1">Guardar</button>
      <button class="btn ghost" onclick="cerrarModal()" style="flex:1">Cancelar</button>
    </div>`);

  let activo = u.activo !== false;
  document.querySelectorAll("[data-act]").forEach(el => el.onclick = () => {
    if (yo && el.dataset.act === "0") return;
    activo = el.dataset.act === "1";
    document.querySelectorAll("[data-act]").forEach(x =>
      x.classList.toggle("on", (x.dataset.act === "1") === activo));
  });

  $("#eqOk").onclick = async () => {
    const b = $("#eqOk"); b.disabled = true; b.textContent = "Guardando…";
    try {
      await equipoAPI({ accion:"guardar", correo,
        nombre: $("#eqNom").value.trim(),
        nombre_corto: $("#eqCorto").value.trim(),
        rol: $("#eqRol").value, activo });
      await recargarEquipo();
      cerrarModal(); toast("Equipo actualizado"); render();
    } catch (e) {
      b.disabled = false; b.textContent = "Guardar";
      $("#eqMsg").innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  };
}

function modalClaveLista(nombre, correo, clave, titulo2){
  modal(`

      el botón <b>Contraseña</b> de la lista.

    <button class="btn block" onclick="cerrarModal()">Listo</button>`);

async function recargarEquipo(){
  const { data, error } = await sb.from("usuarios").select("*").order("rol");
  if (error) return;
  USUARIOS = (data || []).map(u => ({ nombre: u.nombre_corto || u.nombre,
    nombreCompleto: u.nombre, correo: u.correo, rol: u.rol, activo: u.activo }));
  await cargarAuditoria();
}

            <span><b>Cumple visita</b> <span class="chip ${e.cumple==="SI"?"ok":"no"}">${esc(e.cumple)}</span></span>
            <span><b>Cierre</b> <span class="chip ${/Retenido|Venta/.test(e.cierre)?"ok":(e.cierre==="Perdido"?"crit":"no")}">${esc(e.cierre)}</span></span>
          </div>
          <div class="g-caso-n">${esc(e.nota)}</div>
        </div>`).join("")}
    </div>
  </div>

  <div class="grid2">
   <div>
    <div class="card">
      <h3>Lo que no se puede cambiar después</h3>
      <div class="note" style="margin-bottom:12px">
        Al editar una gestión solo se corrigen los comentarios, la calificación y los viáticos.
        Lo demás queda fijo porque alimenta los conteos.
      </div>
      <div class="g-fijos">
        ${["Fecha y hora","Medio de contacto","Resultado","Ubicación y su sello de GPS",
           "Evidencia","Comercio y ejecutivo"]
          .map(x => `<div class="g-fijo">🔒 ${esc(x)}</div>`).join("")}
      </div>
      <div class="note warn" style="margin-top:12px">
        Si te equivocaste en alguno, <b>elimina el registro y créalo de nuevo</b>. Editar nunca
        suma un intento, y cada eliminación queda en la bitácora.
      </div>
    </div>
   </div>

   <div>
    <div class="card">
      <h3>Si algo no te deja avanzar</h3>
      <div class="g-faq">
        ${ERRORES_GUIA.map(e => `
          <div class="g-faq-i">
            <div class="g-faq-q">${esc(e.q)}</div>
            <div class="g-faq-a">${esc(e.a)}</div>
          </div>`).join("")}
      </div>
    </div>
   </div>
  </div>

  <div class="card">
    <h3>Tus números, y qué mide cada uno</h3>
    <div class="note" style="margin-bottom:12px">
      Los tres suben por motivos distintos. Ninguno es «el bueno»: se leen juntos.
    </div>
    <div class="g-esc">
      <div class="g-caso">
        <div class="g-caso-t">Intentos</div>
        <div class="g-caso-n" style="border:0;padding:0;margin:0">Cuántas gestiones registraste, contestaran o no.
        Mide cuánto saliste a buscar. Un día de cinco locales cerrados sube este número, y está bien.</div>
      </div>
      <div class="g-caso">
        <div class="g-caso-t">Tasa de respuesta</div>
        <div class="g-caso-n" style="border:0;padding:0;margin:0">De esos intentos, en cuántos el cliente respondió.
        <b>Respondió no es retenido:</b> puedes tener 100% de respuesta y ningún comercio cerrado todavía.
        Y mandar un correo no cuenta hasta que conteste.</div>
      </div>
      <div class="g-caso">
        <div class="g-caso-t">Visitas válidas</div>
        <div class="g-caso-n" style="border:0;padding:0;margin:0">Comercios donde hubo visita o reunión <b>y</b> se
        habló con el titular. Es el cumplimiento que mide BBVA.</div>
      </div>
      <div class="g-caso">
        <div class="g-caso-t">Objetivo cumplido</div>
        <div class="g-caso-n" style="border:0;padding:0;margin:0">Comercios que cerraste como retención o venta.
        Este sí es el resultado final: es lo que el banco lee como <b>Gestión = SI</b>.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="note">
      <b>Una regla que resume todas.</b> Registra lo que pasó, no lo que te gustaría que hubiera
      pasado. El CRM está hecho para que un día malo —cinco locales cerrados— se vea como lo que
      es: trabajo hecho. Inflar el cumplimiento no ayuda a nadie y la base lo rechaza sola.
    </div>
  </div>`;
}

/* =========================================================================
   Enlaces de interfaz y arranque
   ========================================================================= */
let qTimer = null;

function bindExtras(){
  const q = $("#q");
  if (q){
    q.oninput = e => {
      S.q = e.target.value; S.limite = 40;
      clearTimeout(qTimer);
      qTimer = setTimeout(() => {
        render();
        const n = $("#q");
        if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      }, 210);
    };
  }
  const MAPA_F = { contacto:"fContacto", estadocli:"fEstadoCli", rubro:"fRubro",
                   ejecutivo:"fEjecutivo", distrito:"fDistrito" };
  document.querySelectorAll(".seg button[data-f], .pill[data-f]").forEach(b => b.onclick = () => {
    S[MAPA_F[b.dataset.f]] = b.dataset.v; S.limite = 40; render();
  });
  document.querySelectorAll("select[data-f]").forEach(el => el.onchange = () => {
    S[MAPA_F[el.dataset.f]] = el.value; S.limite = 40; render();
  });
  const limpiar = () => { S.q = ""; S.fContacto = S.fEstadoCli = S.fRubro = S.fEjecutivo = S.fDistrito = "todos";
    S.limite = 40; render(); };
  ["limpiarFiltros","limpiarFiltros2"].forEach(id => { if ($("#"+id)) $("#"+id).onclick = limpiar; });
  if ($("#mas")) $("#mas").onclick = () => { S.limite += 40; render(); };
  if ($("#masReg")) $("#masReg").onclick = () => { S.limiteReg += 40; render(); };

  /* Bitácora: buscador, filtros y por tandas dentro de su propio recuadro.
     Se guarda todo, pero no se pinta todo: con la campaña corriendo son miles
     de líneas, y la página no puede crecer sin fin. */
  if ($("#masBit")) $("#masBit").onclick = () => {
    const y = $("#cajaBit") ? $("#cajaBit").scrollTop : 0;   // no devolver al usuario al inicio
    S.limiteBit += 25; render();
    const c = $("#cajaBit"); if (c) c.scrollTop = y;
  };
  if ($("#limpiarBit")) $("#limpiarBit").onclick = () => {
    S.qBit = ""; S.fBitAccion = S.fBitQuien = "todos"; S.limiteBit = LOTE_BIT; render(); };
  if ($("#qBit")){
    const cajaBit = $("#qBit");
    cajaBit.oninput = e => {
      S.qBit = e.target.value; S.limiteBit = LOTE_BIT;
      clearTimeout(cajaBit._t);
      cajaBit._t = setTimeout(() => { render(); const n = $("#qBit"); if (n){ n.focus();
        n.setSelectionRange(n.value.length, n.value.length); } }, 260);
    };
  }
  document.querySelectorAll("[data-fbit]").forEach(sel => sel.onchange = e => {
    if (sel.dataset.fbit === "accion") S.fBitAccion = e.target.value;
    else S.fBitQuien = e.target.value;
    S.limiteBit = LOTE_BIT; render();
  });

  const qr = $("#qReg");
  if (qr){
    qr.oninput = e => {
      S.qReg = e.target.value; S.limiteReg = 40;
      clearTimeout(qTimer);
      qTimer = setTimeout(() => {
        render();
        const n = $("#qReg");
        if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      }, 210);
    };
  }
  document.querySelectorAll("[data-fr]").forEach(b => b.onclick = () => { S.fResultado = b.dataset.fr; S.limiteReg = 40; render(); });
  if ($("[data-fr-sel]")) $("[data-fr-sel]").onchange = e => { S.fResultado = e.target.value; S.limiteReg = 40; render(); };
  if ($("[data-fm-sel]")) $("[data-fm-sel]").onchange = e => { S.fMedio = e.target.value; S.limiteReg = 40; render(); };
  if ($("[data-fe-sel]")) $("[data-fe-sel]").onchange = e => { S.fEjecReg = e.target.value; S.limiteReg = 40; render(); };
  if ($("#limpiarReg")) $("#limpiarReg").onclick = () => {
    S.qReg = ""; S.fResultado = S.fMedio = S.fEjecReg = "todos"; S.limiteReg = 40; render(); };

  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => exportarCSV(b.dataset.exp));
  if ($("#expXlsx"))  $("#expXlsx").onclick  = e => exportarExcel(e.currentTarget);
  if ($("#expXlsx2")) $("#expXlsx2").onclick = e => exportarExcel(e.currentTarget);
  if ($("#expBBVA"))  $("#expBBVA").onclick  = e => exportarBBVA(e.currentTarget);

  if (typeof bindEquipo === "function") bindEquipo();
  if ($("#salir")) $("#salir").onclick = salir;
  if ($("#guardarNuevaClave")) $("#guardarNuevaClave").onclick = async () => {
    const a = ($("#nc1").value || ""), b = ($("#nc2").value || "");
    if (a.length < 8) return toast("La contraseña debe tener al menos 8 caracteres");
    if (a !== b)      return toast("Las dos contraseñas no coinciden");
    const btn = $("#guardarNuevaClave"); btn.disabled = true; btn.textContent = "Guardando…";
    const { error } = await sb.auth.updateUser({ password:a, data:{ debe_cambiar:false } });
    btn.disabled = false; btn.textContent = "Guardar contraseña";
    if (error) return toast("No se pudo cambiar: " + error.message);
    $("#nc1").value = ""; $("#nc2").value = "";
    toast("Contraseña actualizada");
  };
  if ($("#recargar")) $("#recargar").onclick = async () => {
    if (S.demo) return toast("En modo demostración no hay nada que recargar");
    const b = $("#recargar"); b.disabled = true; b.textContent = "Actualizando…";
    try { await refrescar(); toast("Datos actualizados"); }
    catch (e) { toast("No se pudo actualizar: " + e.message); }
    render();
  };
}

/* ---- Cabecera ---------------------------------------------------------- */
document.getElementById("btnTheme").onclick = () => {
  const d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
};
document.getElementById("btnUser").onclick = () => {
  if (!S.user) return;
  modal(`
    <h3>${esc(S.user.nombreCompleto || S.user.nombre)}</h3>
    <p>${esc(S.user.correo)} · ${esc(S.user.rol)}<br>
    Cartera visible: <b>${cartera().length}</b> clientes · Registros propios:
    <b>${DB.todos().filter(r => r.Correo_Stratis === S.user.correo).length}</b></p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ghost" style="flex:1" id="mAjustes">Ajustes</button>
      <button class="btn ghost" style="flex:1" id="mSalir">Cerrar sesión</button>
    </div>`);
  $("#mAjustes").onclick = () => { cerrarModal(); go("ayuda"); };
  $("#mSalir").onclick   = () => { cerrarModal(); salir(); };
};

/* ---- Arranque ---------------------------------------------------------- */
(async () => {
  try {
    if (!window.supabase && configurado())
      throw new Error("No se pudo cargar la librería de Supabase desde internet. Revisa la conexión o si la red de la empresa bloquea jsdelivr.net.");
    const listo = await iniciarSupabase();
    if (!listo) return renderLogin();
    sb.auth.onAuthStateChange((evento, session) => {
      if (evento === "SIGNED_IN" && !S.user && session) entrar(session).catch(mostrarFallo);
      if (evento === "SIGNED_OUT" && S.user) salir();
    });
    await comprobarSesion();
  } catch (e) { mostrarFallo(e); }
})();

function mostrarFallo(e){
  // Una sesión caducada no es una caída: se vuelve a la pantalla de ingreso.
  if (/sesión caducó/i.test(String(e && e.message || e))){
    S.user = null;
    $("#app").classList.add("hidden");
    return renderLogin({ error: String(e.message || e) });
  }
  $("#login").classList.remove("hidden");
  $("#app").classList.add("hidden");
  $("#login").innerHTML = `<div class="lg-card">
    <div class="lg-logo"><div class="lg-mark">S</div>
      <div><h1>Stratis CRM</h1><p>Campaña BBVA Adquirencia</p></div></div>
    <div class="err"><b>No se pudo conectar con la base de datos.</b><br>${esc(e.message || e)}</div>
    <div class="note">Revisa que la URL y la llave <code>anon</code> del proyecto sean correctas y que hayas ejecutado
    <b>01_esquema.sql</b> y <b>02_datos.sql</b> en el SQL Editor de Supabase.</div>
    <button class="btn block" style="margin-top:12px" onclick="location.reload()">Reintentar</button>
  </div>`;
}
