<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1137"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratis Campo">
<title>Stratis · CRM de campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{ color-scheme:light;
  --navy:#0C1137; --navy-2:#232C86; --azul:#3B43FB; --naranja:#F86F35; --verde:#0BBC96;
  --ink:#1b2340; --texto:#3F5073; --muted:#7d89a3; --linea:#D3DBEB; --suelo:#EEF1F8; --tarjeta:#FFFFFF;
  --azul-t:#DDE4F4; --naranja-t:#FDE6DA; --verde-t:#DDF5EE; --rojo:#D6455D; --rojo-t:#FADDE2; --ambar:#B7791F; --ambar-t:#FBEFD5;
  --cabecera:#0C1137; --cabecera-txt:#FFFFFF; --cabecera-sub:#AEB6E8; --sombra:0 6px 18px rgba(12,17,55,.08);
  --marco:#dfe4ef;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--marco);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--texto);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.tel{position:relative;max-width:420px;margin:0 auto;height:100%;background:var(--suelo);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){ body{padding-block:18px} .tel{height:calc(100% - 36px);border-radius:28px;box-shadow:0 20px 60px rgba(12,17,55,.25)} }
.vista{flex:1;overflow-y:auto;padding-bottom:96px}
.aviso-proto{font-size:11px;letter-spacing:.04em;text-align:center;background:var(--naranja);color:#fff;padding:4px 16px;font-weight:600}

/* Cabecera */
.cab{background:var(--cabecera);color:var(--cabecera-txt);padding:18px 18px 64px;border-radius:0 0 26px 26px}
.cab .fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cab h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.cab .sub{color:var(--cabecera-sub);font-size:13px;margin-top:2px}
.cab .marca{font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--naranja)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
.kpi{padding-inline:4px;border-left:1px solid rgba(255,255,255,.14)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.kpi b small{font-size:13px;font-weight:600;color:var(--cabecera-sub)}
.kpi span{display:block;font-size:12px;margin-top:6px;color:var(--cabecera-sub);line-height:1.3}
.kpi.naranja b{color:var(--naranja)} .kpi.verde b{color:#34d6b1}

.cuerpo{padding-inline:16px;margin-top:-44px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--tarjeta);border-radius:18px;box-shadow:var(--sombra);padding:16px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--ink)}
.card .nota{font-size:12.5px;color:var(--muted)}
.fila-ent{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tt{font-weight:800;color:var(--ink)}

.accesos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acceso{background:var(--tarjeta);border:0;border-radius:18px;box-shadow:var(--sombra);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.acceso .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.acceso b{color:var(--ink);font-size:14.5px}
.acceso small{color:var(--muted);font-size:12px;line-height:1.3}

.ruta-hoy .paradas{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.parada{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linea);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.parada .n{width:24px;height:24px;border-radius:50%;background:var(--azul-t);color:var(--azul);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.parada .t{flex:1;min-width:0}
.parada .t b{display:block;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parada .t small{color:var(--muted);font-size:12px}

/* Etiquetas de estado */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.e-por{background:var(--azul-t);color:var(--azul)}
.e-esp{background:var(--naranja-t);color:#c4531f}
.e-uno{background:var(--ambar-t);color:var(--ambar)}
.e-rea{background:var(--verde-t);color:#079477}
.e-can{background:var(--rojo-t);color:var(--rojo)}
.e-seg{background:var(--suelo);color:var(--texto);border:1px solid var(--linea)}

/* Mi base */
.barra{position:sticky;top:0;z-index:5;background:var(--cabecera);padding:16px 16px 14px;color:#fff}
.barra h1{margin:0 0 10px;font-size:19px;font-weight:800}
.buscar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:0 12px}
.buscar input{flex:1;background:none;border:0;padding:11px 0;color:#fff;outline:none}
.buscar input::placeholder{color:var(--cabecera-sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filtros{display:flex;gap:8px;padding:8px 16px 0}
.filtros select{flex:1;min-width:0;border:1px solid var(--linea);background:var(--tarjeta);border-radius:10px;padding:9px 10px;font-size:13px}
.lista{display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.conteo{padding:6px 16px 0;font-size:12.5px;color:var(--muted)}
.com{background:var(--tarjeta);border-radius:16px;box-shadow:var(--sombra);padding:13px 14px;border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.com .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.com b{color:var(--ink);font-size:14.5px;line-height:1.3}
.com .l3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.com .l3 span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacio{text-align:center;padding:30px 16px;color:var(--muted)}

/* Ficha */
.volver{background:none;border:0;color:#fff;padding:0;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-bottom:10px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13.5px;margin-top:10px}
.datos dt{color:var(--muted)} .datos dd{margin:0;color:var(--ink);font-weight:600;text-align:right}
.tasas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tasa{background:var(--suelo);border-radius:12px;padding:10px;text-align:center}
.tasa b{display:block;color:var(--ink);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tasa small{font-size:11px;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-pri{background:var(--naranja);color:#fff}
.btn-sec{background:var(--azul-t);color:var(--azul)}
.btn-lin{background:none;border:1px solid var(--linea);color:var(--texto)}
.btn-full{width:100%}
.hist{display:flex;flex-direction:column;gap:0;margin-top:6px}
.hist div{border-top:1px solid var(--linea);padding:10px 0;font-size:13px}
.hist div b{color:var(--ink)}

/* Avance */
.ind{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--linea)}
.ind:first-of-type{border-top:0}
.ind .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ind .top b{color:var(--ink);font-size:14.5px}
.ind .top span{font-size:12px;color:var(--muted)}
.ind .num{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.pista{height:8px;border-radius:99px;background:var(--suelo);overflow:hidden}
.pista i{display:block;height:100%;border-radius:99px}
.bono{display:flex;align-items:center;gap:16px}
.anillo{width:92px;height:92px;flex:none}
.escala{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.escala div{border-radius:10px;padding:8px 6px;text-align:center;font-size:11px;background:var(--suelo);color:var(--muted)}
.escala div b{display:block;font-size:14px;color:var(--ink)}
.escala div.on{background:var(--navy);color:#cfd4f5} .escala div.on b{color:#fff}

/* Barra inferior */
nav.abajo{position:absolute;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--linea);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
nav.abajo button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav.abajo button.on{color:var(--azul)}
nav.abajo .fab{width:60px;height:60px;border-radius:50%;background:var(--naranja);color:#fff;margin:-30px auto 0;box-shadow:0 8px 20px rgba(248,111,53,.4);justify-content:center;font-size:10px;gap:0}
nav.abajo .fab svg{width:26px;height:26px}

/* Hoja de registro */
.velo{position:absolute;inset:0;background:rgba(7,11,36,.55);z-index:30;display:flex;align-items:flex-end}
.hoja{background:var(--tarjeta);width:100%;max-height:94%;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.hoja header{padding:14px 18px 10px;border-bottom:1px solid var(--linea)}
.hoja header .asa{width:40px;height:4px;border-radius:9px;background:var(--linea);margin:0 auto 10px}
.hoja header h2{margin:0;font-size:17px;color:var(--ink);font-weight:800}
.hoja .scroll{overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:18px}
.hoja footer{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linea)}
.paso > .eyebrow{margin-bottom:8px;display:block}
.sello{display:flex;gap:8px;flex-wrap:wrap}
.sello span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--verde-t);color:#079477}
.sello span.esperando{background:var(--ambar-t);color:var(--ambar)}
.opciones{display:grid;gap:8px}
.opciones.c3{grid-template-columns:repeat(3,1fr)}
.opciones.c2{grid-template-columns:1fr 1fr}
.op{border:1.5px solid var(--linea);background:var(--tarjeta);border-radius:14px;padding:13px 8px;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:56px;justify-content:center}
.op small{font-weight:500;font-size:11.5px;color:var(--muted)}
.op.on{border-color:var(--azul);background:var(--azul-t);color:var(--azul)}
.op.on small{color:var(--azul)}
.op.on.naranja{border-color:var(--naranja);background:var(--naranja-t);color:#c4531f}
.op.on.verde{border-color:var(--verde);background:var(--verde-t);color:#079477}
.op.on.rojo{border-color:var(--rojo);background:var(--rojo-t);color:var(--rojo)}
.elegido{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--linea);border-radius:14px;padding:11px 12px}
.elegido b{color:var(--ink);display:block;font-size:14px}
.elegido small{color:var(--muted);font-size:12px}
.elegido button{background:none;border:0;color:var(--azul);font-weight:700;font-size:13px}
.campo{width:100%;border:1.5px solid var(--linea);background:var(--tarjeta);border-radius:12px;padding:11px 12px;font-size:14px}
textarea.campo{min-height:78px;resize:vertical}
.resultados{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:220px;overflow-y:auto}
.resultados button{border:1px solid var(--linea);background:var(--tarjeta);border-radius:12px;padding:10px 12px;text-align:left}
.resultados button b{display:block;color:var(--ink);font-size:13.5px}
.resultados button small{color:var(--muted);font-size:12px}
.explica{font-size:12.5px;color:var(--muted);line-height:1.45;background:var(--suelo);border-radius:12px;padding:10px 12px}
.falta{font-size:12.5px;color:var(--rojo);font-weight:600}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--navy);color:#fff;border-radius:14px;padding:13px 14px;font-size:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.toast b{color:var(--naranja)}

/* Ingreso */
.ingreso{flex:1;background:var(--cabecera);color:#fff;display:flex;flex-direction:column;justify-content:center;padding-inline:24px;padding-block:32px;gap:22px}
.ingreso h1{margin:0;font-size:26px;font-weight:800;line-height:1.2;text-wrap:balance}
.ingreso p{margin:0;color:var(--cabecera-sub);font-size:14px;line-height:1.5}
.ingreso .quien{display:grid;gap:10px}
.ingreso .quien button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:14px 16px;text-align:left;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.ingreso .quien button small{color:var(--cabecera-sub);font-weight:500}
.recordar{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--cabecera-sub)}
@media (prefers-reduced-motion:no-preference){ .hoja{animation:sube .22s ease-out} @keyframes sube{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}} }
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-waze{background:#33CCFF;color:#0C1137}
.aprox{font-size:11.5px;color:var(--ambar);font-weight:600}
</style>

<script>
/* =========================================================================
   Stratis · CRM de campo v2 — Campaña BBVA Adquirencia (reactivación de POS)
   Una sola página para el celular. Las reglas viven en la base (v2_*):
   el CRM solo lee v2_mi_base() y escribe con v2_registrar_visita().
   ========================================================================= */
"use strict";
const SUPABASE_URL = "https://xwvpnagvdrjffayzsnke.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-WtGPS_yJYllxVMR0RCDQg_kQHLHSPq";   // publicable por diseño
const BUILD = "66df3b";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"stratis-v2-sesion" } });

const ESTADOS = {
  por:{ t:"Por visitar", c:"e-por" },
  vis:{ t:"Visitado", c:"e-seg" },
  esp:{ t:"Esperando 2 días", c:"e-esp", ayuda:"Dijo que volverá a usar el POS. Falta que la data de BBVA muestre dos días distintos con transacciones después de tu visita." },
  uno:{ t:"1 día · volver", c:"e-uno", ayuda:"BBVA registró un día con transacciones después de tu visita. Falta un segundo día distinto antes del cierre: vale la pena volver." },
  rea:{ t:"Reactivado", c:"e-rea", ayuda:"Dos días distintos con transacciones después de tu visita, según la data de BBVA." },
  seg:{ t:"Aún no decide", c:"e-seg", ayuda:"Hubo reunión pero el comercio no decidió. Queda en seguimiento." },
  des:{ t:"Desistió", c:"e-can", ayuda:"El comercio desistió del producto en la visita." },
  can:{ t:"Cancelado", c:"e-can", ayuda:"El producto figura cancelado. No cuenta como reactivado." },
  rag:{ t:"Reagendado", c:"e-seg" },
  sin:{ t:"Visitado · sin éxito", c:"e-seg" }
};
const S = { sesion:null, yo:null, admin:false, periodo:null, base:[], cargando:true, error:"", vista:"inicio", ficha:null,
  filtroEstado:"todos", filtroDistrito:"", filtroRuta:"", filtroEjecutivo:"", filtroDueno:"todos", q:"", reg:null, toast:null, editando:null, hist:{}, cola:leerCola() };

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pct = v => (Math.round(v*10)/10).toFixed(1).replace(".", ",") + "%";
const lima = d => new Date(new Date(d).toLocaleString("en-US",{ timeZone:"America/Lima" }));
const fechaCorta = d => lima(d).toLocaleDateString("es-PE",{ day:"2-digit", month:"2-digit" });
const horaCorta = d => lima(d).toLocaleTimeString("es-PE",{ hour:"2-digit", minute:"2-digit" });
const diaLargo = d => lima(d).toLocaleDateString("es-PE",{ weekday:"long", day:"numeric", month:"long" });
const fISO = s => { const [a,m,d] = String(s).split("-"); return `${d}/${m}`; };
const tasa = v => v == null ? "—" : Number(v).toFixed(2).replace(".", ",") + "%";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
function leerCola(){ try { return JSON.parse(localStorage.getItem("stratis-v2-cola") || "[]"); } catch(e){ return []; } }
function guardarCola(){ try { localStorage.setItem("stratis-v2-cola", JSON.stringify(S.cola)); } catch(e){} }
const nombreDe = c => c.nombre_comercial || c.razon_social;
const dirDe = c => c.direccion_corregida || c.direccion || "";
const refDe = c => c.referencia || c.referencia_base || "";
const tieneGeo = c => c.geo_lat != null && c.geo_lng != null && c.geo_calidad !== "distrito";
const destinoTxt = c => [dirDe(c), c.distrito, "Lima"].filter(Boolean).join(", ");
const urlGoogle = c => "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(tieneGeo(c) ? c.geo_lat + "," + c.geo_lng : destinoTxt(c));
const urlWaze = c => tieneGeo(c) ? `https://waze.com/ul?ll=${c.geo_lat},${c.geo_lng}&navigate=yes` : "https://waze.com/ul?navigate=yes&q=" + encodeURIComponent(destinoTxt(c));
function urlRuta(cs){
  const ps = cs.filter(c => c.estado === "por" || c.estado === "uno" || c.estado === "rag").slice(0, 10);
  const lista = (ps.length ? ps : cs.slice(0, 10)).map(c => tieneGeo(c) ? c.geo_lat + "," + c.geo_lng : destinoTxt(c));
  if (!lista.length) return "#";
  const dest = lista[lista.length-1], way = lista.slice(0, -1);
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(dest) + (way.length ? "&waypoints=" + encodeURIComponent(way.join("|")) : "");
}
const CALIDAD = { comercio:"ubicado por el nombre del comercio", numero:"ubicado por calle y número", calle:"ubicación aproximada: la calle", lugar:"ubicación aproximada: la zona", distrito:"solo el distrito: confirma la dirección en campo" };
function avisar(msg, ms){ S.toast = msg; pintar(); clearTimeout(avisar._t); avisar._t = setTimeout(() => { S.toast = null; pintar(); }, ms || 3600); }

const ICON = {
  casa:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',

/* ---------------- datos ---------------- */
async function cargar(){
  S.cargando = true; S.error = ""; pintar();
  try {
    const hoy = new Date().toLocaleDateString("en-CA",{ timeZone:"America/Lima" });
    const [u, p, b] = await Promise.all([
      sb.from("usuarios").select("correo,nombre,nombre_corto,rol,activo").eq("correo", S.sesion.user.email.toLowerCase()).maybeSingle(),
      sb.from("v2_periodos").select("*").lte("ini", hoy).gte("fin", hoy).maybeSingle(),
      sb.rpc("v2_mi_base")
    ]);
    if (u.error) throw u.error; if (b.error) throw b.error;
    if (!u.data || !u.data.activo) throw new Error("Tu usuario no está activo en el CRM. Escríbele a Jose.");
    S.yo = u.data; S.admin = ["Analista","Manager"].includes(u.data.rol);
    S.periodo = p.data || null; S.base = b.data || [];
  } catch(e){ S.error = e.message || String(e); }
  S.cargando = false; pintar(); vaciarCola();
}
async function historial(cid){
  const { data } = await sb.from("v2_visitas").select("visitado_en,con,motivo,que,decision,equipo,fecha_reagenda,comentario,lat").eq("customer_id", cid).is("anulada_en", null).order("visitado_en", { ascending:false });
  S.hist[cid] = data || []; S._mantenerScroll = true; pintar();
}
async function enviar(v){
  const { error } = await sb.rpc("v2_registrar_visita", v);
  if (error) throw error;
}
async function vaciarCola(){
  if (!S.cola.length || !navigator.onLine) return;
  const pend = [...S.cola]; let ok = 0;
  for (const v of pend){
    try { await enviar(v); S.cola = S.cola.filter(x => x.p_cliente_uid !== v.p_cliente_uid); ok++; }
    catch(e){ if (!/fetch|network|Failed/i.test(e.message || "")){ S.cola = S.cola.filter(x => x.p_cliente_uid !== v.p_cliente_uid); avisar("Una visita guardada sin señal no se pudo registrar: " + e.message, 7000); } }
  }
  guardarCola();
  if (ok){ avisar(`Se enviaron ${ok} visita(s) que estaban guardadas en el celular.`); recargarBase(); }
}
async function recargarBase(){ const b = await sb.rpc("v2_mi_base"); if (!b.error){ S.base = b.data || []; S._mantenerScroll = true; pintar(); } }

const miCorreo = () => (S.yo && S.yo.correo || "").toLowerCase();
const esMio = c => S.admin ? !!c.correo : c.correo === miCorreo();
function metricas(){
  const mios = S.base.filter(esMio);
  const visitados = mios.filter(c => c.visitas_validas > 0).length;
  const reactivados = mios.filter(c => c.estado === "rea").length;
  const conv = visitados ? reactivados / visitados * 100 : 0;
  return { visitados, reactivados, conv, total: mios.length, libres: S.base.filter(c => !c.correo).length };
}
function rutas(){
  const m = new Map();
  S.base.forEach(c => { const k = c.ruta || ("Distrito · " + (c.distrito || "sin distrito")); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  return [...m.entries()].map(([nombre, cs]) => ({ nombre, cs: cs.sort((a,b) => (a.orden||999) - (b.orden||999)) }))
    .sort((a,b) => a.nombre.localeCompare(b.nombre, "es", { numeric:true }));
}
const diasQuedan = () => S.periodo ? Math.max(0, Math.ceil((new Date(S.periodo.fin + "T23:59:59-05:00") - new Date())/86400000)) : 0;

/* ---------------- vistas ---------------- */
function pintar(){
  const p = $("#pantalla");
  if (!S.sesion){ p.innerHTML = vistaIngreso(); return enlazar(); }
  if (S.cargando && !S.yo){ p.innerHTML = `<div class="ingreso"><h1>Cargando tu base…</h1></div>`; return; }
  if (S.error && !S.yo){ p.innerHTML = `<div class="ingreso"><h1>No se pudo cargar</h1><p>${esc(S.error)}</p><button class="btn btn-pri" data-reintentar>Reintentar</button><button class="btn btn-lin" style="color:#fff" data-salir>Cerrar sesión</button></div>`; return enlazar(); }
  let h = "";
  if (S.ficha) h = vistaFicha(S.base.find(c => c.customer_id === S.ficha));
  else if (S.vista === "inicio") h = vistaInicio();
  else if (S.vista === "base") h = vistaBase();
  else if (S.vista === "rutas") h = vistaRutas();
  else if (S.vista === "avance") h = vistaAvance();
  h += nav();
  if (S.reg) h += hojaRegistro();
  if (S.toast) h += `<div class="toast" role="status"><div>${S.toast}</div></div>`;
  const vs = p.querySelector(".vista"), hs = p.querySelector(".hoja .scroll");
  const s1 = vs ? vs.scrollTop : 0, s2 = hs ? hs.scrollTop : 0;
  p.innerHTML = h;
  if (S._mantenerScroll){ const a = p.querySelector(".vista"), b = p.querySelector(".hoja .scroll"); if (a) a.scrollTop = s1; if (b) b.scrollTop = s2; }
  S._mantenerScroll = false;
  enlazar();
}
function vistaIngreso(){
  return `<form class="ingreso" id="fIngreso">
    <div class="eyebrow" style="color:var(--naranja)">STRATIS · BBVA ADQUIRENCIA</div>
    <h1>CRM de campo</h1>
    <p>Entra con tu correo de Stratis. La sesión queda guardada en este celular: no tendrás que volver a escribir tu clave.</p>
    <input class="campo" id="lCorreo" type="email" autocomplete="username" placeholder="nombre@mystratis.com" required style="background:#fff;color:#0C1137">
    <input class="campo" id="lClave" type="password" autocomplete="current-password" placeholder="Tu clave" required style="background:#fff;color:#0C1137">
    ${S.error ? `<div class="falta" style="color:#ffb3a0">${esc(S.error)}</div>` : ""}
    <button class="btn btn-pri btn-full" type="submit">Entrar</button>
  </form>`;
}
function nav(){
  const b = (v, ico, t) => `<button data-vista="${v}" class="${S.vista===v && !S.ficha ? "on":""}" aria-label="${t}">${ico}<span>${t}</span></button>`;
  const fab = S.admin ? `<button class="fab" style="background:var(--linea);box-shadow:none" disabled aria-label="Solo ejecutivos registran visitas">${ICON.mas}</button>` : `<button class="fab" data-registrar="" aria-label="Registrar visita">${ICON.mas}</button>`;
  return `<nav class="abajo">${b("inicio",ICON.casa,"Inicio")}${b("base",S.admin?ICON.lista:ICON.lista,S.admin?"Base":"Mi base")}${fab}${b("rutas",ICON.ruta,"Rutas")}${b("avance",ICON.avance,S.admin?"Avance":"Mi avance")}</nav>`;
}
function cabeceraMenu(){
  return `<div style="display:flex;gap:12px;align-items:center">${S.admin ? `<a href="./v1/" style="color:var(--cabecera-sub);font-size:12px;font-weight:600">CRM anterior</a>` : ""}<button data-salir style="background:none;border:0;color:var(--cabecera-sub);font-size:12px;font-weight:600">Salir</button></div>`;
}
function vistaInicio(){
  const m = metricas();
  const rs = rutas();
  const hayRutas = S.base.some(c => c.ruta);
  const rutaHoy = hayRutas ? (rs.find(r => r.cs.some(c => c.estado === "por" && (!c.correo || esMio(c)))) || rs[0]) : null;
  const mios = S.base.filter(esMio).sort((a,b) => String(b.ultima_visita||"").localeCompare(String(a.ultima_visita||"")));
  const volver = S.base.filter(c => c.estado === "uno" && esMio(c));
  const nombre = (S.yo.nombre_corto || S.yo.nombre || "").split(" ")[0];
  const meta = S.admin ? 640 : 160, metaR = S.admin ? 160 : 40;
  return `<div class="vista">
    <div class="cab">
      <div class="fila"><div><h1>Hola, ${esc(nombre)}</h1><div class="sub">${diaLargo(new Date())}${S.periodo ? ` · quedan ${diasQuedan()} días del periodo` : ""}</div></div>${cabeceraMenu()}</div>
      <div class="kpis">
        <div class="kpi naranja"><b>${m.visitados}<small> /${meta}</small></b><span>Comercios visitados${S.admin?"<br>equipo":""}</span></div>
        <div class="kpi verde"><b>${m.reactivados}<small> /${metaR}</small></b><span>Reactivados<br>según data BBVA</span></div>
        <div class="kpi"><b>${pct(m.conv).replace("%","")}<small>%</small></b><span>Conversión<br>meta 25%</span></div>
      </div>
    </div>
    <div class="cuerpo">
      ${S.cola.length ? `<div class="card" style="border:1.5px solid var(--ambar-t)"><h2>${S.cola.length} visita(s) guardadas en el celular</h2><div class="nota">Se envían solas cuando vuelve la señal.</div><button class="btn btn-sec btn-full" style="margin-top:10px" data-enviar-cola>Enviar ahora</button></div>` : ""}
      ${!S.base.length ? `<div class="card"><h2>Tu base del periodo todavía no está cargada</h2><div class="nota">Apenas el analista la cargue, aquí vas a ver tus comercios y tus rutas. ${S.periodo ? `Periodo ${fISO(S.periodo.ini)} al ${fISO(S.periodo.fin)}.` : ""}</div></div>` : ""}
      ${m.libres ? `<div class="card"><div class="eyebrow">Base compartida</div><h2>${m.libres} comercios libres${S.admin ? "" : ` · ${m.total} ya son tuyos`}</h2>
        <div class="nota">Mientras se termina la asignación, cualquier ejecutivo puede visitar un comercio libre. El primero que registra la visita se queda con él y desde ahí aparece solo en su base.</div>
        <button class="btn btn-sec btn-full" style="margin-top:10px" data-vista="base">Buscar un comercio</button></div>` : ""}
      ${!hayRutas && mios.length ? `<div class="card ruta-hoy"><div class="fila-ent"><div><div class="eyebrow">${S.admin ? "Comercios tomados" : "Tus comercios"}</div><h2>Últimos visitados</h2></div><span class="pill e-por">${mios.length}</span></div>
        <div class="paradas">${mios.slice(0,10).map((c,i) => `<button class="parada" data-ficha="${c.customer_id}"><span class="n">${i+1}</span><span class="t"><b>${esc(nombreDe(c))}</b><small>${esc([c.distrito, dirDe(c)].filter(Boolean).join(" · ") || "ID " + c.customer_id)}</small></span><span class="pill ${ESTADOS[c.estado].c}">${ESTADOS[c.estado].t}</span></button>`).join("")}</div></div>` : ""}
      ${rutaHoy ? `<div class="card ruta-hoy">
        <div class="fila-ent"><div><div class="eyebrow">${S.admin ? "Primera ruta pendiente" : "Tu ruta de hoy"}</div><h2>${esc(rutaHoy.nombre)}</h2></div><span class="pill e-por">${rutaHoy.cs.length} comercios</span></div>
        <div class="nav2" style="grid-template-columns:1fr"><a class="btn btn-sec" href="${urlRuta(rutaHoy.cs)}" target="_blank" rel="noopener">${ICON.ruta} Abrir la ruta en Google Maps</a></div>
        <div class="paradas">${rutaHoy.cs.slice(0,12).map((c,i) => `<button class="parada" data-ficha="${c.customer_id}"><span class="n">${i+1}</span><span class="t"><b>${esc(nombreDe(c))}</b><small>${esc(dirDe(c))}</small></span><span class="pill ${ESTADOS[c.estado].c}">${ESTADOS[c.estado].t}</span></button>`).join("")}</div>
      </div>` : ""}
      ${volver.length ? `<div class="card"><div class="eyebrow" style="color:var(--ambar)">Vale la pena volver</div><h2>${volver.length} comercio(s) con un solo día de transacción</h2><div class="nota">Un segundo día distinto antes del cierre los convierte en reactivados.</div>
        <div class="paradas">${volver.map(c => `<button class="parada" data-ficha="${c.customer_id}"><span class="n" style="background:var(--ambar-t);color:var(--ambar)">1</span><span class="t"><b>${esc(nombreDe(c))}</b><small>${esc(c.distrito)} · ${esc(dirDe(c))}</small></span></button>`).join("")}</div></div>` : ""}
      <div class="accesos">
        <button class="acceso" data-vista="base"><span class="ico" style="background:var(--azul-t);color:var(--azul)">${ICON.lista}</span><b>${S.admin?"Base":"Mi base"}</b><small>${m.total} comercios asignados</small></button>
        <button class="acceso" data-vista="rutas"><span class="ico" style="background:var(--naranja-t);color:var(--naranja)">${ICON.ruta}</span><b>Rutas</b><small>${rs.length} grupos de visita</small></button>
      </div>
      <div class="nota" style="text-align:center">versión ${BUILD}</div>
    </div></div>`;
}
function filtrar(){
  const q = S.q.trim().toLowerCase();
  return S.base.filter(c => {
    if (S.filtroEstado !== "todos" && c.estado !== S.filtroEstado) return false;
    if (S.filtroDistrito && c.distrito !== S.filtroDistrito) return false;
    if (S.filtroRuta && (c.ruta || ("Distrito · " + (c.distrito || "sin distrito"))) !== S.filtroRuta) return false;
    if (S.filtroEjecutivo && c.correo !== S.filtroEjecutivo) return false;
    if (S.filtroDueno === "mios" && !esMio(c)) return false;
    if (S.filtroDueno === "libres" && c.correo) return false;
    if (q && !(String(c.customer_id).includes(q) || String(c.razon_social).toLowerCase().includes(q) || String(c.nombre_comercial||"").toLowerCase().includes(q))) return false;
    return true;
  });
}
function tarjeta(c){
  const e = ESTADOS[c.estado] || ESTADOS.por;
  return `<button class="com" data-ficha="${c.customer_id}">
    <div class="l1"><span>ID ${esc(c.customer_id)}${S.admin && c.correo ? " · " + esc(c.correo.split("@")[0]) : ""}</span>${c.correo ? `<span class="pill ${e.c}">${e.t}</span>` : `<span class="pill e-seg">Libre</span>`}</div>
    <b>${esc(nombreDe(c))}</b>
    <div class="l3"><span>${esc([c.distrito, dirDe(c)].filter(Boolean).join(" · ") || "Sin dirección todavía")}</span><span>${c.ultima_visita ? "Visitado " + fechaCorta(c.ultima_visita) : ""}</span></div>
  </button>`;
}
function vistaBase(){
  const lista = filtrar().slice(0, 300);
  const total = filtrar().length;
  const distritos = [...new Set(S.base.map(c => c.distrito).filter(Boolean))].sort();
  const rs = rutas();
  const ejec = [...new Set(S.base.map(c => c.correo))].sort();
  const est = [["todos","Todos"],["por","Por visitar"],["uno","1 día · volver"],["esp","Esperando 2 días"],["rea","Reactivados"],["seg","Aún no decide"],["rag","Reagendados"],["sin","Sin éxito"],["des","Desistió"],["can","Cancelados"]];
  return `<div class="vista">
    <div class="barra"><h1>${S.admin?"Base del periodo":"Mi base"}</h1>
      <label class="buscar">${ICON.lista}<input id="q" type="search" placeholder="Busca por customer ID o razón social" value="${esc(S.q)}" autocomplete="off"></label></div>
    ${S.base.some(c => !c.correo) ? `<div class="chips">${[["todos","Todos"],["mios",S.admin?"Tomados":"Míos"],["libres","Libres"]].map(([k,t]) => `<button class="chip ${S.filtroDueno===k?"on":""}" data-dueno="${k}">${t}</button>`).join("")}</div>` : ""}
    <div class="chips">${est.map(([k,t]) => `<button class="chip ${S.filtroEstado===k?"on":""}" data-estado="${k}">${t}</button>`).join("")}</div>
    <div class="filtros">
      <select id="fDistrito" aria-label="Distrito"><option value="">Todos los distritos</option>${distritos.map(d => `<option ${S.filtroDistrito===d?"selected":""}>${esc(d)}</option>`).join("")}</select>
      <select id="fRuta" aria-label="Ruta"><option value="">Todas las rutas</option>${rs.map(r => `<option ${S.filtroRuta===r.nombre?"selected":""}>${esc(r.nombre)}</option>`).join("")}</select>
    </div>
    ${S.admin ? `<div class="filtros"><select id="fEjec" aria-label="Ejecutivo"><option value="">Todos los ejecutivos</option>${ejec.map(e => `<option value="${esc(e)}" ${S.filtroEjecutivo===e?"selected":""}>${esc(e.split("@")[0])}</option>`).join("")}</select></div>` : ""}
    ${S.filtroRuta ? `<div style="padding:10px 16px 0"><a class="btn btn-sec btn-full" href="${urlRuta(filtrar())}" target="_blank" rel="noopener">${ICON.ruta} Abrir esta ruta en Google Maps</a></div>` : ""}
    <div class="conteo">${total} de ${S.base.length} comercios${total > 300 ? " · se muestran los primeros 300, usa el buscador" : ""}</div>
    <div class="lista">${lista.length ? lista.map(tarjeta).join("") : `<div class="vacio">${S.base.length ? "No hay comercios con este filtro." : "Tu base todavía no está cargada."}</div>`}</div>
  </div>`;
}
function vistaRutas(){
  const rs = rutas();
  return `<div class="vista">
    <div class="barra"><h1>Rutas</h1><div style="color:var(--cabecera-sub);font-size:13px">Grupos de comercios cercanos: un día de trabajo cada uno.</div></div>
    ${!S.base.some(c => c.ruta) ? `<div class="lista"><div class="vacio">Las rutas se arman cuando llegue la base completa con distritos y direcciones. Mientras tanto, busca el comercio en ${S.admin?"Base":"Mi base"}.</div></div>` : ""}
    <div class="lista">${S.base.some(c => c.ruta) && rs.length ? rs.map(r => { const hechos = r.cs.filter(c => c.visitas > 0).length;
      return `<div class="com"><div class="l1"><span>${r.cs.length} comercios</span><span class="pill ${hechos===r.cs.length?"e-rea":"e-por"}">${hechos} de ${r.cs.length} visitados</span></div><b>${esc(r.nombre)}</b>
        <div class="pista"><i style="width:${r.cs.length?hechos/r.cs.length*100:0}%;background:var(--naranja)"></i></div>
        <div class="nav2"><button class="btn btn-lin" data-ruta="${esc(r.nombre)}">Ver comercios</button><a class="btn btn-sec" href="${urlRuta(r.cs)}" target="_blank" rel="noopener">Google Maps</a></div></div>`; }).join("") : ""}</div>
  </div>`;
}
function vistaFicha(c){
  if (!c){ S.ficha = null; return vistaInicio(); }
  const e = ESTADOS[c.estado] || ESTADOS.por;

  const editando = S.editando === c.customer_id;
  const h = S.hist[c.customer_id];
  if (!h) historial(c.customer_id);
  return `<div class="vista">
    <div class="cab" style="padding-bottom:56px">
      <button class="volver" data-cerrar-ficha>${ICON.atras} Volver</button>
      <div class="eyebrow" style="color:var(--cabecera-sub)">Customer ID ${esc(c.customer_id)}</div>
      <h1 style="margin-top:4px">${esc(nombreDe(c))}</h1>
      <div class="sub">${esc(c.rubro || "")}</div>
    </div>
    <div class="cuerpo">
      <div class="card">
        <div class="fila-ent">${c.correo ? `<span class="pill ${e.c}">${e.t}</span>` : `<span class="pill e-seg">Libre</span>`}<span class="nota">${esc(c.ruta || "")}</span></div>
        ${!c.correo ? `<div class="explica" style="margin-top:10px">Comercio libre de la base compartida. Si registras la visita, pasa a tu base.</div>` : e.ayuda ? `<div class="explica" style="margin-top:10px">${e.ayuda}</div>` : ""}
        <dl class="datos">
          <dt>Razón social</dt><dd>${esc(c.razon_social)}</dd>
          <dt>Dirección</dt><dd>${esc(dirDe(c))}</dd>
          ${refDe(c) ? `<dt>Referencia</dt><dd>${esc(refDe(c))}</dd>` : ""}
          ${c.contacto ? `<dt>Contacto</dt><dd>${esc(c.contacto)}</dd>` : ""}
          <dt>Distrito</dt><dd>${esc(c.distrito)}</dd>
          <dt>Provincia · Depto.</dt><dd>${esc(c.provincia)} · ${esc(c.departamento)}</dd>
          <dt>Zona</dt><dd>${esc(c.zona)}</dd>
          ${S.admin ? `<dt>Ejecutivo</dt><dd>${esc(c.correo)}</dd>` : ""}
        </dl>
        <div class="tasas"><div class="tasa"><b>${tasa(c.tasa_debito)}</b><small>Débito</small></div><div class="tasa"><b>${tasa(c.tasa_credito)}</b><small>Crédito</small></div><div class="tasa"><b>${tasa(c.tasa_foranea)}</b><small>Foránea</small></div></div>
      </div>
      <div class="btns">
        <a class="btn btn-sec" href="${urlGoogle(c)}" target="_blank" rel="noopener">${ICON.pin} Google Maps</a>
        <a class="btn btn-waze" href="${urlWaze(c)}" target="_blank" rel="noopener">${ICON.pin} Waze</a>
      </div>
      ${c.geo_calidad ? `<div class="aprox" style="text-align:center;margin-top:-6px">${esc(CALIDAD[c.geo_calidad] || "")}</div>` : ""}
      ${S.admin ? "" : `<button class="btn btn-pri btn-full" data-registrar="${esc(c.customer_id)}">Registrar visita</button>`}
      <div class="card">
        <div class="fila-ent"><h2>Datos del comercio</h2><button class="btn btn-lin" style="padding:8px 12px;font-size:13px" data-editar="${esc(c.customer_id)}">${editando ? "Cancelar" : "Corregir datos"}</button></div>
        ${editando ? `<div style="display:grid;gap:10px;margin-top:10px">
            <input class="campo" id="eNombre" placeholder="Nombre comercial (el del letrero)" value="${esc(c.nombre_comercial||"")}">
            <input class="campo" id="eDir" placeholder="Dirección correcta" value="${esc(c.direccion_corregida||c.direccion||"")}">
            <input class="campo" id="eRef" placeholder="Referencia (frente a, dentro de…)" value="${esc(c.referencia||"")}">
            <input class="campo" id="eCont" placeholder="Contacto en el comercio" value="${esc(c.contacto||"")}">
            <div class="nota">El customer ID, la razón social y las tasas vienen de BBVA y no se cambian. Tu corrección queda registrada con tu nombre.</div>
            <button class="btn btn-pri btn-full" data-guardar-datos="${esc(c.customer_id)}">Guardar corrección</button></div>`
          : `<div class="nota" style="margin-top:6px">Si la dirección o el nombre no coinciden con lo que ves en la calle, corrígelos aquí.</div>`}
      </div>
      <div class="card"><h2>Visitas en este periodo</h2>
        ${!h ? `<div class="nota">Cargando…</div>` : h.length ? `<div class="hist">${h.map(v => `<div><b>${fechaCorta(v.visitado_en)} · ${horaCorta(v.visitado_en)}</b> · ${esc(v.que)}${v.motivo ? " (" + esc(v.motivo.toLowerCase()) + ")" : ""}${v.decision ? " · " + esc(v.decision) : ""}${v.equipo ? " · equipo: " + esc(v.equipo) : ""}${v.fecha_reagenda ? " · vuelve el " + fISO(v.fecha_reagenda) : ""}${v.lat == null ? " · <span style='color:var(--rojo)'>sin ubicación</span>" : ""}<br><span class="nota">${esc(v.con)} · ${esc(v.comentario)}</span></div>`).join("")}</div>` : `<div class="nota">Todavía no lo visitas en este periodo.</div>`}
      </div>
    </div></div>`;
}
function vistaAvance(){
  return `<div class="vista">
    <div class="barra"><h1>${S.admin?"Avance":"Mi avance"}</h1><div style="color:var(--cabecera-sub);font-size:13px">${S.periodo ? `Periodo ${fISO(S.periodo.ini)} al ${fISO(S.periodo.fin)}` : ""}</div></div>
    <div class="cuerpo" style="margin-top:14px">
      <div class="card" style="text-align:center;padding:28px 18px">
        <span class="pill e-esp" style="margin:0 auto">Próximamente</span>
        <h2 style="margin-top:14px;font-size:18px">Aquí vas a ver tu avance y tu bono</h2>
        <div class="nota" style="max-width:32ch;margin:8px auto 0">Estamos afinando cómo mostrar la medición con la data de BBVA. Mientras tanto, en Inicio ves tus comercios visitados, tus reactivados y tu conversión.</div>
      </div>
    </div></div>`;
}

/* ---------------- registrar visita ---------------- */
function nuevoRegistro(id){
  S.reg = { id: id || null, busca:"", gps:"buscando", lat:null, lng:null, precision:null, hora:new Date(), con:null, motivo:null, que:null, decision:null, equipo:null, fechaNueva:"", comentario:"", intento:false, enviando:false };
  pintar(); pedirGPS();
}
function pedirGPS(){
  const r = S.reg; if (!r) return; r.gps = "buscando"; S._mantenerScroll = true; pintar();
  if (!navigator.geolocation){ r.gps = "error"; return pintar(); }
  navigator.geolocation.getCurrentPosition(p => { if (!S.reg) return; Object.assign(S.reg, { gps:"ok", lat:p.coords.latitude, lng:p.coords.longitude, precision:Math.round(p.coords.accuracy) }); S._mantenerScroll = true; pintar(); },
    () => { if (!S.reg) return; S.reg.gps = "error"; S._mantenerScroll = true; pintar(); },
    { enableHighAccuracy:true, timeout:20000, maximumAge:30000 });
}
function hojaRegistro(){
  const r = S.reg, c = r.id ? S.base.find(x => x.customer_id === r.id) : null;
  const op = (campo, val, t, sub, tono) => `<button class="op ${r[campo]===val?"on "+(tono||""):""}" data-op="${campo}" data-val="${val}">${t}${sub?`<small>${sub}</small>`:""}</button>`;
  const q = r.busca.trim().toLowerCase();
  const res = q.length >= 2 ? S.base.filter(x => String(x.customer_id).includes(q) || String(x.razon_social).toLowerCase().includes(q) || String(x.nombre_comercial||"").toLowerCase().includes(q)).slice(0,8) : [];
  const revisita = c && c.visitas > 0;
  let pasos = `<div class="paso"><span class="eyebrow">Comercio</span>${c
    ? `<div class="elegido"><div><b>${esc(nombreDe(c))}</b><small>ID ${esc(c.customer_id)}${c.distrito ? " · " + esc(c.distrito) : ""}${c.correo ? "" : " · libre: pasa a tu base al guardar"}</small></div><button data-cambiar-comercio>Cambiar</button></div>
       ${revisita ? `<div class="explica" style="margin-top:8px">Ya lo visitaste en este periodo. La visita queda registrada para el seguimiento, pero no suma otra a las 160.</div>` : ""}`
    : `<input class="campo" id="busca" type="search" placeholder="Customer ID o razón social" value="${esc(r.busca)}" autocomplete="off">
       <div class="resultados">${res.map(x => `<button data-elegir="${esc(x.customer_id)}"><b>${esc(nombreDe(x))}</b><small>ID ${esc(x.customer_id)}${x.distrito ? " · " + esc(x.distrito) : ""}${x.correo ? "" : " · libre"}</small></button>`).join("")}</div>`}</div>`;
  const gpsTxt = r.gps === "buscando" ? "Tomando ubicación…" : r.gps === "ok" ? `Ubicación tomada ±${r.precision} m` : "Sin ubicación";
  pasos += `<div class="paso"><span class="eyebrow">Se toma solo</span><div class="sello">
      <span class="${r.gps==="ok"?"":"esperando"}">${ICON.pin} ${gpsTxt}</span><span>${ICON.reloj} ${fechaCorta(r.hora)} · ${horaCorta(r.hora)}</span></div>
      ${r.gps === "error" ? `<div class="explica" style="margin-top:8px;color:var(--rojo)">No se pudo tomar la ubicación. Sin ubicación la visita no cuenta: activa el GPS y el permiso de ubicación del navegador. <button class="btn btn-sec" style="padding:6px 10px;font-size:12.5px;margin-top:6px" data-gps>Intentar otra vez</button></div>` : ""}</div>`;
  pasos += `<div class="paso"><span class="eyebrow">¿Con quién hablaste?</span><div class="opciones c3">${op("con","Dueño","Dueño")}${op("con","Tercero","Tercero","encargado, cajero")}${op("con","Nadie","Nadie")}</div></div>`;
  if (r.con === "Nadie") pasos += `<div class="paso"><span class="eyebrow">¿Por qué no hubo contacto?</span><div class="opciones c2">${["Cerrado","No estaba","No atendió","Dirección errada"].map(m => op("motivo",m,m,"","rojo")).join("")}</div>
      <div class="explica" style="margin-top:8px">Queda como visita sin éxito. Igual cuenta como visita, porque estuviste en el comercio.</div></div>`;
  if (r.con && r.con !== "Nadie") pasos += `<div class="paso"><span class="eyebrow">¿Qué pasó?</span><div class="opciones c3">${op("que","Reunión concretada","Reunión concretada","","verde")}${op("que","Reagendada","Reagendada")}${op("que","Sin éxito","Sin éxito","","rojo")}</div></div>`;
  if (r.que === "Reunión concretada") pasos += `<div class="paso"><span class="eyebrow">¿Qué decidió el comercio?</span><div class="opciones c3">${op("decision","Realizará consumos","Realizará consumos","","verde")}${op("decision","Aún no decide","Aún no decide")}${op("decision","Desiste del producto","Desiste del producto","","rojo")}</div>
      ${r.decision==="Realizará consumos" ? `<div class="explica" style="margin-top:8px">Todavía no es una reactivación: cuenta cuando la data de BBVA muestre transacciones en dos días distintos después de hoy.</div>` : ""}</div>`;
  if (r.decision === "Desiste del producto") pasos += `<div class="paso"><span class="eyebrow">¿Se recuperó el equipo?</span><div class="opciones c3">${op("equipo","Sí","Sí","","verde")}${op("equipo","No","No","","rojo")}${op("equipo","Pendiente","Pendiente")}</div></div>`;
  if (r.que === "Reagendada") pasos += `<div class="paso"><span class="eyebrow">¿Cuándo vuelves?</span><input class="campo" id="fechaNueva" type="date" value="${esc(r.fechaNueva)}"></div>`;
  pasos += `<div class="paso"><span class="eyebrow">Comentario · qué dijo el comercio</span><textarea class="campo" id="coment" placeholder="Ej.: el dueño usa el POS de otro banco; lo va a activar esta semana. Puedes dictarlo con el micrófono del teclado.">${esc(r.comentario)}</textarea></div>`;
  const faltan = faltantes();
  return `<div class="velo" data-cerrar-velo><div class="hoja" role="dialog" aria-label="Registrar visita">
    <header><div class="asa"></div><div class="fila-ent"><h2>Registrar visita</h2><button class="btn btn-lin" style="padding:6px 12px;font-size:13px" data-cancelar>Cancelar</button></div></header>
    <div class="scroll">${pasos}</div>
    <footer>${r.intento && faltan.length ? `<div class="falta" style="margin-bottom:8px">Falta: ${faltan.join(", ")}.</div>` : ""}<button class="btn btn-pri btn-full" data-guardar-visita ${r.enviando?"disabled":""}>${r.enviando ? "Guardando…" : "Guardar visita"}</button></footer>
  </div></div>`;
}
function faltantes(){
  const r = S.reg, f = [];
  if (!r.id) f.push("elegir el comercio");
  if (r.gps === "buscando") f.push("esperar la ubicación");
  if (!r.con) f.push("con quién hablaste");
  if (r.con === "Nadie" && !r.motivo) f.push("el motivo");
  if (r.con && r.con !== "Nadie" && !r.que) f.push("qué pasó");
  if (r.que === "Reunión concretada" && !r.decision) f.push("qué decidió");
  if (r.decision === "Desiste del producto" && !r.equipo) f.push("si se recuperó el equipo");
  if (r.que === "Reagendada" && !r.fechaNueva) f.push("la fecha en que vuelves");
  if (r.comentario.trim().length < 5) f.push("el comentario");
  return f;
}
async function guardarVisita(){
  const r = S.reg;
  if (faltantes().length){ r.intento = true; S._mantenerScroll = true; return pintar(); }
  if (r.gps !== "ok" && !confirm("La visita no tiene ubicación y no va a contar. ¿Guardarla igual?")) return;
  const c = S.base.find(x => x.customer_id === r.id); const nueva = !(c && c.visitas > 0);
  const v = { p_customer_id:r.id, p_visitado_en:r.hora.toISOString(), p_lat:r.lat, p_lng:r.lng, p_precision:r.precision,
    p_con:r.con, p_motivo:r.con==="Nadie"?r.motivo:null, p_que:r.con==="Nadie"?"Sin éxito":r.que, p_decision:r.que==="Reunión concretada"?r.decision:null,
    p_equipo:r.decision==="Desiste del producto"?r.equipo:null, p_fecha_reagenda:r.que==="Reagendada"?r.fechaNueva:null, p_comentario:r.comentario.trim(), p_cliente_uid:uid() };
  r.enviando = true; S._mantenerScroll = true; pintar();
  try {
    await enviar(v);
    S.reg = null; delete S.hist[v.p_customer_id];
    await recargarBase();
    const m = metricas();
    avisar(nueva && v.p_lat != null ? `Visita guardada. Llevas <b>${m.visitados} de 160</b> comercios visitados.` : nueva ? "Visita guardada sin ubicación: no suma a las 160." : `Visita guardada como seguimiento. Sigues en <b>${m.visitados} de 160</b>.`);
  } catch(e){
    if (/fetch|network|Failed|NetworkError/i.test(e.message || "") || !navigator.onLine){
      S.cola.push(v); guardarCola(); S.reg = null;
      avisar("Sin señal: la visita quedó guardada en el celular con su hora y ubicación. Se envía sola cuando vuelva la conexión.", 6000);
    } else { r.enviando = false; if (/otro ejecutivo/.test(e.message || "")){ S.reg = null; recargarBase(); } avisar("No se guardó: " + esc(e.message), 6000); }
  }
}

/* ---------------- eventos ---------------- */
function enlazar(){
  const p = $("#pantalla");
  const f = $("#fIngreso"); if (f) f.onsubmit = async ev => { ev.preventDefault(); S.error = "";
    const { data, error } = await sb.auth.signInWithPassword({ email:$("#lCorreo").value.trim().toLowerCase(), password:$("#lClave").value });
    if (error){ S.error = /Invalid/i.test(error.message) ? "Correo o clave incorrectos." : error.message; return pintar(); }
    S.sesion = data.session; cargar(); };
  p.querySelectorAll("[data-salir]").forEach(b => b.onclick = async () => { await sb.auth.signOut(); location.reload(); });
  p.querySelectorAll("[data-reintentar]").forEach(b => b.onclick = cargar);
  p.querySelectorAll("[data-enviar-cola]").forEach(b => b.onclick = vaciarCola);
  p.querySelectorAll("[data-vista]").forEach(b => b.onclick = () => { S.vista = b.dataset.vista; S.ficha = null; pintar(); });
  p.querySelectorAll("[data-ficha]").forEach(b => b.onclick = () => { S.ficha = b.dataset.ficha; S.editando = null; pintar(); });
  p.querySelectorAll("[data-ruta]").forEach(b => b.onclick = () => { S.vista = "base"; S.filtroRuta = b.dataset.ruta; S.filtroEstado = "todos"; pintar(); });
  p.querySelectorAll("[data-cerrar-ficha]").forEach(b => b.onclick = () => { S.ficha = null; pintar(); });
  p.querySelectorAll("[data-estado]").forEach(b => b.onclick = () => { S.filtroEstado = b.dataset.estado; pintar(); });
  p.querySelectorAll("[data-dueno]").forEach(b => b.onclick = () => { S.filtroDueno = b.dataset.dueno; pintar(); });
  p.querySelectorAll("[data-registrar]").forEach(b => b.onclick = () => nuevoRegistro(b.dataset.registrar || S.ficha));
  p.querySelectorAll("[data-editar]").forEach(b => b.onclick = () => { S.editando = S.editando === b.dataset.editar ? null : b.dataset.editar; S._mantenerScroll = true; pintar(); });
  p.querySelectorAll("[data-guardar-datos]").forEach(b => b.onclick = async () => {
    const cid = b.dataset.guardarDatos;
    const { error } = await sb.rpc("v2_corregir_comercio", { p_customer_id:cid, p_nombre:$("#eNombre").value, p_direccion:$("#eDir").value, p_referencia:$("#eRef").value, p_contacto:$("#eCont").value });
    if (error) return avisar("No se guardó la corrección: " + esc(error.message), 6000);
    S.editando = null; await recargarBase(); avisar("Corrección guardada con tu nombre."); });
  const q = $("#q"); if (q){ q.oninput = () => { S.q = q.value; const pos = q.selectionStart; pintar(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); }; }
  const fd = $("#fDistrito"); if (fd) fd.onchange = () => { S.filtroDistrito = fd.value; pintar(); };
  const fr = $("#fRuta"); if (fr) fr.onchange = () => { S.filtroRuta = fr.value; pintar(); };
  const fe = $("#fEjec"); if (fe) fe.onchange = () => { S.filtroEjecutivo = fe.value; pintar(); };
  if (S.reg){
    p.querySelectorAll("[data-op]").forEach(b => b.onclick = () => { const r = S.reg, k = b.dataset.op; r[k] = b.dataset.val;
      if (k === "con"){ r.motivo = null; r.que = null; r.decision = null; r.equipo = null; }
      if (k === "que"){ r.decision = null; r.equipo = null; }
      if (k === "decision") r.equipo = null;
      S._mantenerScroll = true; pintar(); });
    const bs = $("#busca"); if (bs){ bs.oninput = () => { S.reg.busca = bs.value; S._mantenerScroll = true; const pos = bs.selectionStart; pintar(); const n = $("#busca"); n.focus(); n.setSelectionRange(pos,pos); }; }
    p.querySelectorAll("[data-elegir]").forEach(b => b.onclick = () => { S.reg.id = b.dataset.elegir; S._mantenerScroll = true; pintar(); });
    p.querySelectorAll("[data-cambiar-comercio]").forEach(b => b.onclick = () => { S.reg.id = null; S.reg.busca = ""; S._mantenerScroll = true; pintar(); });
    p.querySelectorAll("[data-gps]").forEach(b => b.onclick = pedirGPS);
    const cm = $("#coment"); if (cm) cm.oninput = () => { S.reg.comentario = cm.value; };
    const fn = $("#fechaNueva"); if (fn) fn.onchange = () => { S.reg.fechaNueva = fn.value; };
    p.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = () => { S.reg = null; pintar(); });
    p.querySelectorAll("[data-guardar-visita]").forEach(b => b.onclick = guardarVisita);
    const velo = p.querySelector("[data-cerrar-velo]"); if (velo) velo.onclick = e => { if (e.target === velo){ S.reg = null; pintar(); } };
  }
}
window.addEventListener("online", vaciarCola);
(async () => {
  const { data } = await sb.auth.getSession();
  S.sesion = data.session;
  sb.auth.onAuthStateChange((ev, ses) => { if (ev === "SIGNED_OUT"){ S.sesion = null; S.yo = null; pintar(); } else if (ses) S.sesion = ses; });
  if (S.sesion) cargar(); else pintar();
})();

</script>
</body></html>
