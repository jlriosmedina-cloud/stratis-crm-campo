<title>Stratis CRM — BBVA Adquirencia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stratis CRM">
<link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27512%27%20height%3D%27512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%2796%27%20fill%3D%27%230b2545%27/%3E%3Ctext%20x%3D%27256%27%20y%3D%27340%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%27280%27%20font-weight%3D%27800%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27512%27%20height%3D%27512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%2796%27%20fill%3D%27%230b2545%27/%3E%3Ctext%20x%3D%27256%27%20y%3D%27340%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%27280%27%20font-weight%3D%27800%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%3ES%3C/text%3E%3C/svg%3E">

<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f3f4f1; --card:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --ring:rgba(11,11,11,.10);
  --brand:#0b2545; --brand-2:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#a32626; --warn-ink:#8a6100; --serious-ink:#9c4a25;
  --good-bg:#e8f6e8; --warn-bg:#fef3d9; --serious-bg:#fdeade; --crit-bg:#fbe6e6; --info-bg:#e7f0fc;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
  --nav-h:62px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --card:#1a1a19;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --line:#383835; --ring:rgba(255,255,255,.10);
  --brand:#0f1c2e; --brand-2:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-ink:#0ca30c; --crit-ink:#e66767; --warn-ink:#fab219; --serious-ink:#ec835a;
  --good-bg:#122b12; --warn-bg:#33280a; --serious-bg:#33200f; --crit-bg:#331414; --info-bg:#0f2137;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--plane); color:var(--ink);
  font-size:15px; line-height:1.45; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#login{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(160deg,#0b2545 0%,#123a63 48%,#1b5183 100%);
}
.lg-card{width:100%;max-width:412px;background:var(--card);border-radius:20px;padding:30px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lg-logo{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.lg-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(140deg,#0b2545,#2a78d6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px;flex:none}
.lg-logo h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.lg-logo p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;font-size:14.5px;margin-bottom:8px}
.ms-btn:hover{background:var(--plane)}
.ms-tiles{width:19px;height:19px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
.ms-tiles i{display:block;border-radius:1px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--grid)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-1);outline:none;font-size:16px;
}
textarea{resize:vertical;min-height:78px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(42,120,214,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand-2);color:#fff;font-weight:650;cursor:pointer;font-size:14.5px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--plane)}
.btn.danger{background:var(--crit)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.err{background:var(--crit-bg);color:var(--crit-ink);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.demo-users{margin-top:14px;border-top:1px solid var(--grid);padding-top:13px}
.demo-users p{margin:0 0 8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.du{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 9px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;margin-bottom:2px}
.du:hover{background:var(--plane);border-color:var(--grid)}
.av{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;background:var(--s1)}
.du b{display:block;font-size:13.5px;font-weight:600}
.du span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- APP SHELL ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:11px
}
header.top .mark{width:31px;height:31px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
header.top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.72;letter-spacing:0}
.icon-btn{background:rgba(255,255,255,.13);border:0;color:#fff;width:33px;height:33px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}
.icon-btn:hover{background:rgba(255,255,255,.24)}
/* El pulso: un punto que dice si el CRM está escuchando cambios en vivo */
.pulso i{width:9px;height:9px;border-radius:50%;background:#9aa6b2;display:block;transition:background .3s}
.pulso[data-estado="vivo"] i{background:#39d98a;box-shadow:0 0 0 0 rgba(57,217,138,.65);animation:latido 2.4s ease-out infinite}
.pulso[data-estado="tibio"] i{background:#f5c451}
.pulso[data-estado="mal"] i{background:#ef6b6b}
.pulso[data-estado="carga"] i{background:#fff;animation:parpadeo .8s ease-in-out infinite}
.pulso.con-novedad{background:rgba(57,217,138,.3)}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(57,217,138,.6)}70%{box-shadow:0 0 0 7px rgba(57,217,138,0)}100%{box-shadow:0 0 0 0 rgba(57,217,138,0)}}
@keyframes parpadeo{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pulso i{animation:none!important}}
main{flex:1;padding:13px 13px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);
  border-top:1px solid var(--grid);display:flex;padding-bottom:env(safe-area-inset-bottom)
}
nav.bottom button{
  flex:1;background:none;border:0;padding:8px 2px 7px;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;position:relative
}
nav.bottom button .ic{font-size:18px;line-height:1}
nav.bottom button.on{color:var(--brand-2)}
nav.bottom button .dot{position:absolute;top:5px;right:calc(50% - 17px);min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* ---------- COMPONENTS ---------- */
/* Una tarjeta es un contenedor, no un objeto que compite por atención: borde
   fino, sin sombra. La sombra queda para lo que sí se lee primero —los
   números de arriba— y así la pantalla se lee como una página, no como una
   pila de cajas. */
.card{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);padding:15px 16px;margin-bottom:11px}
/* Los títulos van en su caja y media, no en mayúsculas. Cuando todo grita al
   mismo volumen no se distingue lo importante de lo accesorio. */
.card h3{margin:0 0 10px;font-size:14.5px;font-weight:640;letter-spacing:-.15px;color:var(--ink)}
.card h3 .h3-sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}

/* Un bloque dentro de una tarjeta no es otra tarjeta: se separa con una línea,
   no con un marco. Marcos dentro de marcos es lo que hace ver todo apretado. */
.bloque{padding-top:13px;margin-top:13px;border-top:1px solid var(--grid)}
.bloque:first-child{padding-top:0;margin-top:0;border-top:0}
.bloque > h4{margin:0 0 9px;font-size:13px;font-weight:640;color:var(--ink)}

/* Vacío no es un aviso. Antes cada «todavía no hay datos» pintaba un recuadro
   azul, y una pantalla sin actividad se veía como una pantalla llena de
   alertas. Ahora es una línea gris y ya. */
.vacio{color:var(--muted);font-size:13px;padding:14px 2px;line-height:1.5}

/* Una nota al pie: contexto de una línea que no merece un recuadro. */
.pie{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.pie b{color:var(--ink-2);font-weight:600}

/* La explicación larga existe, pero plegada. El que ya sabe leer el número no
   tiene que pasar por encima de tres párrafos cada vez que entra. */
details.explica{margin-top:11px;border-top:1px solid var(--grid);padding-top:9px}
details.explica > summary{cursor:pointer;font-size:12.5px;color:var(--brand-2);font-weight:600;
  list-style:none;display:inline-flex;align-items:center;gap:6px}
details.explica > summary::-webkit-details-marker{display:none}
details.explica > summary:before{content:"›";display:inline-block;transition:transform .15s;font-size:15px;line-height:1}
details.explica[open] > summary:before{transform:rotate(90deg)}
details.explica .cuerpo{font-size:12.8px;color:var(--ink-2);line-height:1.55;margin-top:9px}
details.explica .cuerpo p{margin:0 0 8px}
details.explica .cuerpo p:last-child{margin-bottom:0}
details.explica .cuerpo b{color:var(--ink)}

/* ================= AJUSTES =================
   La pantalla se lee como secciones, no como una pila de tarjetas iguales.
   Cada sección abre con su título y una línea que dice para qué sirve; la
   letra chica vive plegada, para que lo accionable quede a la vista. */
.aj-sec{margin:0 0 22px}
.aj-sec > .aj-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 9px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.aj-sec > .aj-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.aj-sec > .aj-h span{font-size:12.5px;color:var(--muted)}
.aj-grid{display:grid;grid-template-columns:1fr;gap:11px;align-items:start}
.aj-grid > .card{margin-bottom:0}

/* Identidad */
.aj-yo{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.aj-yo .av{width:46px;height:46px;font-size:15px;flex:none}
.aj-yo .quien{flex:1;min-width:180px}
.aj-yo .quien b{font-size:15.5px;letter-spacing:-.2px}
.aj-yo .quien div{font-size:12.5px;color:var(--muted);margin-top:2px}
.aj-acc{display:flex;gap:8px;flex-wrap:wrap}
.aj-acc .btn{flex:1;min-width:132px}

/* Una fila de descarga: qué es, el botón que lo baja, y los CSV sueltos.
   En celular se apilan en ese orden —lo principal primero—; en pantalla ancha
   el botón se va a la derecha y los CSV quedan debajo del texto. */
.aj-dl{display:grid;grid-template-columns:1fr;gap:10px;
  padding:14px 0;border-bottom:1px solid var(--grid)}
.aj-dl:first-of-type{padding-top:2px}
.aj-dl:last-of-type{border-bottom:0;padding-bottom:2px}
.aj-dl .txt b{font-size:14.5px;letter-spacing:-.1px}
.aj-dl .txt div{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.aj-dl .btn{align-self:start}
.aj-csv{display:flex;gap:7px;flex-wrap:wrap}
/* Acá el ancho ya lo pone el contenedor; el tope de 820px dejaba el borde
   derecho de cada aviso desalineado con el de su tarjeta. */
.view-ajustes .note{max-width:none}

/* Lo que antes eran tres bloques azules seguidos */
details.aj-mas{border-top:1px solid var(--grid);margin-top:11px;padding-top:9px}
details.aj-mas > summary{cursor:pointer;list-style:none;font-size:12.5px;font-weight:650;
  color:var(--brand-2);display:inline-flex;align-items:center;gap:6px;padding:3px 0;user-select:none}
details.aj-mas > summary::-webkit-details-marker{display:none}
details.aj-mas > summary:before{content:"›";display:inline-block;transition:transform .16s;font-size:15px;line-height:1}
details.aj-mas[open] > summary:before{transform:rotate(90deg)}
details.aj-mas > summary:hover{text-decoration:underline}
details.aj-mas .cuerpo{font-size:12.8px;color:var(--ink-2);line-height:1.58;padding:9px 0 2px;max-width:840px}
details.aj-mas .cuerpo p{margin:0 0 9px}
details.aj-mas .cuerpo p:last-child{margin-bottom:0}

/* Reglas: rejilla real, no columnas que dejan huérfanas */
.aj-reglas{display:grid;grid-template-columns:1fr;gap:0}
.aj-reglas .kv{padding:9px 0}
.aj-pie{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px 4px;line-height:1.6}
.aj-pie b{color:var(--ink-2);font-weight:650}

/* Equipo */
.eq-top{display:flex;align-items:center;justify-content:space-between;gap:11px;flex-wrap:wrap;
  margin:0 0 12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.eq-conteo{font-size:13.5px}
.eq-conteo b{font-size:17px;letter-spacing:-.3px;margin-right:2px}
input.meta-in{width:96px;text-align:right;padding:7px 9px;font-size:14px;font-weight:650;
  border:1px solid var(--ring);border-radius:9px;background:var(--card);color:var(--ink);
  font-variant-numeric:tabular-nums}
input.meta-in:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--info-bg)}
table.tbl-metas td{vertical-align:middle}
table.tbl-equipo td:first-child{min-width:190px}
table.tbl-equipo tr.eq-baja td{opacity:.55}
/* En celular la tabla no cabe: los dos números se bajan al nombre en vez de
   dejar la fila cortada por el borde derecho. */
.eq-mini{display:none;font-size:11.5px;color:var(--muted);margin-top:5px;
  align-items:center;gap:6px;flex-wrap:wrap}
@media(max-width:759px){
  .eq-mini{display:flex}
  table.tbl-equipo thead{display:none}   /* una sola columna no necesita cabecera */
  table.tbl-equipo th:nth-child(2), table.tbl-equipo td:nth-child(2),
  table.tbl-equipo th:nth-child(3), table.tbl-equipo td:nth-child(3),
  table.tbl-equipo th:nth-child(4), table.tbl-equipo td:nth-child(4){display:none}
  table.tbl-equipo td:first-child{min-width:0}
  table.tbl-equipo td:last-child{white-space:normal;width:104px}
  table.tbl-equipo td:last-child .btn{display:block;width:100%}
  table.tbl-equipo td:last-child .btn + .btn{margin-top:5px}
}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.chip.p1{background:#fbe6e6;color:#a32626} .chip.p2{background:#fdeade;color:#9c4a25}
.chip.p3{background:#fef3d9;color:#8a6100} .chip.p4{background:#eceae4;color:#52514e}
:root[data-theme=dark] .chip.p1{background:#331414;color:#e66767}
:root[data-theme=dark] .chip.p2{background:#33200f;color:#ec835a}
:root[data-theme=dark] .chip.p3{background:#33280a;color:#fab219}
:root[data-theme=dark] .chip.p4{background:#2c2c2a;color:#c3c2b7}
.chip.ok{background:var(--good-bg);color:var(--good-ink)}
.chip.no{background:var(--plane);color:var(--muted);border:1px solid var(--grid)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.crit{background:var(--crit-bg);color:var(--crit-ink)}
/* El comercio en negociación no es bueno ni malo: es un caso vivo, y necesita
   un color propio para no confundirse con un cierre ni con una alerta. */
.chip.neg{background:#EEF0FF;color:#3B43FB;border:1px solid #D8DCFF}
/* La coordinación con el banco, en la misma línea de tiempo pero distinguible
   de un vistazo: mismo hilo, otro interlocutor. */
.tl-bbva>.card{border-left:3px solid var(--brand-2)}
.lote-lista{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.lote-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.lote-item:last-child{border-bottom:0}
.lote-item.on{background:var(--surface-2)}
.lote-item input{margin-top:2px;flex:none}
.lote-item>span{display:flex;flex-direction:column;min-width:0}
.lote-item b{font-size:13.5px;font-weight:640}
.lote-item>span>span{font-size:11.5px;color:var(--muted)}
.chip.serious{background:var(--serious-bg);color:var(--serious-ink)}
.chip.info{background:var(--info-bg);color:var(--brand-2)}
.toolbar{display:flex;gap:8px;margin-bottom:11px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{padding-left:34px;border-radius:11px}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.pills{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 5px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.pill.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.cl{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh)}
.cl:active{transform:scale(.995)}
.cl .body{flex:1;min-width:0}
.cl .name{font-weight:670;font-size:14.5px;letter-spacing:-.15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.cl .sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cl .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cl .amt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cl .amt small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--grid)}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;word-break:break-word}
.kv dd.upd{color:var(--good-ink);font-weight:600}
/* En el celular estos cinco números se comían la primera pantalla entera: el
   ejecutivo abría la app para registrar una visita y tenía que pasar por
   encima de las métricas del Analista. Acá van compactos —etiqueta y valor— y
   la línea explicativa de cada uno queda para el escritorio, que es donde de
   verdad se analiza. */
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:11px}
.stat-row .stat{padding:9px 11px}
.stat-row .stat .lbl{font-size:10.5px;letter-spacing:.4px}
.stat-row .stat .val{font-size:21px;margin-top:1px}
.stat-row .stat .sub{display:none}
/* Un número que lleva a su lista tiene que verse tocable, no adivinarse. */
.stat-link{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;display:block}
.stat-link:hover{border-color:var(--brand-2)}
.stat-link .sub b{color:var(--brand-2);font-weight:640}
.stat{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh)}
.stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat .val{font-size:25px;font-weight:730;letter-spacing:-.8px;margin-top:3px;line-height:1.1}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:9px;opacity:.6}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.tl-item{position:relative;margin-bottom:11px}
.tl-item:before{content:"";position:absolute;left:-22px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--s1);border:2px solid var(--card);box-shadow:0 0 0 2px var(--grid)}
.tl-item.cancel:before{background:var(--crit)}
.tl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:6px}
.tl-h .dt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-h .who{font-weight:660;font-size:13.5px}
.quote{border-left:3px solid var(--grid);padding:2px 0 2px 10px;margin:7px 0 0;font-size:13px;color:var(--ink-2)}
.quote b{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;font-weight:700}
.quote.cli{border-left-color:var(--brand-2)}

/* ---- El pop de confirmación de una corrección ----------------------------- */
.corr-lista{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.corr-fila{display:grid;grid-template-columns:82px 1fr 16px 1fr;align-items:center;gap:7px;
  padding:8px 10px;background:var(--surface-2);border:1px solid var(--grid);border-radius:9px;font-size:13px}
.corr-campo{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.corr-antes{color:var(--muted);text-decoration:line-through}
.corr-flecha{color:var(--brand-2);text-align:center;font-weight:700}
.corr-despues{font-weight:660}
@media (max-width:460px){
  .corr-fila{grid-template-columns:1fr 16px 1fr;row-gap:2px}
  .corr-campo{grid-column:1/-1}
}

/* ---- Agenda y catálogo de acciones --------------------------------------- */
.ag-item{border-left:3px solid var(--grid)}
.ag-item.vencida{border-left-color:var(--crit)}
.ag-item.hoy{border-left-color:var(--warn)}
.ag-item.semana{border-left-color:var(--s1)}
.ag-h{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.ag-h .who{font-weight:660;font-size:14px}
.ag-h .dt{font-size:12.5px;color:var(--muted);margin-top:2px}
.ag-acc{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.stat.malo .val{color:var(--crit-ink)}
.huerf{display:flex;flex-wrap:wrap;gap:7px}
.huerf-x{text-align:left;border:1px solid var(--grid);background:var(--surface-1);border-radius:9px;
  padding:7px 10px;cursor:pointer;font:inherit}
.huerf-x:hover{border-color:var(--brand-2)}
.huerf-x b{display:block;font-size:13px;font-weight:640}
.huerf-x span{display:block;font-size:11.5px;color:var(--muted)}
.acc-lista{display:flex;flex-direction:column;gap:8px}
.acc-fila{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.4fr) auto auto;
  gap:8px;align-items:center}
.acc-fila.off{opacity:.5}
.acc-fila input{padding:8px 10px;font-size:14px}
.acc-uso{font-size:11.5px;color:var(--muted);white-space:nowrap}
.acc-nueva{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--grid)}
.acc-nueva input{flex:1;padding:9px 11px;font-size:14px}
@media (max-width:720px){
  .acc-fila{grid-template-columns:1fr auto;row-gap:6px}
  .acc-fila .acc-desc{grid-column:1/-1}
  .acc-nueva{flex-direction:column}
}

/* La leyenda de la Agenda: tres columnas de texto chico, sin marco por dentro.
   No es una alerta ni una tarjeta más, es el pie de página que explica los
   botones de arriba. */
.ag-ley{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:14px}
.ag-ley-x b{display:block;font-size:13px;font-weight:640;margin-bottom:3px}
.ag-ley-x span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.ag-ley-x span b{display:inline;font-size:inherit;color:var(--ink-2);margin:0}
@media (max-width:820px){ .ag-ley{grid-template-columns:1fr;gap:11px} }

/* ---- Incentivos ----------------------------------------------------------
   La llave y el cumplimiento se leen distinto: la primera es un semáforo de
   tres luces, el segundo una tabla. El borde de la tarjeta dice de un vistazo
   si ese ejecutivo tiene el cálculo habilitado. */
.bn-card{border-left:3px solid var(--grid)}
.bn-card.ok{border-left-color:var(--good)}
.bn-card.medio{border-left-color:var(--warn)}
.bn-card.no{border-left-color:var(--crit)}
.bn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bn-sub{font-size:12px;color:var(--muted);margin-top:2px}
.bn-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:15px 0 8px}
.bn-reqs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bn-req{border:1px solid var(--grid);border-radius:10px;padding:10px 12px}
.bn-req.ok{background:var(--good-bg)}
.bn-req.no{background:var(--crit-bg)}
.bn-req-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.bn-req-h b{font-size:13px}
.bn-req-d{font-size:12px;color:var(--ink)}
.bn-req-n{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.bn-obj .falta{opacity:.62}
.bn-det{font-size:11.5px;color:var(--muted);font-weight:400}
.bn-cierre{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--grid)}
.bn-num .k{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.bn-num b{display:block;font-size:26px;font-weight:680;line-height:1.15;margin-top:3px}
.bn-num b.si{color:var(--good-ink)}
.bn-num b.cero{color:var(--muted)}
.bn-num b .sep{color:var(--muted);font-weight:400}
.bn-num .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.bn-params{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bn-params .field{margin:0}
.in-num{width:100%;text-align:right;padding:8px 10px;font-size:14px}
@media (max-width:900px){
  .bn-reqs,.bn-cierre{grid-template-columns:1fr}
  .bn-params{grid-template-columns:repeat(2,1fr)}
}

/* ---- Bitácora de gestiones: control del equipo ---------------------------- */
.seg-periodo{margin-bottom:13px}
.ctrl{padding-bottom:6px}
.ctrl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ctrl-h h3{margin:0}
.ctrl-h .sub{font-size:12px;color:var(--muted)}
.ctrl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.tbl-ctrl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl-ctrl th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:700;padding:0 9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl-ctrl th:first-child{text-align:left}
.tbl-ctrl td{padding:9px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl-ctrl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-ctrl td.fuerte{font-weight:700}
.tbl-ctrl td.nom{font-weight:640}
.tbl-ctrl td.alerta{color:var(--crit-ink);font-weight:650}
.tbl-ctrl .tenue{color:var(--muted);font-weight:500}
.tbl-ctrl tbody tr{cursor:pointer}
.tbl-ctrl tbody tr:hover{background:var(--surface-2)}
.tbl-ctrl tbody tr.on{background:var(--info-bg)}
.tbl-ctrl tbody tr.on td.nom{color:var(--brand-2)}
.tbl-ctrl tbody tr.vacia td{color:var(--muted)}
.ctrl-pie{display:flex;flex-wrap:wrap;gap:6px;padding:11px 0 6px;border-top:1px solid var(--grid);margin-top:4px}
/* En celular la tabla se desliza, pero el nombre se queda fijo a la izquierda:
   si no, se pierde de vista justo la columna que dice de quién es la fila. */
.tbl-ctrl th:first-child,.tbl-ctrl td.nom{position:sticky;left:0;z-index:1;white-space:nowrap;
  background:var(--card);box-shadow:1px 0 0 var(--grid)}
.tbl-ctrl thead th:first-child{background:var(--card)}
.tbl-ctrl tbody tr:hover td.nom{background:var(--surface-2)}
.tbl-ctrl tbody tr.on td.nom{background:var(--info-bg)}
@media (max-width:640px){ .tbl-ctrl th,.tbl-ctrl td{padding:8px 7px} }

/* ---- Encabezado de día ---------------------------------------------------- */
.dia-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:20px 2px 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dia-t{font-size:13px;font-weight:730;letter-spacing:-.2px;text-transform:capitalize}
.dia-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Tarjeta de gestión --------------------------------------------------- */
.ges-cuerpo{display:flex;gap:11px;align-items:flex-start;margin-top:2px}
.ges-texto{flex:1;min-width:0}
.ges-ev{flex:none;width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--ring);cursor:zoom-in}
.ges-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ges-chips:empty{display:none}
.ges-acc{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
@media (max-width:520px){ .ges-ev{width:60px;height:60px} }
.ev-thumb{width:100%;max-height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--ring);margin-top:9px;display:block;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface-1)}
.opt.on{border-color:var(--brand-2);background:var(--info-bg);box-shadow:0 0 0 2px rgba(42,120,214,.14)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center}
.opt.on .rd{border-color:var(--brand-2)}
.opt.on .rd:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand-2)}
.opt b{font-size:14px;font-weight:620;display:block}
.opt span{font-size:12px;color:var(--muted);display:block;margin-top:1px}
/* El recuadro azul queda para la guía que hace falta AHORA, una por tarjeta
   como mucho. Lo demás es .pie, .vacio o va plegado en un details. */
.note{background:var(--info-bg);border-radius:10px;padding:11px 12px;font-size:12.8px;color:var(--ink-2);line-height:1.5}
.note b{color:var(--ink)}
.note.ok{background:var(--good-bg);color:var(--good-ink)} .note.ok b{color:var(--good-ink)}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)} .note.warn b{color:var(--warn-ink)}
.note.crit{background:var(--crit-bg);color:var(--crit-ink)} .note.crit b{color:var(--crit-ink)}
.sticky-actions{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--plane) 62%,transparent);padding:12px 0 4px;display:flex;gap:9px;margin-top:14px}
.sticky-actions .btn{flex:1}
.drop{border:1.5px dashed var(--line);border-radius:11px;padding:20px 14px;text-align:center;cursor:pointer;background:var(--surface-1)}
.drop:hover{border-color:var(--brand-2);background:var(--info-bg)}
.drop .big{font-size:26px;opacity:.55}
.drop p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:112px 1fr 46px;align-items:center;gap:9px;margin-bottom:9px;font-size:13px}
.bar-track{display:block;height:9px;background:var(--grid);border-radius:5px;overflow:hidden}
.bar-fill{display:block;height:9px;border-radius:5px;background:var(--s1);min-width:2px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:670;font-size:12.5px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-sub{font-size:11.5px;color:var(--muted);margin:-5px 0 11px 121px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
/* La bitácora vive dentro de su propio recuadro: crece hasta cierto alto y de
   ahí en adelante se desliza por dentro, para que la página no se alargue. */
.caja-scroll{max-height:min(46vh,420px);overflow:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:12px;background:var(--card);overscroll-behavior:contain}
.caja-scroll table.tbl{font-size:12.5px}
.caja-scroll table.tbl th{position:sticky;top:0;z-index:2;background:var(--card);
  box-shadow:inset 0 -1px 0 var(--line);padding:9px 10px}
.caja-scroll table.tbl td{padding:9px 10px}
.caja-scroll::-webkit-scrollbar{width:10px;height:10px}
.caja-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--card)}
.caja-scroll::-webkit-scrollbar-thumb:hover{background:var(--muted)}
#tblBitacora td:nth-child(4){min-width:120px}
#tblBitacora td:nth-child(5){min-width:260px}
@media(min-width:1180px){ .caja-scroll{max-height:min(52vh,520px)} }
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88dvh;overflow:auto;padding:20px 17px calc(20px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 6px;font-size:17px;text-transform:none;letter-spacing:-.2px}
.modal p{margin:0 0 15px;font-size:13.5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px);background:#0b0b0b;color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:0 8px 26px rgba(0,0,0,.34);max-width:90vw;text-align:center}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--brand-2);font-weight:650;font-size:13.5px;cursor:pointer;padding:2px 0;margin-bottom:9px}
.req{color:var(--crit)}
.mono{font-variant-numeric:tabular-nums}
.cifra-link{background:none;border:0;padding:0;font:inherit;color:var(--brand-2);cursor:pointer;
  font-weight:640;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.cifra-link:hover{text-decoration-style:solid}
.g-ley-x{background:none;border:0;padding:2px 0;font:inherit;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.g-ley-x:hover{color:var(--brand-2)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:11px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* ---------- CABECERA DE PANTALLA ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.page-head h2{margin:0;font-size:20px;font-weight:730;letter-spacing:-.4px;line-height:1.2}
.page-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.page-head .btn{flex:none;width:100%}

/* ---------- BLOQUE DE FILTROS ---------- */
.filtros{background:var(--card);border:1px solid var(--grid);border-radius:var(--r);
  padding:12px;margin-bottom:14px;display:grid;gap:10px}
.filtros-mas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filtros-cuenta{font-size:12.5px;color:var(--muted);margin-left:auto}
.filtros .search{flex:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:640;
  color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.seg button.on{background:var(--card);color:var(--brand-2);box-shadow:var(--sh)}
.seg button:hover:not(.on){color:var(--ink-2)}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fsel{display:block;min-width:0}
.fsel span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.45px;
  color:var(--muted);margin-bottom:4px}
.fsel select{padding:9px 10px;font-size:13.5px}
.filtros-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--grid);padding-top:10px;font-size:12.5px;color:var(--muted)}
.nota-ficha .note{margin:0}
.nota-ficha{padding:11px 12px}

/* ---------- VIÁTICOS ---------- */
/* Un campo de contraseña de 1300 px no ayuda a nadie */
.campo-corto input, .campo-corto select{max-width:360px}
.card .btn.block.limitado{max-width:360px}


/* La lista de comercios se acomoda al ancho disponible */
.cl-grid{display:grid;gap:9px}
.cl-grid .cl{margin-bottom:0}


/* Barra apilada del cierre de gestión */
.g-barra{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--line)}
.g-barra span{display:block;height:100%}
.g-leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}
.g-leyenda span{display:flex;align-items:center;gap:6px}
.g-leyenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.g-leyenda b{color:var(--ink)}

/* ---------- Panel: un reloj y cuatro bloques ----------------------------
   El Panel era una pila de tarjetas sin jerarquía: había que leerlas todas
   para saber cuál contestaba la pregunta. Ahora cada bloque se anuncia. */
.pnl-per{display:grid;gap:9px;margin-bottom:15px}
.pnl-per .seg{width:100%}
.pnl-per .seg button{flex:1}
.pnl-per-txt{font-size:12.5px;color:var(--muted)}
.pnl-per-txt b{color:var(--ink-2);font-weight:640}
.pnl-h{display:flex;align-items:flex-start;gap:10px;margin:22px 2px 11px}
.pnl-h:first-child{margin-top:4px}
.pnl-n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--brand-2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-top:1px}
.pnl-h b{display:block;font-size:15px;font-weight:730;letter-spacing:-.25px;line-height:1.25}
/* Ojo con el selector: el número del bloque también es un span dentro de
   .pnl-h, y «.pnl-h span» le ganaba en especificidad y lo pintaba gris sobre
   azul. Se apunta solo al subtítulo. */
.pnl-h > div span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.4}
/* Lo accionable: número grande, título, y por qué importa */
.pnl-fix{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.pnl-fix-x{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:block}
.pnl-fix-x:hover{border-color:var(--brand-2);background:var(--info-bg)}
.pnl-fix-x .n{display:block;font-size:22px;font-weight:730;letter-spacing:-.6px;line-height:1.1}
.pnl-fix-x .t{display:block;font-size:13px;font-weight:650;margin-top:2px}
.pnl-fix-x .d{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.pnl-fix-x.grave .n{color:var(--crit-ink)}
/* ---- Reporte de avance ---------------------------------------------------
   La pantalla no imita la lámina pixel a pixel: muestra los mismos números y
   los mismos textos, en el idioma visual del CRM. Quien la mira está
   verificando, no presentando; la lámina viene después, con el botón. */
.rep-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:0 2px 14px}
.rep-h .sub{font-size:12.8px;color:var(--muted)}
.rep-acc{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-t{margin-bottom:14px}
.rep-t h3{margin:0 0 3px;font-size:15.5px;letter-spacing:-.25px}
.rep-t span{font-size:12.5px;color:var(--muted);line-height:1.45}
.rep-embudo{display:grid;gap:7px}
.rep-paso{display:grid;grid-template-columns:1fr;gap:2px 10px;align-items:center}
.rep-paso .lbl{font-size:13px;font-weight:680;color:var(--ink)}
.rep-paso .via{height:20px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.rep-paso .via span{display:block;height:100%;border-radius:5px}
.rep-paso .num{font-size:19px;font-weight:760;letter-spacing:-.6px;line-height:1}
.rep-paso .pc{font-size:11.5px;color:var(--muted)}
.rep-paso .cv{font-size:12px;color:var(--muted)}
.rep-aparte{margin-top:12px;padding:9px 12px;border-radius:9px;background:var(--warn-bg);
  color:var(--warn-ink);font-size:12.5px;font-weight:640}
.rep-lecturas{display:grid;gap:10px;margin-top:14px}
.rep-lec{background:var(--surface-2);border-radius:11px;padding:12px 14px}
.rep-lec .t{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
  letter-spacing:-.2px;color:var(--ink)}
.rep-lec .pt{flex:none;width:9px;height:9px;border-radius:50%}
.rep-lec p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.rep-pie{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.5}
.rep-kpis{display:grid;gap:11px}
.rep-kpi{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--card)}
.rep-kpi.falta{border-style:dashed}
.rep-kpi .k-top{display:flex;align-items:flex-start;gap:10px}
.rep-kpi .k-top b{font-size:13.5px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.rep-kpi .k-peso{margin-left:auto;flex:none;color:#fff;font-size:11px;font-weight:750;
  border-radius:999px;padding:2px 9px}
.rep-kpi .k-cifra{font-size:34px;font-weight:780;letter-spacing:-1.2px;line-height:1.1;margin-top:10px}
.rep-kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.rep-kpi .k-filas{margin-top:12px;display:grid;gap:6px}
.rep-kpi .k-filas > div{display:flex;gap:10px;align-items:baseline;font-size:12.3px}
.rep-kpi .k-filas span{color:var(--muted)}
.rep-kpi .k-filas b{margin-left:auto;text-align:right;font-weight:680;white-space:nowrap}
.rep-kpi .k-pie{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--surface-2);
  font-size:12px;font-weight:660;text-align:center}
.rep-cal{margin-top:16px}
.rep-cal .t{font-size:12.5px;font-weight:680;margin-bottom:7px}
.rep-cal .via{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.rep-cal .via span{display:block;height:100%;background:var(--brand-2);border-radius:5px}
.rep-cal .pie{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11.8px;color:var(--muted)}
.rep-cal .pie span:last-child{margin-left:auto;text-align:right}
.rep-hitos{display:grid;gap:11px}
.rep-hito{position:relative;padding-left:20px}
.rep-hito .pt{position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%}
.rep-hito .f{font-size:11.5px;font-weight:730;letter-spacing:.2px;text-transform:uppercase}
.rep-hito .t{font-size:13.5px;font-weight:700;letter-spacing:-.2px;margin-top:1px}
.rep-hito .d{font-size:12.3px;color:var(--muted);line-height:1.5;margin-top:2px}
.rep-relato{margin-top:15px;background:var(--surface-2);border-radius:11px;padding:13px 15px;
  font-size:12.8px;color:var(--muted);line-height:1.6}
.rep-fuente{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}
.rep-fuente > div{background:var(--surface-2);border-radius:10px;padding:11px 12px}
.rep-fuente b{display:block;font-size:21px;font-weight:760;letter-spacing:-.6px;line-height:1.15}
.rep-fuente span{display:block;font-size:11.8px;color:var(--muted);margin-top:2px;line-height:1.4}
.rep-bloque{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;
  border-bottom:1px solid var(--line)}
.rep-bloque:last-of-type{border-bottom:0}
.rep-bloque .txt{flex:1 1 220px}
.rep-bloque .txt b{font-size:14px;letter-spacing:-.1px}
.rep-bloque .txt div{font-size:12.3px;color:var(--muted);margin-top:2px;line-height:1.45}
.rep-sello{display:inline-block;margin-top:4px;font-size:11.3px;color:var(--muted)}
.bn-curva{background:var(--surface-2);border-radius:12px;padding:13px 14px;margin:0 0 13px}
.bn-curva-fila{margin-top:11px}
.bn-curva-fila:first-of-type{margin-top:4px}
.bn-curva-fila .t{font-size:13px;font-weight:680;margin-bottom:6px;display:flex;
  gap:8px;align-items:baseline;flex-wrap:wrap}
.bn-curva-fila .t span{font-size:11.5px;font-weight:500;color:var(--muted)}
.bn-curva-fila .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px}
.bn-curva-fila .ins .field{margin:0}
.bn-curva-fila .ins span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;
  text-transform:capitalize}
.bn-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.bn-top .fsel{flex:1 1 260px}
.bn-top .btn{flex:none}
.bn-fer{display:flex;flex-wrap:wrap;gap:6px}
.bn-fer span{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:640}
.bn-fer span.off{color:var(--muted);font-weight:500;background:transparent}
.rep-llaves{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px 12px;margin-top:9px}
.rep-llaves > div{display:flex;gap:8px;align-items:baseline;font-size:12px;min-width:0}
.rep-llaves code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--brand-2)}
.rep-llaves span{margin-left:auto;text-align:right;color:var(--muted);font-weight:640;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:760px){
  .rep-paso{grid-template-columns:190px 1fr 58px 52px 200px;gap:10px}
  .rep-lecturas{grid-template-columns:1fr 1fr}
  .rep-kpis{grid-template-columns:repeat(3,1fr)}
  .rep-hitos{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
}
/* La explicación que cuelga de una fila de números no necesita su propia
   tarjeta: una tarjeta con un solo enlace adentro se lee como un error. */
details.explica.suelta{border-top:0;margin:-3px 3px 13px;padding-top:0}
.tbl-ctrl tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:700;
  padding-top:10px;color:var(--ink)}
.tbl-ctrl tfoot td.nom{background:var(--card)}
/* En el celular las tres opciones tienen que verse las tres: una que quede
   fuera del borde deslizable es una opción que nadie descubre. */
@media(max-width:759px){ .pnl-per .seg{flex-wrap:wrap;overflow:visible}
  .pnl-per .seg button{flex:1 1 auto;padding:8px 10px} }
@media(min-width:760px){ .pnl-per{grid-template-columns:auto auto 1fr;align-items:end}
  .pnl-per .seg{width:auto} .pnl-per .seg button{flex:none} .pnl-per-txt{text-align:right} }

/* ---------- Guía de uso: la infografía dentro del CRM ---------- */
.g-pasos{display:grid;gap:12px}
.g-paso{display:flex;gap:13px;align-items:flex-start;padding:13px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface-2)}
.g-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px}
.g-t{font-weight:700;font-size:15px;letter-spacing:-.2px}
.g-d{font-size:13px;color:var(--muted);margin-top:2px}
.g-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

.g-formula{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.g-caja{padding:9px 12px;border-radius:11px;font-size:13px;font-weight:650;border:1px solid var(--line);
  background:var(--surface-2)}
.g-caja.res{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.g-mas{font-weight:800;color:var(--muted);font-size:16px}

.g-medios{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}
.g-medio{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;font-size:13px;
  border:1px solid var(--line)}
.g-medio span{font-weight:800;width:16px;text-align:center}
.g-medio.si{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.g-medio.no{background:var(--surface-2);color:var(--muted)}

.g-arbol{display:grid;gap:9px}
.g-rama{padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.g-cond{font-size:13.5px;font-weight:650;margin-bottom:5px}
.g-si,.g-no{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.g-esc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px}
.g-caso{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}
.g-caso-t{font-weight:700;font-size:14px;letter-spacing:-.2px;margin-bottom:8px}
.g-caso-k{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.g-caso-k b{color:var(--muted);font-weight:600;display:inline-block;min-width:104px}
.g-caso-n{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--grid)}

.g-fijos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:7px}
.g-fijo{padding:8px 11px;border-radius:10px;font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-2)}

.g-faq{display:grid;gap:11px}
.g-faq-i{padding-left:12px;border-left:3px solid var(--ring)}
.g-faq-q{font-weight:650;font-size:13.5px}
.g-faq-a{font-size:13px;color:var(--muted);margin-top:3px}

@media(min-width:760px){
  body{font-size:15.5px}
  main{max-width:1080px;margin:0 auto;width:100%;padding:20px 20px 40px}
  /* Con seis pestañas la fila ya no entra en una tablet angosta y empujaba la
     página entera a la derecha. Envuelve: una pestaña en la segunda línea se
     encuentra; una fuera del borde derecho, no. */
  nav.bottom{position:static;border-top:0;border-bottom:1px solid var(--grid);justify-content:center;
    gap:4px;padding:7px 10px;flex-wrap:wrap}
  nav.bottom button{flex:none;flex-direction:row;gap:7px;padding:9px 15px;border-radius:9px;font-size:13.5px}
  nav.bottom button.on{background:var(--info-bg)}
  nav.bottom button .dot{position:static;margin-left:1px}
  .stat-row{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .stat-row .stat{padding:12px 13px}
  .stat-row .stat .lbl{font-size:11px;letter-spacing:.5px}
  .stat-row .stat .val{font-size:25px;margin-top:3px}
  .stat-row .stat .sub{display:block}
  .page-head .btn{width:auto;min-width:230px}
  .sel-row{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .filtros{padding:14px 15px}
  .sticky-actions{bottom:0}
  .tbl-wrap{margin:0;padding:0}
  .modal-bg{align-items:center;padding:22px}
  .modal{border-radius:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start}
  .bar-row{grid-template-columns:158px 1fr 46px}
  .bar-sub{margin-left:167px}
  .aj-dl{grid-template-columns:1fr auto;gap:10px 18px}
  .aj-dl .txt{grid-column:1;grid-row:1}
  .aj-dl > .btn{grid-column:2;grid-row:1;min-width:200px}
  .aj-dl .aj-csv{grid-column:1;grid-row:2}
  .aj-grid{grid-template-columns:repeat(2,1fr);gap:12px;align-items:stretch}
  .aj-grid.una{grid-template-columns:1fr}
  .aj-reglas{grid-template-columns:repeat(2,1fr);column-gap:28px}
}

/* ---------- LAPTOP: se aprovecha el ancho de la ventana ----------
   La pantalla de una laptop es cuatro veces más ancha que la de un celular.
   A partir de acá el contenido deja de ser una columna larga y se reparte,
   sin llegar nunca a estirar el texto de borde a borde: eso cansa de leer. */
@media(min-width:1180px){
  main{max-width:1400px;padding:24px 28px 48px}
  .card{padding:18px 20px}
  .cl-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cl{padding:14px 15px}
  .stat-row{gap:12px}

  /* Formularios y ajustes fluyen en dos columnas. Las tarjetas nunca se
     parten a la mitad. */
  .view-form, .view-cols{column-count:2;column-gap:18px}
  .view-form > *, .view-cols > *{break-inside:avoid}
  .view-form > .back,
  .view-form > .sticky-actions{column-span:all}
  .view-form > .card:first-of-type{column-span:all}
  /* Las tarjetas con tabla, y las marcadas como anchas, ocupan todo el ancho:
     así las columnas se reparten parejo en vez de dejar un hueco largo. */
  .view-cols > .card:has(.tbl-wrap),
  .view-cols > .card.ancho{column-span:all}
  .kv-cols{column-count:2;column-gap:26px}
  .kv-cols .kv{break-inside:avoid}

  /* Ajustes: rejilla explícita. Dos tarjetas por fila, misma altura de fila,
     sin los huecos que dejaba el masonry. La pantalla no se estira de borde a
     borde —un panel de configuración a 1600px de ancho no se lee mejor, se lee
     peor: los botones quedan del largo de la mesa y el ojo pierde la columna. */
  .view-ajustes{max-width:1020px;margin:0 auto}
  .aj-grid{grid-template-columns:repeat(2,1fr);gap:13px;align-items:stretch}
  .aj-grid.una{grid-template-columns:1fr}
  .aj-sec{margin-bottom:26px}
  .aj-sec > .aj-h h2{font-size:16.5px}
  .aj-reglas{grid-template-columns:repeat(2,1fr);column-gap:32px}
  .aj-yo .quien b{font-size:16.5px}
  .aj-acc{justify-content:flex-start}
  .aj-acc .btn{flex:0 0 auto;min-width:150px}
  .view-form .sticky-actions{position:static;justify-content:flex-end;
    background:none;border-top:1px solid var(--grid);padding-top:14px}
  .view-form .sticky-actions .btn{flex:none;min-width:210px}

  /* El historial deja de ser una tira angosta con la mitad de la pantalla
     vacía: las tarjetas se reparten en columnas. */
  .tl-lectura{max-width:none;column-count:2;column-gap:14px}
  .tl-lectura .tl-item{break-inside:avoid;-webkit-column-break-inside:avoid}
  .tl-lectura .tl-item:before{display:none}
  .tl-lectura.tl{padding-left:0}
  .tl-lectura.tl:before{display:none}

  /* El texto largo no se estira de lado a lado */
  .note, .quote{max-width:820px}
  .view-form .note, .view-form .quote{max-width:none}
  .ev-thumb{max-width:420px}
  .campo-corto input, .campo-corto select{max-width:420px}
}

/* ---------- MONITOR: una columna más ---------- */
@media(min-width:1560px){
  main{max-width:1680px;padding:26px 32px 52px}
  .cl-grid{grid-template-columns:repeat(3,1fr)}
  .stat .val{font-size:28px}
  .view-form, .view-cols{column-count:3;column-gap:18px}
  .tl-lectura{column-count:3}
  .kv-cols{column-count:3}
  .view-ajustes{max-width:1140px}
  .grid2{gap:14px}
}

/* ---------- PANTALLA GRANDE: se usa casi todo el ancho ---------- */
@media(min-width:1900px){
  main{max-width:min(1880px, 94vw)}
  .cl-grid{grid-template-columns:repeat(4,1fr)}
  .sel-row{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}
</style>

<div id="login"></div>
<div id="app" class="hidden">
  <header class="top">
    <div class="mark">S</div>
    <h1 id="topTitle">Stratis CRM<small id="topSub">BBVA Adquirencia</small></h1>
    <button class="icon-btn pulso" id="btnSync" data-estado="tibio" title="Actualizar ahora"><i></i></button>
    <button class="icon-btn" id="btnTheme" title="Tema">◐</button>
    <button class="icon-btn" id="btnUser" title="Cuenta">▾</button>
  </header>
  <nav class="bottom" id="nav"></nav>
  <main id="view"></main>
</div>

/* ---- Medio de contacto (los ids coinciden con el trigger en SQL) -------- */

/* ---- Resultado del intento — es lo que separa intentar de lograr -------
   Ojo con la palabra: acá "logrado" es que el cliente respondió, no que se

const RESULTADOS = [
  { id:"efectivo",        label:"El cliente respondió",  desc:"Contestó la llamada, respondió el mensaje o te atendió en el local", ok:true  },

];

const esEfectivo = id => id === "efectivo";

/* Medios donde el mensaje sale sin que nadie lo conteste todavía. Ahí decir
   que el cliente respondió obliga a transcribir su respuesta: si respondió,

const MEDIOS_ASINCRONICOS = ["correo", "whatsapp"];

/* Una gestión se registra el día que ocurrió o después —nunca antes—. Hacia
   atrás no hay tope: sirve para poner al día lo que se quedó sin registrar. */
const fechaFutura = fecha => !!fecha && String(fecha) > hoyISO();
const diasDeAtraso = fecha => {
  if (!fecha) return 0;
  const d = (new Date(hoyISO()) - new Date(String(fecha))) / 86400000;
  return d > 0 ? Math.round(d) : 0;
};
const textoDias = n => n === 1 ? "1 día" : n + " días";

/* Ventana temporal de corrección. La fecha vive en la base (config), así que
   se cierra sola: acá solo se lee para saber qué mostrar. */
let EDICION_HASTA = null;
const edicionLibre = () => !!EDICION_HASTA && new Date() < new Date(EDICION_HASTA);
function textoVentana(){
  if (!edicionLibre()) return "";
  const d = new Date(EDICION_HASTA);
  return `Hoy hasta las ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

/* La ubicación de un registro presencial tiene cuatro estados, y confundirlos
   costaba caro: una gestión con la coordenada escrita a mano aparecía igual
   que una sin ninguna ubicación.

     gps        el equipo la midió en el local y en el momento — es la que
                respalda la visita ante BBVA
     declarada  alguien la escribió después: sirve para ubicar el comercio en
                el mapa, pero no prueba que se estuvo ahí
     exenta     la visita ya pasó y la coordenada no se puede recuperar; la
                supervisión lo aceptó por escrito, con motivo y firma
     falta      no hay ninguna coordenada y nadie la eximió

   «Sin ubicación» a secas significa el último. Los otros dos se cuentan
   aparte: ninguno vale como respaldo de GPS, pero tampoco son un descuido. */
function estadoUbicacion(r){
  if (!RULES.requiereUbicacion(r.Tipo_Contacto)) return "";
  if (r.Ubicacion_Verificada === true) return "gps";
  if (String(r.Ubicacion || "").trim()) return "declarada";
  /* La visita ya pasó y la coordenada no se puede recuperar. La supervisión
     lo aceptó por escrito: no es un hueco, es una excepción con motivo. Se
     cuenta aparte de las que sí trajeron GPS, nunca junto a ellas. */
  return r.Ubicacion_Exenta === true ? "exenta" : "falta";
}
const sinUbicacion         = r => estadoUbicacion(r) === "falta";
const ubicacionDeclarada   = r => estadoUbicacion(r) === "declarada";
const ubicacionExenta      = r => estadoUbicacion(r) === "exenta";
/* Sigue existiendo para lo que de verdad mide respaldo de GPS: una declarada
   no cuenta como verificada. */
const sinUbicacionVerificada = r =>
  RULES.requiereUbicacion(r.Tipo_Contacto) && r.Ubicacion_Verificada !== true
  && !ubicacionExenta(r);

const CALIFICACIONES = [
  { id:"A", label:"A — Muy interesado", desc:"Cliente receptivo, alta probabilidad de retención" },
  { id:"B", label:"B — Interesado",     desc:"Abierto a la propuesta, requiere seguimiento" },
  { id:"C", label:"C — Neutral",        desc:"Escucha pero no se compromete" },
  { id:"D", label:"D — En riesgo",      desc:"Manifiesta molestia o evalúa a la competencia" },
  { id:"E", label:"E — Perdido",        desc:"Decidido a retirarse o ya migró" }
];

/* Cómo se contactó al ejecutivo de BBVA para confirmar los datos del comercio.
   Un comercio de cartera no aparece solo: alguien coordinó con el banco antes
   de registrarlo. Sin este dato no se puede dar de alta. No aplica a ventas
   nuevas: ahí todavía no hay ejecutivo BBVA de por medio. */
const CONTACTO_BBVA = [
  { id:"CORREO",   label:"Correo enviado",      desc:"Se le escribió al ejecutivo de BBVA y confirmó los datos" },
  { id:"LLAMADA",  label:"Llamada telefónica",  desc:"Se coordinó por teléfono con el ejecutivo de BBVA" },
  { id:"WHATSAPP", label:"Mensaje WhatsApp",    desc:"Se coordinó por WhatsApp con el ejecutivo de BBVA" },
  { id:"VISITA",   label:"Visita presencial",   desc:"Se fue a las oficinas de BBVA y se coordinó en persona" },
  { id:"CHAT",     label:"Chat BBVA",           desc:"Se coordinó por el chat interno del banco" }
];
const nomContactoBBVA = id => (CONTACTO_BBVA.find(x => x.id === id) || {}).label || "";

/* ---- La coordinación con el ejecutivo de BBVA, ahora como interacción ----
   Hasta acá el banco vivía en un sello: un campo con un valor, puesto al crear
   la ficha y nunca más. Servía para decir por dónde se coordinó, pero no
   cuándo, ni si el ejecutivo contestó, ni qué se coordinó. Y en esta campaña
   —donde el comercio ya tenía el servicio y sus datos los entrega el banco—
   ahí es justamente donde se está yendo el volumen: 841 asignados, 601 con
   respuesta, 82 contactados.

   La decisión de forma: las coordinaciones con BBVA viven en la MISMA tabla
   que las gestiones con el cliente, para que cada comercio tenga una sola
   línea de tiempo del registro al cierre. Y para que ninguna cuenta de la
   campaña se mueva sola, usan un vocabulario propio en las mismas columnas:
   medios que empiezan con «bbva_» y resultados que ningún cálculo existente
   reconoce. Así el trigger que decide si una gestión cumple visita nunca las
   ve como visita, el que exige respaldo para cerrar nunca las cuenta como
   contacto logrado, y la tasa de respuesta al cliente sigue midiendo clientes.
   Nada de eso hubo que tocarlo: simplemente no coinciden. */
const MEDIOS_BBVA = [
  { id:"bbva_correo",     label:"Correo enviado",     desc:"Se le escribió al ejecutivo de BBVA" },
  { id:"bbva_chat",       label:"Chat BBVA",          desc:"Se coordinó por el chat interno del banco", exigeCorreo:true },
  { id:"bbva_llamada",    label:"Llamada telefónica", desc:"Se coordinó por teléfono" },
  { id:"bbva_whatsapp",   label:"Mensaje WhatsApp",   desc:"Se coordinó por WhatsApp" },
  { id:"bbva_presencial", label:"Visita presencial",  desc:"Se fue a las oficinas de BBVA" }
];
const esMedioBBVA  = id => String(id || "").startsWith("bbva_");
const nomMedioBBVA = id => (MEDIOS_BBVA.find(x => x.id === id) || {}).label || "";
/* El chat no deja rastro consultable, así que la campaña exige mandar después
   un correo de respaldo. El CRM no se limita a permitirlo: lo reclama. */
const exigeRespaldo = id => !!(MEDIOS_BBVA.find(x => x.id === id) || {}).exigeCorreo;

const RESULTADOS_BBVA = [
  { id:"bbva_respondio",     label:"Respondió",     desc:"El ejecutivo de BBVA contestó y confirmó los datos del comercio", ok:true },
  { id:"bbva_sin_respuesta", label:"Sin respuesta", desc:"Todavía no ha contestado", ok:false }
];
const respondioBBVA = r => r === "bbva_respondio";
const nomResultadoBBVA = id => (RESULTADOS_BBVA.find(x => x.id === id) || {}).label || "";

/* Para qué fue la interacción. Sin esto, «2do contacto» significa dos cosas
   opuestas —que el banco no contestó y hubo que insistir, o que el ejecutivo
   cumplió con el correo de respaldo del chat— y sumadas en una sola columna no
   dicen nada. */
const PROPOSITOS_BBVA = [
  { id:"primer_contacto", label:"Primer contacto",    desc:"La primera vez que se le escribe por este comercio" },
  /* El propio Jose lo describió así: «al registrar un customer id se marca el
     medio de contacto con el ejecutivo BBVA; luego, la 2da interacción debería
     ser si el ejecutivo respondió». La respuesta es un hecho aparte, con su
     propia fecha —contactar no es que te contesten—, así que se registra como

  { id:"respuesta",       label:"Respuesta del banco", desc:"El ejecutivo contestó un contacto anterior y entregó los datos" },
  { id:"respaldo_chat",   label:"Respaldo del chat",  desc:"El correo que deja constancia de lo coordinado por chat" },
  { id:"insistencia",     label:"Insistencia",        desc:"Se vuelve a escribir porque no ha respondido" },
  { id:"negociacion",     label:"Negociación",        desc:"Consulta al banco por tasa, POS, equipos o comisión" }
];
const nomProposito = id => (PROPOSITOS_BBVA.find(x => x.id === id) || {}).label || "";

/* Por qué se está negociando. Lista cerrada, como los motivos de pérdida: un
   campo libre se llena de textos que después no se pueden agrupar. */
const MOTIVOS_NEGOCIACION = [
  { id:"TASA",     label:"Tasa",             desc:"El comercio pide una tasa menor" },
  { id:"POS",      label:"POS adicional",    desc:"Pide más terminales" },
  { id:"EQUIPO",   label:"Cambio de equipo", desc:"Pide reemplazo o actualización del terminal" },
